<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="新传考研334与440章节刷题和知识点"><title>新传研习室｜334 · 440</title><style>
:root{--g:#174a38;--p:#f5f2eb;--card:#fbfaf6;--ink:#17231d;--red:#b64b36;--line:#d9d4c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.serif{font-family:"Songti SC",Georgia,serif}.wrap{max-width:1180px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:8;background:#f5f2ebee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}header .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand b{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:10px;border-radius:11px;background:var(--g);color:white}.tabs{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:99px}.tabs button{border:0;border-radius:99px;background:transparent;padding:8px 15px}.tabs .on{background:var(--g);color:#fff}.hero{background:var(--g);color:#fff;padding:76px 0 94px}.hero small,.eyebrow{font:700 11px ui-monospace;letter-spacing:.13em;color:#dcb65a}.hero h1{font-size:clamp(44px,7vw,76px);line-height:1.08;margin:18px 0}.hero h1 span{color:#e2bd62}.hero p{max-width:620px;color:#d4dfd9;font-size:18px}.hero button,.primary{border:0;border-radius:11px;background:#dcb65a;padding:13px 20px;font-weight:800}.summary{margin-top:-36px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #17231d0b}.card strong.big{display:block;font-size:38px}.feature{margin:24px auto 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.feature button{text-align:left;min-height:230px}.feature h2{font-size:32px;margin:45px 0 6px}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.toolbar select,.search{height:46px;border:1px solid #cbc4b6;border-radius:10px;background:var(--card);padding:0 12px}.practice{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;padding-bottom:60px}.question h2{font-size:28px;line-height:1.5}.tags span{display:inline-block;background:#e4ebe6;color:#315342;border-radius:99px;padding:4px 9px;margin:0 5px 5px 0;font-size:12px;font-weight:800}.question textarea{width:100%;min-height:300px;border:1px solid #cbc4b6;border-radius:12px;background:white;padding:18px;line-height:1.9}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.ghost,.primary{border:1px solid #cbc4b6;border-radius:10px;background:var(--card);padding:10px 14px}.primary{background:var(--g);color:#fff;border-color:var(--g)}.answer{max-height:75vh;overflow:auto}.answer label{display:block;background:#efece4;border-radius:9px;padding:9px;margin:7px 0}.answer input{accent-color:var(--g)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:60px}.k h2{font-size:25px;margin:8px 0}.k details{margin-top:12px}.k summary{font-weight:800;color:var(--g);cursor:pointer}.muted{color:#68736b}.search{width:100%}.topline{display:flex;align-items:end;justify-content:space-between;margin-top:30px}.notice{font-size:12px;color:#68736b}.heart{color:var(--red)}@media(max-width:760px){.brand span{display:none}.summary,.feature,.practice,.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.hero{padding:50px 0 74px}.answer{max-height:none}.card{padding:18px}}
</style></head><body><header><div class="wrap"><div class="brand"><b>研</b><span>新传研习室</span></div><div class="tabs"><button data-tab="practice">刷题</button><button data-tab="knowledge">知识点</button></div><span class="notice">本机保存</span></div></header>
<main id="home"><section class="hero"><div class="wrap"><small>334 · 440 NEWS & COMMUNICATION</small><h1 class="serif">把知识，练成<br><span>考场上的答案</span></h1><p>按章节拆解理论，用采分点复盘主观题。500 道题与 250 个知识点，覆盖通用 334 + 440。</p><button data-go="practice">开始刷题 →</button></div></section><div class="wrap"><div class="summary"><div class="card"><small class="eyebrow">学习进度</small><h2 class="serif">继续今天的训练</h2><p id="progress">已完成 0 / 500 题</p></div><div class="card"><strong class="big serif" id="wrongCount">0</strong><span class="muted">待复刷错题</span></div><div class="card"><strong class="big serif" id="favCount">0</strong><span class="muted">已收藏题目</span></div></div><div class="feature"><button class="card" data-go="practice"><small class="eyebrow">01</small><h2 class="serif">章节刷题</h2><p class="muted">筛选、作答、采分点自评、错题与收藏。</p></button><button class="card" data-go="knowledge"><small class="eyebrow">02</small><h2 class="serif">知识点</h2><p class="muted">定义、答题框架、易错辨析与关联练习。</p></button></div></div></main>
<main id="practice" class="hidden wrap"><div class="topline"><div><small class="eyebrow">CHAPTER PRACTICE</small><h1 class="serif">章节刷题</h1></div><span id="counter"></span></div><div class="toolbar"><select id="exam"><option>全部</option><option>334</option><option>440</option><option>通用</option></select><select id="subject"></select><select id="type"><option>全部</option><option>名词解释</option><option>简答题</option><option>论述题</option><option>材料分析题</option><option>实务题</option></select><button class="ghost" id="random">随机一题</button></div><div class="practice"><article class="card question"><div class="tags" id="tags"></div><p class="muted" id="chapter"></p><h2 class="serif" id="prompt"></h2><textarea id="answer" placeholder="先列框架，再补充理论、案例与评价……"></textarea><div class="row"><button class="ghost" id="prev">← 上一题</button><button class="primary" id="submit">提交并对照答案</button><button class="primary hidden" id="next">下一题 →</button></div></article><aside><div class="card"><div class="row"><b>本题状态</b><button class="ghost heart" id="favorite">♡ 收藏</button></div><p id="score">自评分 0%</p></div><div class="card answer hidden" id="answerPanel"><small class="eyebrow">参考答案</small><p id="reference" style="white-space:pre-line"></p><h3>采分点自评</h3><div id="points"></div><p id="pitfall"></p><small id="source" class="muted"></small></div></aside></div></main>
<main id="knowledge" class="hidden wrap"><div class="topline"><div><small class="eyebrow">KNOWLEDGE ATLAS</small><h1 class="serif">知识点</h1></div><span id="kcount"></span></div><div class="toolbar"><input class="search" id="search" placeholder="搜索概念、理论或关键词"><select id="ksubject"></select></div><div class="grid" id="kgrid"></div></main>
<script>window.DATA={knowledge:[],questions:[]}</script><script src="knowledge-1.js"></script><script src="knowledge-2.js"></script><script src="knowledge-3.js"></script><script src="knowledge-4.js"></script><script src="knowledge-5.js"></script><script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="questions-6.js"></script><script src="questions-7.js"></script><script src="questions-8.js"></script><script src="questions-9.js"></script><script src="questions-10.js"></script><script>const DATA=window.DATA;const $=s=>document.querySelector(s),state=JSON.parse(localStorage.getItem('xcyx-static')||'{}');let view='home',idx=0,filtered=DATA.questions;const subjects=['全部',...new Set(DATA.knowledge.map(x=>x.subject))];function save(){localStorage.setItem('xcyx-static',JSON.stringify(state));stats()}function stats(){const a=Object.values(state),d=a.filter(x=>x.done).length,w=a.filter(x=>x.wrong).length,f=a.filter(x=>x.favorite).length;$('#progress').textContent='已完成 '+d+' / 500 题';$('#wrongCount').textContent=w;$('#favCount').textContent=f}function show(v){view=v;['home','practice','knowledge'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==v));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===v));if(v==='practice')renderQ();if(v==='knowledge')renderK();scrollTo(0,0)}document.querySelectorAll('[data-go],[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.go||b.dataset.tab));['subject','ksubject'].forEach(id=>$('#'+id).innerHTML=subjects.map(x=>'<option>'+x+'</option>').join(''));function filter(){filtered=DATA.questions.filter(q=>($('#exam').value==='全部'||q.exam===$('#exam').value)&&($('#subject').value==='全部'||q.subject===$('#subject').value)&&($('#type').value==='全部'||q.type===$('#type').value));idx=0;renderQ()}['exam','subject','type'].forEach(id=>$('#'+id).onchange=filter);function renderQ(){const q=filtered[idx]||DATA.questions[0],s=state[q.id]||{};$('#counter').textContent=(idx+1)+' / '+filtered.length;$('#tags').innerHTML=[q.exam,q.subject,q.type,q.difficulty].map(x=>'<span>'+x+'</span>').join('');$('#chapter').textContent=q.chapter;$('#prompt').textContent=q.prompt;$('#answer').value=s.answer||'';$('#answer').disabled=!!s.done;$('#favorite').textContent=s.favorite?'♥ 已收藏':'♡ 收藏';$('#score').textContent='自评分 '+(s.score||0)+'%';$('#answerPanel').classList.toggle('hidden',!s.done);$('#submit').classList.toggle('hidden',!!s.done);$('#next').classList.toggle('hidden',!s.done);if(s.done){$('#reference').textContent=q.answer;$('#pitfall').innerHTML='<b>易错提醒：</b>'+q.pitfall;$('#source').textContent='依据：'+q.source;$('#points').innerHTML=q.keyPoints.map((p,i)=>'<label><input type="checkbox" data-i="'+i+'" '+((s.checks||[])[i]?'checked':'')+'> '+p+'</label>').join('');document.querySelectorAll('#points input').forEach(c=>c.onchange=()=>{const checks=[...document.querySelectorAll('#points input')].map(x=>x.checked),score=Math.round(checks.filter(Boolean).length/checks.length*100);state[q.id]={...state[q.id],checks,score,wrong:score<60};save();renderQ()})}}$('#submit').onclick=()=>{const q=filtered[idx];state[q.id]={...state[q.id],answer:$('#answer').value,done:true,wrong:true,score:0,checks:[]};save();renderQ()};$('#favorite').onclick=()=>{const q=filtered[idx];state[q.id]={...state[q.id],answer:$('#answer').value,favorite:!state[q.id]?.favorite};save();renderQ()};$('#prev').onclick=()=>{idx=(idx-1+filtered.length)%filtered.length;renderQ()};$('#next').onclick=()=>{idx=(idx+1)%filtered.length;renderQ()};$('#random').onclick=()=>{idx=Math.floor(Math.random()*filtered.length);renderQ()};function renderK(){const term=$('#search').value.trim(),sub=$('#ksubject').value;const list=DATA.knowledge.filter(k=>(sub==='全部'||k.subject===sub)&&(!term||k.title.includes(term)||k.definition.includes(term)));$('#kcount').textContent=list.length+' 个知识点';$('#kgrid').innerHTML=list.map(k=>'<article class="card k"><small class="eyebrow">'+k.subject+'</small><h2 class="serif">'+k.title+'</h2><p class="muted">'+k.definition+'</p><details><summary>展开答题框架</summary><ol>'+k.framework.map(x=>'<li>'+x+'</li>').join('')+'</ol><p>'+k.expression+'</p></details><button class="ghost" data-k="'+k.id+'">练相关题 →</button></article>').join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{filtered=DATA.questions.filter(q=>q.knowledgeId===b.dataset.k);idx=0;show('practice')})}$('#search').oninput=renderK;$('#ksubject').onchange=renderK;stats();</script></body></html>
