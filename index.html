476"}},{"id":"rk214","subject":"广告公关","chapter":"广告公关 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：基于行为、语境和动机研究，对目标人群尚未被充分满足的真实张力作出的可行动解释？","options":["消费者洞察","整合营销传播","AIDMA模型","事件营销"],"answers":["消费者洞察"],"explanation":"消费者洞察是基于行为、语境和动机研究，对目标人群尚未被充分满足的真实张力作出的可行动解释。它不是人口统计描述或一句‘用户喜欢便宜’，而要揭示人们为何这样选择及品牌能介入什么。 单个访谈金句不能代表群体，需多方法验证。","knowledgeId":"k214","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk215","subject":"广告公关","chapter":"广告公关 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：品牌希望通过信息和表现方式满足受众需要、形成态度或促进行动的核心说服方向，可分理性、感性及其组合？","options":["广告诉求","品牌定位","AISAS模型","公益广告"],"answers":["广告诉求"],"explanation":"广告诉求是品牌希望通过信息和表现方式满足受众需要、形成态度或促进行动的核心说服方向，可分理性、感性及其组合。有效诉求必须与产品证据、目标人群和购买情境匹配。 高涉入产品仅靠情感可能缺证据，低涉入产品堆参数也可能无效。","knowledgeId":"k215","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk221","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：形式、功能和用户体验与所处媒介内容相融合的付费传播，但本质仍是广告？","options":["原生广告","AISAS模型","公共关系","广告诉求"],"answers":["原生广告"],"explanation":"原生广告是形式、功能和用户体验与所处媒介内容相融合的付费传播，但本质仍是广告。它可减少干扰、提高相关性，却容易因‘像新闻’而模糊商业身份，必须清晰、持续、可理解地标识。 只在文末小字写‘合作’不足以让普通用户识别商业性质。","knowledgeId":"k221","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk223","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：利用自动化系统和数据，在毫秒级竞价或预设规则下完成广告库存购买、受众匹配和投放优化？","options":["程序化广告","信息流广告","形象修复理论","品牌形象论"],"answers":["程序化广告"],"explanation":"程序化广告是利用自动化系统和数据，在毫秒级竞价或预设规则下完成广告库存购买、受众匹配和投放优化。它提高效率与精准度，也带来数据链不透明、广告欺诈、品牌安全和歧视问题。 机器精准不代表真人看到，机器人流量和不可见曝光会虚增指标。","knowledgeId":"k223","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk224","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：利用消费者数据、细分模型和实时反馈，将差异化产品或信息送达更可能需要的人群，以提高相关性与转化？","options":["精准营销","程序化广告","整合营销传播","ROI理论"],"answers":["精准营销"],"explanation":"精准营销是利用消费者数据、细分模型和实时反馈，将差异化产品或信息送达更可能需要的人群，以提高相关性与转化。精准依赖数据质量和合法性，并可能造成隐私侵入、价格歧视和排除。 相关用户更易转化不说明广告造成转化，需对照实验。","knowledgeId":"k224","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk226","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：品牌策划、借势或参与具有新闻性和公众关注的事件，以获得传播并建立品牌关联的策略？","options":["事件营销","体验营销","品牌资产","AISAS模型"],"answers":["事件营销"],"explanation":"事件营销是品牌策划、借势或参与具有新闻性和公众关注的事件，以获得传播并建立品牌关联的策略。成功需品牌相关、时机恰当并有实际行动支撑；借灾难、悲剧和公共议题炒作会引发伦理反噬。 速度快不等于判断对，灾难借势应以帮助和信息为先。","knowledgeId":"k226","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk228","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：组织通过研究、沟通和行动与利益相关者建立理解、信任与互惠关系的管理职能？","options":["公共关系","公益广告","广告诉求","信息流广告"],"answers":["公共关系"],"explanation":"公共关系是组织通过研究、沟通和行动与利益相关者建立理解、信任与互惠关系的管理职能。它不只是媒体曝光或危机灭火，需把公众反馈带入组织决策，并以真实行动解决关系问题。 把不同公众只当作‘受众’会忽视其谈判权和利益冲突。","knowledgeId":"k228","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk229","subject":"广告公关","chapter":"广告公关 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：组织在高不确定、高风险和强关注事件中，及时确认事实、保护受影响者、协调行动并修复信任的沟通过程？","options":["危机传播","公共关系","USP理论","程序化广告"],"answers":["危机传播"],"explanation":"危机传播是组织在高不确定、高风险和强关注事件中，及时确认事实、保护受影响者、协调行动并修复信任的沟通过程。原则包括速度、准确、同理、行动与一致，必须区分已知、未知和下一次更新时间。 抢快猜原因和拖延等待‘全部查清’都可能放大危机。","knowledgeId":"k229","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk232","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：信息跨文化传播后产生的可验证结果，包括目标受众的到达、理解、信任、互动、议题进入和行为影响，而非单纯统计海外曝光量？","options":["国际传播效能","文化出海","具身智能传播","数据跨境传播"],"answers":["国际传播效能"],"explanation":"国际传播效能是信息跨文化传播后产生的可验证结果，包括目标受众的到达、理解、信任、互动、议题进入和行为影响，而非单纯统计海外曝光量。评估需区分短期传播指标与长期关系、认知和声誉变化。 以国内视角直译口号，可能语言正确却无法进入当地经验。","knowledgeId":"k232","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk233","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：以文档、数据、测试和问责程序，检查自动化系统的目标、训练数据、输出差异、风险控制与合规性的过程，可由内部、第三方或监管机构实施？","options":["算法审计","乡村振兴传播","数字中国叙事","科技伦理传播"],"answers":["算法审计"],"explanation":"算法审计是以文档、数据、测试和问责程序，检查自动化系统的目标、训练数据、输出差异、风险控制与合规性的过程，可由内部、第三方或监管机构实施。它不仅检查代码，也审查制度和社会后果。 只让开发者自评平均准确率，可能掩盖特定群体的高错误率。","knowledgeId":"k233","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk235","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：文化产品、符号、产业与价值在跨文化市场中被接触、理解、再创造并形成持续关系的过程？","options":["文化出海","银发群体数字融入","全球南方传播","国际传播效能"],"answers":["文化出海"],"explanation":"文化出海是文化产品、符号、产业与价值在跨文化市场中被接触、理解、再创造并形成持续关系的过程。成功不等于国内内容加字幕出口，需要处理文化折扣、本地规则、渠道生态和共同创作。 为迎合市场抹去文化特征，会得到可替代的泛化产品。","knowledgeId":"k235","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk236","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕产业、人才、文化、生态和组织振兴开展的信息服务、公共参与与形象建构？","options":["乡村振兴传播","微短剧治理","平台内容治理","算法审计"],"answers":["乡村振兴传播"],"explanation":"乡村振兴传播是围绕产业、人才、文化、生态和组织振兴开展的信息服务、公共参与与形象建构。农民应是知识和利益主体，而非被观看的背景；传播要与产业能力、公共服务和社区协商相连接。 网红化猎奇可能制造短期流量，却固化贫困想象并扰乱社区。","knowledgeId":"k236","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk238","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：让老年人有能力、有条件并有选择地使用数字服务，同时保留线下渠道和获得帮助的权利？","options":["银发群体数字融入","智能体传播","数字遗产","文化出海"],"answers":["银发群体数字融入"],"explanation":"银发群体数字融入是让老年人有能力、有条件并有选择地使用数字服务，同时保留线下渠道和获得帮助的权利。它涵盖设备接入、可用性、技能、安全、社会支持与制度包容。 一次培训或发手机不能解决流程复杂、恐惧诈骗和无人协助。","knowledgeId":"k238","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk239","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：对短时长、强情节网络视听内容的制作、分发、商业化与社会风险实行全链条规则？","options":["微短剧治理","具身智能传播","数据跨境传播","乡村振兴传播"],"answers":["微短剧治理"],"explanation":"微短剧治理是对短时长、强情节网络视听内容的制作、分发、商业化与社会风险实行全链条规则。治理对象不仅是单部作品，还包括付费诱导、算法放大、版权、未成年人保护和平台责任。 一刀切下架会把问题推向地下，也可能压缩正常创作。","knowledgeId":"k239","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk240","subject":"前沿热点","chapter":"前沿热点 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：对模型数据、训练开发、内容生成、部署应用和社会影响实行分级、全生命周期管理，以促进创新同时控制虚假、偏见、隐私、版权、安全与责任风险？","options":["生成式AI治理","全球南方传播","国际传播效能","微短剧治理"],"answers":["生成式AI治理"],"explanation":"生成式AI治理是对模型数据、训练开发、内容生成、部署应用和社会影响实行分级、全生命周期管理，以促进创新同时控制虚假、偏见、隐私、版权、安全与责任风险。 同一模型用于娱乐和医疗建议的风险不同，不能用一套门槛管理。","knowledgeId":"k240","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk243","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕数字基础设施、治理、产业与日常生活讲述中国数字化进程的意义框架？","options":["数字中国叙事","数字遗产","文化出海","具身智能传播"],"answers":["数字中国叙事"],"explanation":"数字中国叙事是围绕数字基础设施、治理、产业与日常生活讲述中国数字化进程的意义框架。有效叙事需把宏观战略落到具体人物、制度机制和可核验证据，同时呈现效率、普惠与风险治理。 只罗列平台数量和技术突破，会形成成绩清单而缺少因果与可信度。","knowledgeId":"k243","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk244","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：政府、居民、媒体、企业和游客共同建构城市认知、情感与声誉的过程？","options":["城市形象传播","数据跨境传播","乡村振兴传播","数字中国叙事"],"answers":["城市形象传播"],"explanation":"城市形象传播是政府、居民、媒体、企业和游客共同建构城市认知、情感与声誉的过程。它应建立在城市真实体验、公共服务和地方文化上，而不是单向口号包装。 追逐网红标签可能造成同质化、过度旅游和居民生活被挤压。","knowledgeId":"k244","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk246","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：平台依据法律、社区规则和人权原则，对内容生产、推荐、变现、举报与申诉实施规则的体系？","options":["平台内容治理","主流媒体系统性变革","银发群体数字融入","全球南方传播"],"answers":["平台内容治理"],"explanation":"平台内容治理是平台依据法律、社区规则和人权原则，对内容生产、推荐、变现、举报与申诉实施规则的体系。它包含删除之外的降权、提示、分级、去变现和用户控制，并须兼顾安全与表达权。 规则模糊和秘密降权会造成选择性执法与寒蝉效应。","knowledgeId":"k246","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk247","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：对侮辱诽谤、威胁、人肉搜索、围攻和煽动等造成持续伤害的网络行为进行预防、识别、干预与救济？","options":["网络暴力治理","国际传播效能","微短剧治理","平台内容治理"],"answers":["网络暴力治理"],"explanation":"网络暴力治理是对侮辱诽谤、威胁、人肉搜索、围攻和煽动等造成持续伤害的网络行为进行预防、识别、干预与救济。须分析单条内容、群体聚合、推荐扩散和跨平台迁移。 只封几个账号而不改变推荐和人肉链条，难以阻断规模化伤害。","knowledgeId":"k247","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk248","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：个人去世后留下的账号、文件、虚拟资产、通信和可识别数据，以及围绕其访问、继承、纪念和删除产生的权利关系？","options":["数字遗产","算法审计","生成式AI治理","网络暴力治理"],"answers":["数字遗产"],"explanation":"数字遗产是个人去世后留下的账号、文件、虚拟资产、通信和可识别数据，以及围绕其访问、继承、纪念和删除产生的权利关系。需平衡逝者生前意愿、继承人权益、通信相对人隐私和平台规则。 把全部聊天记录交给继承人，可能侵犯逝者及第三人的隐私。","knowledgeId":"k248","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk249","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：个人信息、重要数据或业务数据因存储、调用、分析和共享而跨越法域的流动？","options":["数据跨境传播","计算向善","智能体传播","数字遗产"],"answers":["数据跨境传播"],"explanation":"数据跨境传播是个人信息、重要数据或业务数据因存储、调用、分析和共享而跨越法域的流动。治理需兼顾传播与贸易效率、国家安全、个人权利和不同法律制度的冲突。 服务器在境外不是唯一跨境情形，境外远程访问也可能构成流动。","knowledgeId":"k249","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk250","subject":"前沿热点","chapter":"前沿热点 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕新技术的价值冲突、风险、不确定性和治理选择进行准确、可理解、可参与的公共沟通？","options":["科技伦理传播","健康传播","城市形象传播","国际传播效能"],"answers":["科技伦理传播"],"explanation":"科技伦理传播是围绕新技术的价值冲突、风险、不确定性和治理选择进行准确、可理解、可参与的公共沟通。它既反对技术万能论，也避免脱离证据的恐慌论，目标是支持知情决策和民主治理。 用单一专家或科幻极端替代现实证据，会制造虚假确定性。","knowledgeId":"k250","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0001","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"议程设置研究媒介议题的突出程度与公众认知中议题________之间的关系。","answers":["重要性","重要程度"],"explanation":"议程设置重点讨论人们认为哪些问题重要；不能简单理解成媒体决定每个人对问题的具体态度。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0002","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"第三人效果中的感知差距是：人们常认为媒介信息对________的影响大于对自己的影响。","answers":["他人","别人","其他人"],"explanation":"第三人效果首先讨论主观估计的差距，实际影响大小仍需独立研究。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0003","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"使用与满足研究常从受众的传播________出发，分析其媒介选择与获得的满足。","answers":["需求","需要"],"explanation":"该路径重视受众的需求和使用动机，也需考虑社会结构、资源和平台设计对选择的限制。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0004","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"培养理论关注长期接触媒介内容与人们对________现实的认知之间的关系。","answers":["社会"],"explanation":"培养研究强调长期、累积的媒介影响；关联不自动证明因果，还需处理其他影响因素。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0006","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"拉斯韦尔的五个传播环节依次是传播者、内容、媒介、受众和传播________。","answers":["效果"],"explanation":"五个问题对应控制、内容、媒介、受众和效果分析。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0009","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"传播者把想法组织成语言、图像等符号的过程称为________。","answers":["编码"],"explanation":"编码将意义转化为符号，受众对符号的理解则涉及解码。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0010","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"受众依据自身经验对传播符号加以理解的过程称为________。","answers":["解码"],"explanation":"解码并不是机械复制传播者意图，受众可能形成不同解释。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0011","subject":"传播理论","chapter":"媒介理论","type":"填空题","prompt":"‘媒介即讯息’强调媒介形式本身对感知方式和________关系的影响。","answers":["社会"],"explanation":"麦克卢汉强调媒介形式及其延伸效应，并不等于具体内容毫无价值。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0012","subject":"传播理论","chapter":"媒介理论","type":"填空题","prompt":"伊尼斯依据媒介物质特性，区分偏重跨时间保存与偏重跨________扩张的媒介。","answers":["空间"],"explanation":"伊尼斯的媒介偏向理论讨论媒介与文明的时间、空间组织，不能将媒介性质视作唯一历史原因。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0014","subject":"传播理论","chapter":"受众研究","type":"填空题","prompt":"霍尔的编码／解码理论中，受众理解主导含义但依据相反立场加以解释，属于________式解读。","answers":["对抗","对抗性"],"explanation":"对抗式解读不是没有理解，而是理解既有意义后从相反立场重新阐释。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0016","subject":"新闻理论","chapter":"新闻真实性","type":"填空题","prompt":"新闻真实要求核实人物、时间、地点等具体事实，同时注意整体________是否准确。","answers":["语境","背景","事实关系"],"explanation":"片段事实真实仍可能因断章取义导致整体误导，应核查事实关系和背景。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0017","subject":"新闻理论","chapter":"新闻选择","type":"填空题","prompt":"新闻价值常见要素包括时新性、重要性、接近性、显著性和________性。","answers":["趣味"],"explanation":"趣味性是常见新闻价值要素之一；它不能取代真实性和公共利益判断。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0018","subject":"新闻理论","chapter":"新闻来源","type":"填空题","prompt":"匿名信源的说法仍需尽可能用文件、数据或其他________来源交叉核实。","answers":["独立"],"explanation":"多次转载同一消息不构成多个独立信源；匿名可能保护信源，也增加核验难度。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0022","subject":"新闻实务","chapter":"采访方法","type":"填空题","prompt":"不预设固定答案、鼓励受访者详细叙述经历的提问通常称为________式提问。","answers":["开放","开放性"],"explanation":"开放式提问有助于获取过程和细节，封闭式提问则便于确认特定事实。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0023","subject":"新闻实务","chapter":"采访方法","type":"填空题","prompt":"针对受访者回答中的模糊处或矛盾继续提问，以获取细节和证据，称为________。","answers":["追问"],"explanation":"有效追问应针对具体回答，可进一步核实时间、地点、依据与不同说法。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0025","subject":"新闻实务","chapter":"消息写作","type":"填空题","prompt":"消息开头集中概括最重要新闻事实的部分称为________。","answers":["导语","新闻导语"],"explanation":"导语帮助读者迅速把握新闻重点，正文仍需补充信源、背景和证据。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0027","subject":"新闻实务","chapter":"新闻评论","type":"填空题","prompt":"新闻评论中的中心判断称为________，支撑判断的材料则称为论据。","answers":["论点"],"explanation":"评论需要清楚的论点、可靠论据和能够连接二者的论证。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0028","subject":"新闻实务","chapter":"新闻评论","type":"填空题","prompt":"以证据和推理说明论点为什么成立的过程称为________。","answers":["论证"],"explanation":"论证不是重复立场，而是解释论据如何支持论点，并处理可能的反例。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0030","subject":"新闻实务","chapter":"数据新闻","type":"填空题","prompt":"对不同年份的统计数据进行比较之前，应确认定义和统计________一致。","answers":["口径"],"explanation":"统计范围、单位或计算方式变化会使表面数字不可直接比较。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0033","subject":"网络与新媒体","chapter":"数字社会","type":"填空题","prompt":"不同群体在数字设备接入、使用能力和使用收益方面的差异称为数字________。","answers":["鸿沟"],"explanation":"数字鸿沟不只涉及有没有设备，还涉及使用能力、方式及实际受益。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0039","subject":"前沿热点","chapter":"科技传播","type":"填空题","prompt":"报道新技术研究结果时，除效果外，还应说明样本规模、实验条件和________性。","answers":["不确定"],"explanation":"区分已证实结果、研究局限和未来推测，可以减少夸大宣传。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0040","subject":"前沿热点","chapter":"算法治理","type":"填空题","prompt":"算法审计应记录测试方法、样本、结果以及问题的整改与________情况。","answers":["复测","复查"],"explanation":"审计不是只看平均准确率，也需比较不同群体的错误率与后续整改效果。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0042","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"《循环日报》1874年创办于________，王韬以该报政论闻名。","answers":["香港"],"explanation":"创办地点是香港；讨论该报时还应联系王韬的政论与近代社会背景。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0043","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"《循环日报》与近代报人________的办报活动密切相关。","answers":["王韬"],"explanation":"王韬参与《循环日报》办报，发表大量政论，推动近代报刊言论发展。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0044","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"《时务报》与19世纪末的________运动联系密切。","answers":["维新","戊戌变法","维新变法"],"explanation":"《时务报》1896年创刊，维新派利用报刊传播改革思想。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0045","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"《新青年》是中国________运动的重要思想传播平台。","answers":["新文化"],"explanation":"《新青年》与新文化运动关系密切，也在后来传播马克思主义思想。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0048","subject":"新闻史","chapter":"外国新闻史","type":"填空题","prompt":"集中采集新闻并向多个媒体机构分发内容的组织称为________。","answers":["通讯社","新闻通讯社"],"explanation":"通讯社通过采集和供稿参与国内与国际新闻流动。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0049","subject":"新闻史","chapter":"国际传播","type":"填空题","prompt":"关于世界新闻传播秩序的讨论关注各国信息流动和传播资源分布的________。","answers":["不平衡","不均衡","不平等"],"explanation":"相关讨论涉及国际新闻来源、传播基础设施、文化自主性与技术资源。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"f0050","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"议程设置中的媒介议程主要指新闻媒体对不同________的关注和突出程度。","answers":["议题","公共议题"],"explanation":"媒介议程与公众议程可以比较，但两者之间并非总是简单单向因果。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0051","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"框架理论关注传播者如何选择、突出与组织事实，从而影响受众对问题的________。","answers":["理解","解释","认知"],"explanation":"框架不仅涉及是否报道，还涉及问题定义、原因解释和评价方式。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0052","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"沉默的螺旋理论关注个人感知到的意见气候与公开________意愿之间的关系。","answers":["表达","发言"],"explanation":"当个人担心孤立时，感知到的意见环境可能影响其表达意愿。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0053","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"经典的两级传播研究突出大众传播与________传播之间的联系。","answers":["人际"],"explanation":"信息可能通过意见领袖进入人际网络，但现实路径可以更复杂。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0054","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"在香农—韦弗模式中，信源经过编码与信道传输后，接收端需要对信号进行________。","answers":["解码","译码"],"explanation":"编码和解码是信号处理的不同环节，噪声可能影响传输。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0055","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"符号互动论强调意义产生于社会________，并在互动中不断被解释与调整。","answers":["互动","交往"],"explanation":"符号互动论关注人与人之间通过符号赋予事物意义的过程。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0056","subject":"传播理论","chapter":"受众研究","type":"填空题","prompt":"使用与满足研究中的受众并非完全被动，研究者会分析其使用媒介的________和需求。","answers":["动机","目的"],"explanation":"该路径重视受众选择，同时承认媒介可获得性和社会环境会影响选择。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0057","subject":"传播理论","chapter":"媒介理论","type":"填空题","prompt":"伊尼斯的媒介偏向理论讨论媒介物质形式与社会组织在时间、________两个维度的关系。","answers":["空间"],"explanation":"某些媒介较有利于长期保存，另一些较有利于远距离扩展；具体作用取决于历史情境。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0058","subject":"传播理论","chapter":"媒介理论","type":"填空题","prompt":"‘媒介即讯息’由传播思想家________提出。","answers":["麦克卢汉","马歇尔·麦克卢汉","马歇尔麦克卢汉"],"explanation":"麦克卢汉强调媒介形式对人的感知与社会组织的影响。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0059","subject":"传播理论","chapter":"媒介与社会","type":"填空题","prompt":"‘公共领域’理论与德国思想家________的研究密切相关。","answers":["哈贝马斯","尤尔根·哈贝马斯","尤尔根哈贝马斯"],"explanation":"哈贝马斯讨论公共事务中的公众讨论、舆论形成和社会条件。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0060","subject":"传播理论","chapter":"受众研究","type":"填空题","prompt":"霍尔提出的受众解读位置包括主导式、协商式和________式。","answers":["对抗","对立"],"explanation":"对抗式解读指受众理解文本的主导意义，却从相反立场重新阐释。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0061","subject":"广告公关","chapter":"品牌传播","type":"填空题","prompt":"整合营销传播要求协调广告、公关、门店和服务等不同品牌________。","answers":["接触点","触点"],"explanation":"整合强调核心价值与渠道分工协同，不是每个平台机械发布相同内容。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0062","subject":"广告公关","chapter":"品牌传播","type":"填空题","prompt":"品牌定位需要考虑目标受众、竞争关系和能够形成区别的品牌________。","answers":["价值","主张","特点"],"explanation":"定位应能回应消费者需求并有可信证据支持，而不只是设计一句口号。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0063","subject":"广告公关","chapter":"公共关系","type":"填空题","prompt":"公共关系中的双向沟通不仅传递组织信息，还应收集公众________并影响组织行动。","answers":["反馈","意见"],"explanation":"公共关系涉及组织行为与利益相关者关系，反馈应进入决策，而非只用于制作宣传。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0064","subject":"广告公关","chapter":"危机传播","type":"填空题","prompt":"危机事件的首轮沟通应优先说明受影响者可采取的________行动。","answers":["保护","安全"],"explanation":"食品或公共安全危机中，应提供停止使用、就医、联系等具体措施。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0065","subject":"广告公关","chapter":"广告伦理","type":"填空题","prompt":"公益传播设计应明确受众能够采取的具体________，而不只使用抽象口号。","answers":["行动","行为"],"explanation":"有效公益信息需要明确目标行为、受众障碍、支持资源和评估方式。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0066","subject":"新闻实务","chapter":"信源核验","type":"填空题","prompt":"两篇报道均转载同一条未经核实的帖子时，不能把它们当作两个________信源。","answers":["独立"],"explanation":"应追溯信息源头，并寻找能够独立证明事实的材料或知情者。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0067","subject":"新闻实务","chapter":"新闻标题","type":"填空题","prompt":"标题中的数字、人物与时间应与正文和已核实的________一致。","answers":["事实","证据"],"explanation":"标题可概括内容，但不能改变证据的范围或制造过度确定的判断。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0068","subject":"新闻实务","chapter":"灾难报道","type":"填空题","prompt":"灾难采访中应评估采访可能给受害者及家属造成的________伤害。","answers":["二次"],"explanation":"灾难报道要兼顾公众知情、受害者尊严、隐私与安全。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0069","subject":"网络与新媒体","chapter":"平台治理","type":"填空题","prompt":"平台对内容作出处置后，应说明规则依据并提供________途径。","answers":["申诉","复核"],"explanation":"清晰理由与申诉渠道有助于纠正误判，也有助于提高治理的透明度。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"f0070","subject":"网络与新媒体","chapter":"数字素养","type":"填空题","prompt":"识别疑似虚假信息时，应核查发布者、发布时间以及原始________。","answers":["来源","出处"],"explanation":"不要仅凭转发量或截图文字判断真假；需要追溯原始证据。","source":{"label":"中山大学2027年新闻传播学考试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0001","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"一项研究试图概括所有大学生的新闻使用情况，这一目标群体称为研究________。","answers":["总体"],"explanation":"总体是研究希望推论的全部对象，实际调查常抽取其中一部分作为样本。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0002","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"从研究总体中实际选取并观察的一部分对象称为________。","answers":["样本"],"explanation":"样本用于推断总体，但推断质量取决于抽样方式、覆盖和无应答等因素。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0003","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"抽样调查中，有些被抽中者没有回答，由此可能带来的系统偏差称为________偏差。","answers":["无应答","不回应","非回应"],"explanation":"如果未回答者与回答者在关键特征上不同，结果可能产生无应答偏差。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0004","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"当研究对象因调查覆盖范围限制而系统性遗漏某些群体时，可能出现________偏差。","answers":["覆盖","覆盖不足"],"explanation":"例如只通过智能手机调查，会遗漏没有智能手机的人；扩大样本数不能自动消除这种偏差。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0005","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"研究中将抽象概念转换成可观察、可测量指标的过程称为________。","answers":["操作化","操作化定义"],"explanation":"例如将媒介使用概念转化为使用频率和时长；指标选择需要与研究问题一致。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0006","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"一个量表在相同条件下多次测量结果的一致程度，通常称为________。","answers":["信度"],"explanation":"信度强调测量的一致性；结果稳定不代表一定测中了想测的概念。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0007","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"测量工具是否真正测量了研究者希望测量的概念，通常称为测量的________。","answers":["效度"],"explanation":"效度关注测量解释是否有效，信度高是有用条件，但不自动保证效度高。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0008","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"一项研究在调查前提出可被证据检验的变量关系，这一命题通常称为研究________。","answers":["假设"],"explanation":"假设应尽量清楚、可检验，并与研究概念和可用资料相对应。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0009","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"在实验中，研究者有意改变并比较其影响的因素通常称为________变量。","answers":["自","自变量"],"explanation":"自变量是研究者关注的解释因素；在实验设计中通常由研究者操作。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0010","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"实验中用于观察是否随处理条件变化的结果指标通常称为________变量。","answers":["因","因变量"],"explanation":"因变量是被解释或测量的结果，不能简单根据出现在句子中的前后顺序判断。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0011","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"随机实验中，接受特定处理的群体通常称为实验组，用于对比的群体称为________组。","answers":["对照","控制"],"explanation":"对照组为评估处理效果提供比较基线；分组和其他条件仍需审慎设计。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0012","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"观察到两个变量同时变化，只能说明可能存在相关，不能自动证明________关系。","answers":["因果"],"explanation":"共同原因、反向关系和选择偏差都可能造成相关；判断因果需要额外证据。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0013","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"用系统、可重复的规则对新闻文本进行分类与统计的方法，称为内容________。","answers":["分析"],"explanation":"内容分析应明确分析单位、类别、编码规则和一致性检查。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0014","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"内容分析中，研究者明确规定要统计的是文章、段落还是句子，这个对象称为分析________。","answers":["单位"],"explanation":"分析单位不同可能得到不同结论，应与研究问题和编码规则相匹配。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0015","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"不同编码员使用同一规则对同一材料分类，结果的一致程度称为编码员间________。","answers":["信度","一致性"],"explanation":"编码员间一致性有助于评估规则是否明确，但高一致性也不保证分类概念一定有效。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0016","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"研究者通过开放问题了解受访者经验、观点和行动逻辑，常用的方法是深度________。","answers":["访谈","采访"],"explanation":"深度访谈适合理解意义和过程，但受访者记忆及研究者提问方式都可能影响材料。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0017","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"研究者进入特定社群观察互动，并记录日常实践的质性方法常称为参与式________。","answers":["观察"],"explanation":"参与观察需要关注进入场域的关系、伦理同意和研究者角色对观察的影响。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0018","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"研究开始前，告知参与者研究内容和风险并取得自愿同意，称为________同意。","answers":["知情"],"explanation":"知情同意需要参与者理解并有真实选择；对敏感数据还要控制访问和去标识化。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0019","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"研究数据中的姓名和联系方式等可识别信息应按研究目的进行必要的去________处理。","answers":["标识","识别"],"explanation":"去标识化可以降低识别风险，但多个字段组合仍可能重新识别个人。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0020","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"问卷中把两个不同问题合并为一句，导致受访者无法分别回答，这类问题称为________问题。","answers":["双重","双重含义","双管齐下"],"explanation":"例如同时询问服务速度和态度是否满意，应拆成独立问题以免结果难以解释。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0021","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"问卷问题预设某种答案或施加价值判断，可能产生________性提问。","answers":["诱导","引导"],"explanation":"诱导性问题会影响回答方向，应改为中立措辞并提供合适选项。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0022","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"在访谈或问卷中，人们为迎合被认为更受欢迎的规范而回答，可能产生社会________偏差。","answers":["赞许","期许","期望"],"explanation":"敏感议题中可通过匿名、避免评价性措辞等方式降低此类偏差。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0023","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"如果一个调查只在某一时点收集资料，这种设计通常称为________调查。","answers":["横截面","横断面"],"explanation":"横截面研究可以描述关联，但通常难以仅凭一次测量确认时间先后和因果关系。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0024","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"重复追踪相同对象在不同时间的变化，可采用________研究设计。","answers":["追踪","纵向","追踪式"],"explanation":"纵向研究有助于观察变化，但需要处理样本流失等问题。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0025","subject":"研究方法","chapter":"传播研究方法","type":"填空题","prompt":"一项研究主动说明样本、方法和不确定性，是为了让读者判断结论的适用________。","answers":["范围","边界"],"explanation":"报告研究局限有助于避免把特定样本结果无限推广到所有情境。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0026","subject":"研究方法","chapter":"传播研究方法","type":"单选题","prompt":"某新闻机构在线调查只邀请其订阅用户，却称结果代表全体市民。最主要的问题是什么？","options":["抽样覆盖不足，不能直接推及全体市民","所有订阅用户回答必然错误","样本量只要大就一定完全消除偏差","只要问题简短即可代表总体"],"answers":["抽样覆盖不足，不能直接推及全体市民"],"explanation":"订阅用户与全体市民不一定具有相同特征；自选样本和覆盖范围会限制外推。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0027","subject":"研究方法","chapter":"传播研究方法","type":"单选题","prompt":"同一问卷反复测量结果很稳定，但题目并未测到研究者所说的媒介信任。最准确的判断是？","options":["可能信度较高但效度不足","效度高必然等于信度高","只要结果稳定就不需要检查效度","可以忽略题目内容"],"answers":["可能信度较高但效度不足"],"explanation":"稳定性和测量是否切中概念是不同问题；稳定地测错仍不能证明效度。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0028","subject":"研究方法","chapter":"传播研究方法","type":"单选题","prompt":"研究发现短视频使用时长与焦虑水平相关。以下哪一结论最恰当？","options":["相关本身不能证明短视频使用导致焦虑","相关系数不为零就证明单向因果","焦虑不可能影响使用时长","不需要考虑其他变量"],"answers":["相关本身不能证明短视频使用导致焦虑"],"explanation":"可能存在反向因果、第三变量或测量偏差，需要更强设计和证据判断因果。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0029","subject":"研究方法","chapter":"传播研究方法","type":"单选题","prompt":"两位编码员根据同一新闻文本得出完全不同的类别。应优先检查什么？","options":["编码定义、培训和编码员间一致性","只增加标题字号","删除全部不一致材料而不记录","把其中一人结果直接当作唯一正确答案"],"answers":["编码定义、培训和编码员间一致性"],"explanation":"需要检查类别边界、编码手册和培训，并通过一致性评估改善规则。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"m0030","subject":"研究方法","chapter":"传播研究方法","type":"单选题","prompt":"调查研究中哪项最有助于降低受访者因担忧暴露隐私而隐瞒敏感信息？","options":["明确匿名或保密措施并用中立语言提问","强迫公开姓名","在题干中暗示只有一种正确答案","将所有回答公开给熟人"],"answers":["明确匿名或保密措施并用中立语言提问"],"explanation":"保密、匿名和中立措辞可以降低顾虑，但不能保证完全消除社会赞许偏差。","source":{"label":"中山大学2027年334考试参考范围：质性与量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"p0001","subject":"新闻实务","chapter":"采访准备","type":"单选题","prompt":"记者报道小区电梯故障，应优先核对哪些材料？","options":["故障记录、维保合同、业主和维保方说法","只看物业宣传海报","仅记录一位业主的猜测","先写结论再寻找支持材料"],"answers":["故障记录、维保合同、业主和维保方说法"],"explanation":"故障记录与合同有助于核验时间和责任边界，多方说法需要与证据交叉核对。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0002","subject":"新闻实务","chapter":"采访准备","type":"单选题","prompt":"面对一项技术性医疗研究，采访前最有帮助的准备是？","options":["阅读原始论文并请独立专家解释方法和局限","只看二次转载标题","不核对研究是否经过同行评审","把单个实验结果直接写成治疗方案"],"answers":["阅读原始论文并请独立专家解释方法和局限"],"explanation":"应优先追溯原论文、样本与方法，再咨询独立专家，并区分初步结果与临床应用。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0003","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"受访者回答“当时很混乱”。哪种追问最能获得可核实细节？","options":["当时几点、谁在场、您具体看到了什么？","是不是所有人都非常愤怒？","您肯定记得所有事情吧？","能不能说一个更惊人的数字？"],"answers":["当时几点、谁在场、您具体看到了什么？"],"explanation":"具体时间、地点、在场者和观察路径有助于构建可核验的事实，而诱导式问题会污染回答。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0004","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"记者询问“您是否在周一收到通知？”主要适用于什么目的？","options":["确认特定事实","获取自由展开的经历叙述","直接证明通知真实","代替核查文件"],"answers":["确认特定事实"],"explanation":"封闭式提问适合确认特定信息，但口头回答本身仍可能需要文件或其他证据核对。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0005","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"受访者对关键数字不确定时，记者应如何处理？","options":["标记为待核实并查找原始记录","把估计值写成准确统计","选择最有冲击力的数字","暗示受访者必须给出答案"],"answers":["标记为待核实并查找原始记录"],"explanation":"不确定的口述不能擅自转成精确数据，应查找原始记录并说明限制。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0006","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"报道涉及被指控机构时，为什么应尽量联系该机构？","options":["给其回应具体指控并核实事实的机会","让机构单方面决定报道是否发布","保证机构的说法必然正确","以机构回应替代所有独立证据"],"answers":["给其回应具体指控并核实事实的机会"],"explanation":"联系被指控方有助于完整呈现争议和核实事实，但各方说法仍需独立验证。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0007","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"记者准备采访儿童，以下哪项更合适？","options":["评估风险并在适用情况下取得监护人和儿童同意","只要家长在场即可公开全部隐私","让儿童签署其无法理解的声明","用奖励诱导儿童讲述隐私"],"answers":["评估风险并在适用情况下取得监护人和儿童同意"],"explanation":"应考虑儿童的理解能力、监护人同意、受访意愿和可能的长期影响。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0008","subject":"新闻实务","chapter":"采访方法","type":"单选题","prompt":"记者提出“您是不是因为管理混乱才导致事故？”主要存在什么问题？","options":["预设了尚未证实的原因","提问过于开放","没有包含数字","一定违反消息写作结构"],"answers":["预设了尚未证实的原因"],"explanation":"问题预设管理混乱导致事故，可能诱导回答；应分开询问事实、证据与原因。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0009","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"一张带有机构标志的截图被大量转发。判断是否为官方通知，最可靠的下一步是？","options":["访问机构官方渠道或联系发布部门核实原文","以转发量作为真实性证明","只看截图排版是否整齐","默认所有带标志图片都真实"],"answers":["访问机构官方渠道或联系发布部门核实原文"],"explanation":"标志和排版可以伪造，应追溯原文、发布时间及发布者身份。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0010","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"三家媒体使用同一位匿名知情人爆料，记者能否称其为三个独立消息来源？","options":["不能，需核查各报道是否有共同源头","可以，因为报道来自三个网址","可以，因为转载次数超过三次","不能，因为任何匿名来源都不能使用"],"answers":["不能，需核查各报道是否有共同源头"],"explanation":"媒体数量不等于独立信源数量；如果消息均来自同一人，不能伪称三方独立确认。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0011","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"专家接受采访时与被报道企业存在财务关系，记者应如何处理？","options":["核实并适当披露相关利益关系，同时寻求独立意见","隐瞒利益关系以保持简洁","认为专家观点自动无效且无需核查","只保留企业宣传材料"],"answers":["核实并适当披露相关利益关系，同时寻求独立意见"],"explanation":"利益关系不必然使观点错误，但需要披露并通过其他证据和独立观点进行检验。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0012","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"一段视频声称发生于某市，核验地理位置可首先比较什么？","options":["画面中的路牌、建筑和地形与可靠地图或现场照片","仅比较视频清晰度","只根据发布者昵称推断","根据点赞数量推断"],"answers":["画面中的路牌、建筑和地形与可靠地图或现场照片"],"explanation":"可比较画面中可识别地标与可靠资料，并注意建筑和道路可能随时间变化。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0013","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"核验社交平台上的数据图表时，哪项最关键？","options":["找到原始数据和统计口径","判断配色是否专业","确认是否有大量点赞","直接复制截图中的结论"],"answers":["找到原始数据和统计口径"],"explanation":"图表外观无法保证数据真实，需追溯原始数据、单位、范围及计算方法。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0014","subject":"新闻实务","chapter":"信源核验","type":"单选题","prompt":"天气灾害视频的拍摄时间不明，哪种表述最稳妥？","options":["明确时间尚未核实，继续核查","直接称视频拍摄于今天","根据上传时间断定拍摄时间","忽略日期但声称现场实时画面"],"answers":["明确时间尚未核实，继续核查"],"explanation":"上传时间与拍摄时间可能不同，不能未经确认便将素材标为实时。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0015","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"以下哪种导语更符合消息写作要求？","options":["先说明确认的主要事件、时间地点和关键结果","用长篇无关背景掩盖事件","先写未经证实的猜测","只写记者对此感到震惊"],"answers":["先说明确认的主要事件、时间地点和关键结果"],"explanation":"导语应突出核心已核实事实，具体要素可依新闻价值安排，不必机械堆砌。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0016","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"稿件中出现“有关人士称”，但没有交代其知情路径。编辑应要求什么？","options":["在保护必要匿名的前提下交代可说明的信源背景","删除所有涉及信源的信息","把匿名人士改写成官方机构","默认匿名来源必然独立"],"answers":["在保护必要匿名的前提下交代可说明的信源背景"],"explanation":"信源说明有助读者判断信息可靠性；涉及保密时应在保护身份与说明知情路径之间平衡。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0017","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"报道写“事故伤者全部出院”，依据却是两天前的通报。编辑应怎样做？","options":["确认通报时间并更新目前状态","直接删除时间使信息看起来最新","以旧通报推断无人再次入院","只保留“全部”二字"],"answers":["确认通报时间并更新目前状态"],"explanation":"会变化的信息需要标注时点并及时核实，历史通报不能直接等同当前状态。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0018","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"消息中引用受访者原话时，下列做法最合适的是？","options":["准确保留原意，必要删节不能改变语境","把记者判断放进引号","用不同人的话拼成一个人的完整引语","把猜测改写为确定事实"],"answers":["准确保留原意，必要删节不能改变语境"],"explanation":"引语应忠实原意；整理口语或删节时应避免改变事实关系。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0019","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"标题称“全国所有学校停课”，正文却只证实某县部分学校停课。主要问题是？","options":["标题扩大事实范围造成误导","标题比正文短","正文使用了地名","没有使用疑问句"],"answers":["标题扩大事实范围造成误导"],"explanation":"标题中的范围和程度必须与已证实事实一致，不能为吸引点击扩大结论。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0020","subject":"新闻实务","chapter":"新闻背景","type":"单选题","prompt":"报道一项新政策时，什么材料最能帮助读者理解变化？","options":["解释调整前制度和本次改变的具体条款","罗列与政策无关的历史事件","省略实施日期","将不同地区的规则当成同一规则"],"answers":["解释调整前制度和本次改变的具体条款"],"explanation":"对比调整前后条款与实施范围，有助于解释变化及其影响。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0021","subject":"新闻实务","chapter":"新闻背景","type":"单选题","prompt":"新闻背景与新闻主体的关系，哪种说法更准确？","options":["背景服务于理解当前新闻事实，应保持相关且准确","背景可以完全取代当前新闻事实","背景越长越好，不必与事件相关","背景不需要信源"],"answers":["背景服务于理解当前新闻事实，应保持相关且准确"],"explanation":"背景的功能是提供解释所需的历史、制度或数据语境，不应喧宾夺主。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0022","subject":"新闻实务","chapter":"新闻评论","type":"单选题","prompt":"评论写“这项措施必然有效”，但没有任何证据。主要缺陷是什么？","options":["结论缺乏可检验的论据和论证","使用了完整句子","出现了明确立场","材料中包含事实"],"answers":["结论缺乏可检验的论据和论证"],"explanation":"评论可以提出判断，但应解释依据、推理过程和适用边界。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0023","subject":"新闻实务","chapter":"新闻评论","type":"单选题","prompt":"评论引用数据论证政策效果，最重要的是？","options":["核查数据来源与口径，并解释其与论点的关系","只选择最大数字作为标题","不写数据时间","把相关关系直接当作因果"],"answers":["核查数据来源与口径，并解释其与论点的关系"],"explanation":"数字不是天然论证，需检查可比性、上下文和证据是否支持因果判断。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0024","subject":"新闻实务","chapter":"新闻评论","type":"单选题","prompt":"针对反方观点写评论，哪种做法更有说服力？","options":["准确呈现对方主要理由，再用证据回应","把对方观点歪曲成极端版本","只攻击对方身份","拒绝解释事实依据"],"answers":["准确呈现对方主要理由，再用证据回应"],"explanation":"准确重述并回应合理异议，有助于提高论证质量。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0025","subject":"新闻实务","chapter":"调查报道","type":"单选题","prompt":"发现政府采购数据异常后，调查报道的合理下一步是什么？","options":["核对招标文件、合同和付款记录，并采访相关方","直接宣布存在犯罪","仅根据异常数字推断动机","删除不符合假设的材料"],"answers":["核对招标文件、合同和付款记录，并采访相关方"],"explanation":"异常是调查线索，不自动证明违法，应寻找原始记录、核实流程并给相关方回应机会。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0026","subject":"新闻实务","chapter":"调查报道","type":"单选题","prompt":"某份内部文件疑似证明重要问题，但来源身份无法确认。记者应？","options":["评估文件真伪、取得背景并寻求其他独立证据","只凭文件截图确认全部事实","默认文件必假并销毁证据","将文件日期改为更有说服力的时间"],"answers":["评估文件真伪、取得背景并寻求其他独立证据"],"explanation":"文档须核查来源、真实性、完整性和时间背景，并尽可能与其他证据交叉验证。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0027","subject":"新闻实务","chapter":"调查报道","type":"单选题","prompt":"采访者担心报道会引发单位报复，记者应首先考虑？","options":["讨论可行保护措施与保密边界，并评估风险","承诺任何情况下都绝对不会泄露且无需评估","公开其住址以证明真实","要求受访者放弃了解报道用途"],"answers":["讨论可行保护措施与保密边界，并评估风险"],"explanation":"应与信源沟通匿名程度、潜在风险及其限制，安全承诺必须可执行。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0028","subject":"新闻实务","chapter":"调查报道","type":"单选题","prompt":"发现新证据与原有报道假设不一致时，应怎么做？","options":["重新评估假设并如实呈现经核实的矛盾","隐藏新证据以保持故事一致","更改新证据时间","只继续寻找支持原结论的证据"],"answers":["重新评估假设并如实呈现经核实的矛盾"],"explanation":"调查应随证据调整，而不是预设结论并选择性保留支持材料。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0029","subject":"新闻实务","chapter":"事实核查","type":"单选题","prompt":"网传“去年某市失业率为30%”，核查的第一步应是什么？","options":["明确指标、地区、年份并找原始统计来源","把帖子评论数当成统计样本","只核对数字是否为整数","将全国数字直接替代地方数据"],"answers":["明确指标、地区、年份并找原始统计来源"],"explanation":"应拆解可验证主张并确认统计定义，再追溯官方或可信原始资料。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0030","subject":"新闻实务","chapter":"事实核查","type":"单选题","prompt":"某视频经核实为几年前另一地区画面，最清楚的纠错方式是？","options":["说明旧视频的来源、实际时间地点与当前误传之间的差异","只说“假的”而不解释","在纠错中继续声称是现场画面","删除原帖但不更新任何结果"],"answers":["说明旧视频的来源、实际时间地点与当前误传之间的差异"],"explanation":"纠错应说明可核验的证据及误导所在；若证据有限，也要清楚标示。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0031","subject":"新闻实务","chapter":"突发报道","type":"单选题","prompt":"灾害初期各方伤亡数据不一致，媒体应？","options":["注明来源和截至时间，持续核实更新","直接相加得出总数","选最高数字且不解释","长期不标注信息来源"],"answers":["注明来源和截至时间，持续核实更新"],"explanation":"不同数据可能覆盖范围或统计时间不同；应保留出处和不确定性。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0032","subject":"新闻实务","chapter":"突发报道","type":"单选题","prompt":"现场救援仍在进行，媒体直播时应优先避免什么？","options":["妨碍救援和泄露可能危及安全的细节","说明现场时间","及时纠正已知错误","提供经过核实的避险信息"],"answers":["妨碍救援和泄露可能危及安全的细节"],"explanation":"直播应尊重现场安全与救援秩序，并注意隐私和未经确认的信息。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0033","subject":"新闻实务","chapter":"突发报道","type":"单选题","prompt":"社交平台出现求救信息，新闻机构最有帮助的处理方式是？","options":["核实位置与联系方式，并视情况转交救援渠道","未经核实就公开所有个人资料","只转发而不说明信息时效","把求救信息作为娱乐素材"],"answers":["核实位置与联系方式，并视情况转交救援渠道"],"explanation":"应核实、联系适当救援渠道，并注意保护个人隐私及信息时效。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0034","subject":"新闻实务","chapter":"灾难报道","type":"单选题","prompt":"受灾家庭暂时不愿接受采访，记者应？","options":["尊重拒绝，考虑其他信源并避免持续骚扰","以公众知情为由强行进入住宅","把拒绝解释成隐瞒事实","公开其私人联系方式"],"answers":["尊重拒绝，考虑其他信源并避免持续骚扰"],"explanation":"采访权不意味着可以忽视受访者拒绝和隐私，公共利益须与具体伤害权衡。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0035","subject":"新闻实务","chapter":"图片报道","type":"单选题","prompt":"一张照片真实但配了错误事件说明。报道的主要问题是？","options":["图像与文字语境错配会误导读者","照片只要真实就不需要说明","错误说明不影响事实判断","画面尺寸太大"],"answers":["图像与文字语境错配会误导读者"],"explanation":"真实素材被放在错误时间或地点，同样可能造成失实。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0036","subject":"新闻实务","chapter":"数据报道","type":"单选题","prompt":"图表将纵轴起点设为95而未说明，导致小幅变化看起来巨大。编辑应？","options":["明确坐标起点并选择合适展示方式","隐藏坐标轴数值","只强调颜色更醒目","把百分比改为未经计算的倍数"],"answers":["明确坐标起点并选择合适展示方式"],"explanation":"坐标设置影响视觉判断；应根据图表类型和研究问题选择比例并清晰标注。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0037","subject":"新闻实务","chapter":"数据报道","type":"单选题","prompt":"比较两地投诉量时，哪项信息最有助于公平比较？","options":["人口规模、统计时间和投诉渠道差异","两地网页背景色","只看总数较高的一地","删除统计范围"],"answers":["人口规模、统计时间和投诉渠道差异"],"explanation":"绝对数量可能受到人口和记录方式影响，需要对照可比口径及适当比率。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0038","subject":"新闻实务","chapter":"新闻编辑","type":"单选题","prompt":"报道收到事实更正后，编辑应？","options":["核实错误，及时更正并说明改动","静默修改并保留错误标题","删除反馈不再处理","只在私下告知记者不更新内容"],"answers":["核实错误，及时更正并说明改动"],"explanation":"可见的更正说明有助于读者理解错误与修订，重大错误需评估通知范围。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0039","subject":"新闻实务","chapter":"新闻编辑","type":"单选题","prompt":"一篇报道把广告商提供的产品宣称当作独立事实。编辑应怎样处理？","options":["明确商业来源并核查可验证主张","删除广告身份让读者自行判断","把所有主张加引号就无需核实","默认付费内容必然真实"],"answers":["明确商业来源并核查可验证主张"],"explanation":"商业来源和事实验证应清晰区分，不能用广告话术代替独立核实。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"p0040","subject":"新闻实务","chapter":"数字传播","type":"单选题","prompt":"短视频标题提出“完整真相”，但视频仅有几秒画面。最准确的判断是？","options":["画面不足以单独证明完整经过，需要补充证据","视频越短越真实","只要有字幕就已核实","画面必须反映完整事件"],"answers":["画面不足以单独证明完整经过，需要补充证据"],"explanation":"片段视频可能缺少前后语境，需核实来源、拍摄时间和其他资料。","source":{"label":"天津师范大学2027年334考试大纲：新闻采写与评论","url":"https://yjsy.tjnu.edu.cn/info/1281/3797.htm"}},{"id":"t0001","subject":"传播理论","chapter":"议程设置","type":"单选题","prompt":"一家媒体连续一周将养老服务放在头条，调查发现读者认为养老议题的重要性提高。最适合解释的是？","options":["议程设置","培养理论","创新扩散","使用与满足"],"answers":["议程设置"],"explanation":"议程设置关注媒介议题显著性与公众议题显著性的关联；该观察仍需其他证据排除外部事件等影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0002","subject":"传播理论","chapter":"议程设置","type":"单选题","prompt":"研究者比较新闻议题排序与受众认为重要的公共问题排序，研究重点是？","options":["媒介议程与公众议程","意见领袖的收入","广告点击与购买路径","个人隐私授权"],"answers":["媒介议程与公众议程"],"explanation":"两个排序分别反映媒介与公众议程；比较时还需说明时间顺序和其他影响因素。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0003","subject":"传播理论","chapter":"议程设置","type":"单选题","prompt":"关于议程设置，下列哪项更准确？","options":["媒体能影响公众关注哪些议题，但不必然决定所有人的具体看法","媒体对公众关注没有任何影响","议程设置证明所有信息都来自意见领袖","媒体永远只影响受众的私人消费"],"answers":["媒体能影响公众关注哪些议题，但不必然决定所有人的具体看法"],"explanation":"议题重要性的影响不等于对每个立场和行为的完全控制。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0004","subject":"传播理论","chapter":"框架理论","type":"单选题","prompt":"同一场交通事故，甲报道强调道路设计，乙报道强调驾驶员责任。主要差别是？","options":["对原因的框架选择不同","必然一真一假","两篇消息的传播渠道不同","两篇报道使用了不同受众样本"],"answers":["对原因的框架选择不同"],"explanation":"框架涉及选择、突出和解释事实；是否失实还要核查具体证据。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0005","subject":"传播理论","chapter":"框架理论","type":"单选题","prompt":"媒体把某政策争议主要呈现为“效率与公平的权衡”，这是对什么的组织？","options":["问题定义和解释框架","噪声强度","信号编码速率","随机抽样概率"],"answers":["问题定义和解释框架"],"explanation":"框架通过选取问题维度影响受众理解，并可能引导不同评价。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0006","subject":"传播理论","chapter":"议程与框架","type":"单选题","prompt":"比较议程设置与框架理论，哪项更合适？","options":["前者强调议题显著性，后者强调对议题的选择和解释方式","二者都只研究信号传输","前者研究颜色，后者只研究标题字体","二者都证明受众完全没有主动性"],"answers":["前者强调议题显著性，后者强调对议题的选择和解释方式"],"explanation":"议题显著性与解释方式密切相关但分析重点不同；不同学者对二者边界存在讨论。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0007","subject":"传播理论","chapter":"沉默的螺旋","type":"单选题","prompt":"某人认为群体中多数人反对自己的看法，因担心被排斥而不发言。该机制最接近？","options":["沉默的螺旋","创新扩散","新闻价值","编码器噪声"],"answers":["沉默的螺旋"],"explanation":"该理论关注意见气候感知、孤立恐惧和表达意愿的关系。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0008","subject":"传播理论","chapter":"沉默的螺旋","type":"单选题","prompt":"关于沉默的螺旋，哪项是更谨慎的理解？","options":["意见气候感知可能影响表达，但个体和情境存在差异","持少数观点的人一定永远沉默","少数意见永远不可能被公开","所有平台上的表达机制完全相同"],"answers":["意见气候感知可能影响表达，但个体和情境存在差异"],"explanation":"表达行为受匿名性、关系网络、身份和风险等多种因素影响，不能简单绝对化。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0009","subject":"传播理论","chapter":"知识沟","type":"单选题","prompt":"同一健康信息发布后，高教育群体更快理解并使用，低教育群体改善较慢。这可能反映？","options":["知识沟","培养理论","景观社会","广告诉求"],"answers":["知识沟"],"explanation":"知识沟讨论不同社会群体获取信息能力与知识差距，原因还需调查资源、渠道和背景知识。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0010","subject":"传播理论","chapter":"知识沟","type":"单选题","prompt":"缩小公共健康知识差距的措施中，哪项最有针对性？","options":["以易懂语言、多渠道和社区支持服务覆盖不同群体","只在专业期刊发布复杂术语","减少所有人的信息获得","假定每个群体接入和理解能力相同"],"answers":["以易懂语言、多渠道和社区支持服务覆盖不同群体"],"explanation":"传播设计应考虑受众能力、接入条件、可信渠道和服务可及性。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0011","subject":"传播理论","chapter":"培养理论","type":"单选题","prompt":"研究长期观看电视暴力内容是否影响人们对社会危险程度的估计，最接近？","options":["培养理论","两级传播","组织传播","议程设置"],"answers":["培养理论"],"explanation":"培养理论关注长期媒介接触与社会现实认知的累积关联，应考虑既有经历等混杂因素。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0012","subject":"传播理论","chapter":"培养理论","type":"单选题","prompt":"某人长期看犯罪节目后高估犯罪发生率。最审慎的结论是什么？","options":["可能与长期媒介接触有关，但不能仅凭个案证明因果","已证明该节目必然造成犯罪","完全不需要真实犯罪统计","所有观众都会产生同样看法"],"answers":["可能与长期媒介接触有关，但不能仅凭个案证明因果"],"explanation":"单一个案无法排除个人经历和选择性接触等影响，需系统研究。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0013","subject":"传播理论","chapter":"使用与满足","type":"单选题","prompt":"学生选择播客是因为通勤时可以学习。研究这一选择最适合先关注？","options":["受众需求、使用场景和获得的满足","只分析主播收入","只比较文字排版","假定所有人都无选择能力"],"answers":["受众需求、使用场景和获得的满足"],"explanation":"使用与满足从受众为什么使用媒介、获得什么满足出发。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0014","subject":"传播理论","chapter":"使用与满足","type":"单选题","prompt":"关于使用与满足研究，哪种说法较合理？","options":["研究受众使用动机，也应考虑媒介可及性和社会条件","所有受众完全自主且不受任何限制","受众需求不会发生变化","只要使用次数高就证明需求被满足"],"answers":["研究受众使用动机，也应考虑媒介可及性和社会条件"],"explanation":"使用行为受需求影响，也受时间、资源、产品和社会结构等条件制约。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0015","subject":"传播理论","chapter":"两级传播","type":"单选题","prompt":"某居民先向社区志愿者咨询再决定是否报名疫苗接种。研究者关注志愿者如何解释媒体信息，最接近？","options":["意见领袖与人际传播","倒金字塔结构","文化工业","信号噪声"],"answers":["意见领袖与人际传播"],"explanation":"两级传播强调大众媒介与意见领袖、人际网络之间的联系。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0016","subject":"传播理论","chapter":"意见领袖","type":"单选题","prompt":"关于意见领袖，下列哪项更准确？","options":["其影响通常与具体议题、群体关系和信任有关","每个人在任何话题上都具有同样影响力","意见领袖只能是政府官员","意见领袖只负责机械转发，不会解释信息"],"answers":["其影响通常与具体议题、群体关系和信任有关"],"explanation":"意见领袖具有情境性，影响力可能因议题、关系网络和可信度不同而变化。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0017","subject":"传播理论","chapter":"第三人效果","type":"单选题","prompt":"甲认为虚假广告对其他人影响很大，对自己几乎没有影响。这体现？","options":["第三人效果的影响感知","议程设置的媒介议程","信源保护","倒金字塔结构"],"answers":["第三人效果的影响感知"],"explanation":"第三人效果讨论人们对媒介影响在自己与他人之间的主观判断差距。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0018","subject":"传播理论","chapter":"第三人效果","type":"单选题","prompt":"第三人效果研究中，应区分什么？","options":["人们对影响的主观估计与真实影响","标题与导语的字数","报纸与视频的像素","新闻稿的发布时间和天气"],"answers":["人们对影响的主观估计与真实影响"],"explanation":"认为别人更受影响不等于事实确实如此，感知与实际效果需要分别测量。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0019","subject":"传播理论","chapter":"选择性接触","type":"单选题","prompt":"受众主要订阅与自己立场一致的账号，这最接近？","options":["选择性接触","新闻职业化","议程设置","无罪推定"],"answers":["选择性接触"],"explanation":"受众倾向接触态度相容的信息，但其实际接触范围仍需依据数据判断。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0020","subject":"传播理论","chapter":"选择性接触","type":"单选题","prompt":"某人只愿看支持自己观点的消息，其行为与哪一因素可能同时相关？","options":["个人选择与平台推荐","只有印刷成本","只有节目时长","与社会关系绝对无关"],"answers":["个人选择与平台推荐"],"explanation":"信息接触可能共同受到用户选择、平台排序、社交网络和可获得性的影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0021","subject":"传播理论","chapter":"认知失调","type":"单选题","prompt":"一个人相信自己重视健康，却发现自己长期熬夜，因而感到不适并寻求合理化。这最接近？","options":["认知失调","培养理论","世界新闻新秩序","信源匿名"],"answers":["认知失调"],"explanation":"不一致的认知或行为可能产生心理不适，人们可能通过改变态度或行为降低失调。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0022","subject":"传播理论","chapter":"创新扩散","type":"单选题","prompt":"新技术可以先免费试用一周，这主要降低了什么采纳障碍？","options":["试用风险和不确定性","媒介议题显著性","随机抽样误差","编辑标题长度"],"answers":["试用风险和不确定性"],"explanation":"可试用性能让潜在使用者观察效果，但采用还受成本、能力与社会条件影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0023","subject":"传播理论","chapter":"创新扩散","type":"单选题","prompt":"在调查新技术传播速度时，哪组因素更值得分析？","options":["相对优势、复杂性、可试用性和社会网络","只有发明者姓名","只看广告配色","仅比较标点符号"],"answers":["相对优势、复杂性、可试用性和社会网络"],"explanation":"创新特点、传播渠道和社会系统共同影响采纳。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0024","subject":"传播理论","chapter":"把关理论","type":"单选题","prompt":"编辑决定将哪些投稿发布到首页，这一过程最直接体现？","options":["把关","沉默的螺旋","认知失调","意见气候"],"answers":["把关"],"explanation":"把关是对信息进入传播渠道的选择；数字环境中平台规则和算法也参与把关。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0025","subject":"传播理论","chapter":"算法把关","type":"单选题","prompt":"平台根据互动率自动排序新闻，分析把关时还应关注什么？","options":["排序目标、数据与可能产生的偏差","只看发布者的笔名","假设算法没有任何设计者","认为所有用户看到的内容完全一样"],"answers":["排序目标、数据与可能产生的偏差"],"explanation":"算法排序体现组织目标、数据和设计选择，可能影响可见性与信息多样性。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0026","subject":"传播理论","chapter":"编码与解码","type":"单选题","prompt":"广告用同一段画面向所有人传递品牌形象，但不同群体理解不同。这最适合说明？","options":["受众解码受经验与语境影响","传播意义只由发布者完全决定","所有受众必然做出相同解释","视频没有编码过程"],"answers":["受众解码受经验与语境影响"],"explanation":"受众可能接受、协商或对抗文本的主导意义，理解受社会经验影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0027","subject":"传播理论","chapter":"编码与解码","type":"单选题","prompt":"观众理解节目想表达的观点，却从自己的反对立场加以重新解释，属于？","options":["对抗式解读","主导式解读","无意义噪声","随机抽样"],"answers":["对抗式解读"],"explanation":"对抗式解读不是没有理解，而是基于不同立场解释文本。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0028","subject":"传播理论","chapter":"编码与解码","type":"单选题","prompt":"观众大体接受节目观点，但针对自己的生活处境进行修正，属于？","options":["协商式解读","完全对抗式解读","无法解码","信道噪声"],"answers":["协商式解读"],"explanation":"协商式解读兼有对主导意义的部分接受和具体情境下的调整。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0029","subject":"传播理论","chapter":"拟态环境","type":"单选题","prompt":"公众主要依据媒体呈现来认识自己没有亲历的远方事件。相关概念是？","options":["拟态环境","新闻导语","品牌资产","信度"],"answers":["拟态环境"],"explanation":"拟态环境强调人们对外部世界的认识受到媒介呈现和头脑图景的中介。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0030","subject":"传播理论","chapter":"媒介偏向","type":"单选题","prompt":"伊尼斯研究不同媒介如何有利于跨时间保存或跨空间扩张，关注的是？","options":["媒介偏向","知识沟","用户生成内容","危机传播"],"answers":["媒介偏向"],"explanation":"媒介的物质特性与文明的组织方式相关，但不能把全部历史变化归因于技术。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0031","subject":"传播理论","chapter":"公共领域","type":"单选题","prompt":"一个公共讨论平台只允许少数利益集团发言。评价其公共领域质量，最应考察？","options":["谁能进入讨论、表达和获得回应","平台背景是否绿色","发帖时间是否为周末","只计算服务器数量"],"answers":["谁能进入讨论、表达和获得回应"],"explanation":"公共讨论的开放程度、资源不平等与回应机制影响其公共性。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0032","subject":"传播理论","chapter":"公共领域","type":"单选题","prompt":"关于网络公共讨论，下列哪项最审慎？","options":["网络可能扩大表达机会，也存在平台规则和资源不平等","联网自然保证每个人地位完全平等","匿名讨论永远没有风险","商业平台不影响讨论可见性"],"answers":["网络可能扩大表达机会，也存在平台规则和资源不平等"],"explanation":"技术提供可能性，但平台排序、身份、权力和资源仍会影响参与。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0033","subject":"传播理论","chapter":"传播政治经济学","type":"单选题","prompt":"研究平台如何通过广告、数据与内容劳动获利，主要采用什么视角？","options":["传播政治经济学","仅有信号工程","仅有语言语法","天气预测"],"answers":["传播政治经济学"],"explanation":"这一视角关注传播资源的生产、所有权、分配与权力关系。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0034","subject":"传播理论","chapter":"文化工业","type":"单选题","prompt":"某公司把相似套路批量包装为多种看似独特的娱乐产品。批判理论中相关概念是？","options":["文化工业的标准化与伪个性化","随机抽样","新闻信源核验","传播噪声"],"answers":["文化工业的标准化与伪个性化"],"explanation":"文化工业理论批判文化商品的标准化，以及表面差异对真实选择的遮蔽。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0035","subject":"传播理论","chapter":"参与式文化","type":"单选题","prompt":"粉丝基于喜欢的作品创作同人，并在社群中交流与修改。这体现？","options":["用户参与和再创作","受众绝对被动","传播只能由媒体机构完成","内容无法被解释"],"answers":["用户参与和再创作"],"explanation":"参与式文化强调受众创作、交流与协作，但仍需考虑平台规则和版权边界。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0036","subject":"传播理论","chapter":"网络社会","type":"单选题","prompt":"研究跨国平台、资本和用户通过网络节点连接，更接近哪一理论关注？","options":["网络社会","倒金字塔","开放式提问","新闻时效性"],"answers":["网络社会"],"explanation":"网络社会理论关注以网络组织为特征的经济、权力和文化活动。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0037","subject":"传播理论","chapter":"风险传播","type":"单选题","prompt":"公共机构通报尚在调查的安全风险时，哪种表达较好？","options":["说明已知、未知和可采取的保护措施","将不确定的原因写成定论","隐瞒公众可采取的安全措施","只提供抽象安慰不提供行动"],"answers":["说明已知、未知和可采取的保护措施"],"explanation":"风险沟通需准确、透明并支持公众采取适当行动。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0038","subject":"传播理论","chapter":"数字劳动","type":"单选题","prompt":"用户上传视频、提供行为数据并帮助平台获得广告收入，数字劳动视角关注？","options":["用户贡献如何创造价值及收益分配","用户是否使用同款手机","所有人收入都完全相同","平台从不参与价值分配"],"answers":["用户贡献如何创造价值及收益分配"],"explanation":"平台的组织和商业模式会影响创作者、用户和机构之间的收益与权利关系。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0039","subject":"传播理论","chapter":"注意力经济","type":"单选题","prompt":"平台优先推送能引起持续点击的内容，最直接涉及哪种稀缺资源？","options":["用户注意力","报纸纸张","采访录音笔","电话线长度"],"answers":["用户注意力"],"explanation":"注意力经济把用户时间与注意力作为竞争资源，并需审视其对内容质量的影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"t0040","subject":"传播理论","chapter":"传播效果研究","type":"单选题","prompt":"一项调查发现接触新闻较多的人也更关注公共事务。正确解释是？","options":["两者有关联，但因果方向和其他因素仍需研究","接触新闻一定直接导致关注","关注公共事务绝不影响新闻接触","没有必要检查样本"],"answers":["两者有关联，但因果方向和其他因素仍需研究"],"explanation":"横截面相关可能来自双向影响和第三变量，不能仅凭相关推断因果。","source":{"label":"中山大学2027年新闻传播学初试参考范围：传播理论与效果研究","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0001","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"资讯平台只以点击率优化推荐，可能带来哪种风险？","options":["夸张内容因更易吸引点击而获得更多曝光","所有内容自动获得事实核验","所有用户的信息需求必然完全满足","推荐结果不受指标影响"],"answers":["夸张内容因更易吸引点击而获得更多曝光"],"explanation":"目标指标会影响内容排序，点击率不能独立衡量真实性、公共价值或长期用户利益。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0002","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"平台声称“算法没有价值判断”，研究者最应检查？","options":["设计目标、训练数据、反馈指标和使用情境","服务器外壳颜色","页面标题字数","只检查一条热门视频"],"answers":["设计目标、训练数据、反馈指标和使用情境"],"explanation":"算法系统体现目标和数据选择，也会受实际部署环境影响，不能简单视为中立或有意操控。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0003","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"平台用户希望减少某类推荐内容，哪种设置最有利于控制体验？","options":["清晰提供“不感兴趣”、偏好调整与关闭个性化入口","隐藏所有反馈按钮","强制公开用户浏览历史","将用户反馈永久忽略"],"answers":["清晰提供“不感兴趣”、偏好调整与关闭个性化入口"],"explanation":"用户需要可找到、可理解、可操作的选择；还需检验反馈能否实际改变结果。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0004","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"研究推荐系统是否放大极端内容，哪种证据更有价值？","options":["不同用户条件下的推荐序列、内容分类和对照数据","只看一条偶然出现的内容","以个人猜测代替观察","只统计平台注册人数"],"answers":["不同用户条件下的推荐序列、内容分类和对照数据"],"explanation":"需要设计比较、定义内容类别并记录推荐路径，单个案例不足以证明系统性趋势。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0005","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"个性化推荐与“信息茧房”的关系，哪项表述较合理？","options":["推荐可能改变接触范围，是否形成封闭需结合实证研究","任何推荐都必然隔绝所有异见","用户选择与接触范围完全无关","只要能搜索就证明没有任何偏差"],"answers":["推荐可能改变接触范围，是否形成封闭需结合实证研究"],"explanation":"推荐、个人选择和社交网络共同作用，信息封闭程度不能预设。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0006","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"同一平台的新用户与老用户看到不同内容，可能反映什么？","options":["排序利用了不同的行为数据或上下文","所有用户必然收到同一序列","内容差异证明平台服务器损坏","用户历史数据不可能影响推荐"],"answers":["排序利用了不同的行为数据或上下文"],"explanation":"个性化可能依据历史行为、内容特征和情境；具体机制需通过实际证据确认。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0007","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"平台在“未成年模式”中限制深夜使用和高风险内容推荐，主要考虑什么？","options":["不同用户群体的保护需求和使用情境","让所有成年人无法阅读新闻","取消对内容质量的管理","把未成年人数据全部公开"],"answers":["不同用户群体的保护需求和使用情境"],"explanation":"未成年人保护应结合年龄适配、内容风险、时间管理与权利保障。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0008","subject":"网络与新媒体","chapter":"平台推荐","type":"单选题","prompt":"当推荐规则影响创作者收入时，较透明的做法是？","options":["公布主要规则、违规理由和申诉方式","所有降权均不提供任何解释","用单一点击数作为全部创作质量的证明","禁止创作者了解基本政策"],"answers":["公布主要规则、违规理由和申诉方式"],"explanation":"透明和申诉有助于创作者理解规则并纠正误判，同时仍需保护合理的系统安全。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0009","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"一款天气应用请求读取通讯录，但未解释用途。最直接的问题是？","options":["收集范围可能超过实现天气服务的必要性","通讯录越多天气预报越准确","所有应用必须读取通讯录","只要免费就无需说明数据用途"],"answers":["收集范围可能超过实现天气服务的必要性"],"explanation":"数据收集应有明确目的并尽量限于必要范围，权限请求需清晰说明。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0010","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"用户关闭定位后仍能阅读普通新闻，这体现了什么设计原则？","options":["非必要权限不应成为基础阅读的强制门槛","所有用户必须提供精确位置","拒绝权限意味着必须公开姓名","数据使用目的无需说明"],"answers":["非必要权限不应成为基础阅读的强制门槛"],"explanation":"对非必要数据提供真实选择，有助于保障用户自主权。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0011","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"平台隐私政策使用模糊的“合作伙伴可能使用部分数据”。主要不足是什么？","options":["未清楚说明接收方、数据类型和使用目的","文字不够长","缺少企业口号","没有展示服务器照片"],"answers":["未清楚说明接收方、数据类型和使用目的"],"explanation":"有效告知应帮助用户理解数据流向和具体用途，而非仅使用宽泛表述。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0012","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"发布匿名访谈时，删除姓名但保留唯一职位、地点和详细经历。主要风险是？","options":["多项信息组合仍可能识别当事人","删除姓名就必然无法识别","所有公开信息都自动失去隐私保护","职业信息永远无法关联个人"],"answers":["多项信息组合仍可能识别当事人"],"explanation":"去标识化需要考虑信息组合、公开资料和受众范围，删除姓名并不总是充分。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0013","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"平台依据用户行为推断其可能对某商品感兴趣，该推断有什么特点？","options":["可能有偏差，用户宜有查看和调整机会","必然准确且不能更改","等同于用户亲口确认","与数据使用无关"],"answers":["可能有偏差，用户宜有查看和调整机会"],"explanation":"推断可能错误或过度敏感，应提供合理的透明度和纠错机制。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0014","subject":"网络与新媒体","chapter":"数据与隐私","type":"单选题","prompt":"一项研究收集受访者录音，降低泄露风险的适当措施是？","options":["限制访问、加密保存并明确保存期限","将原始录音公开给所有人","永久保存但不告知用途","用公开群聊传递身份证信息"],"answers":["限制访问、加密保存并明确保存期限"],"explanation":"数据安全依赖权限、保存和销毁流程，同时应尊重受访者的知情与选择。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0015","subject":"网络与新媒体","chapter":"数字鸿沟","type":"单选题","prompt":"线上政务只提供复杂小程序，部分老年人无法独立办理。哪种改进更合适？","options":["简化流程并保留电话和现场服务","取消人工咨询","仅提供更复杂的说明书","以是否有手机认定是否具备使用能力"],"answers":["简化流程并保留电话和现场服务"],"explanation":"数字融入包括可及性、技能和替代渠道，设备接入并不等于能够完成任务。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0016","subject":"网络与新媒体","chapter":"数字鸿沟","type":"单选题","prompt":"两所学校都接入网络，但学生的信息辨别能力不同，主要体现哪类差异？","options":["数字技能和使用能力差异","只有物理接入差异","报纸发行范围差异","所有学习结果必然相同"],"answers":["数字技能和使用能力差异"],"explanation":"数字鸿沟还涉及使用质量与收益，不能只统计是否有网络。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0017","subject":"网络与新媒体","chapter":"数字素养","type":"单选题","prompt":"识别可疑新闻时，哪项行动更可靠？","options":["追溯原始来源，比较其他独立证据","根据评论数量判断事实","仅看标题情绪强度","只因熟人转发就完全相信"],"answers":["追溯原始来源，比较其他独立证据"],"explanation":"信息判断需要来源、证据和语境；传播热度和人际信任都不是真实性保证。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0018","subject":"网络与新媒体","chapter":"数字素养","type":"单选题","prompt":"某图表没有标明纵轴单位，但声称“增长了十倍”。读者应？","options":["查找原始数据和计算方式后判断","只看柱形颜色","将宣传文案当作统计证明","默认所有图表都使用相同口径"],"answers":["查找原始数据和计算方式后判断"],"explanation":"数字比较必须核查单位、基数、时间范围和计算方法。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0019","subject":"网络与新媒体","chapter":"数字素养","type":"单选题","prompt":"网友收到“紧急退款”链接，最适当的核实方式是？","options":["通过独立查找的官方渠道确认，不直接使用可疑链接","立即输入银行卡密码","只看链接是否有红色图标","转发给所有联系人"],"answers":["通过独立查找的官方渠道确认，不直接使用可疑链接"],"explanation":"应通过已知官方渠道核实，并避免向未知页面泄露身份或支付信息。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0020","subject":"网络与新媒体","chapter":"数字身份","type":"单选题","prompt":"个人数字身份可能由哪些信息共同形成？","options":["账号资料、行为记录、社交关系和系统推断","只有真实姓名","只有头像颜色","与网络活动完全无关"],"answers":["账号资料、行为记录、社交关系和系统推断"],"explanation":"数字身份包括自我呈现、他人反馈和平台依据行为产生的判断。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0021","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"生成式工具给出一个看似完整的论文引用，但无法查到原文。记者应？","options":["追溯原文和出版信息，未核实前不采用","因格式完整就直接引用","把引用交给读者自行核实而不提示","更改作者名以便匹配"],"answers":["追溯原文和出版信息，未核实前不采用"],"explanation":"生成模型可能编造引用，必须核实文献、作者、页码及其实际内容。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0022","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"AI生成的采访摘要把“可能”改成“一定”。编辑首先应？","options":["对照原始录音或文字，恢复受访者原意","保留更确定的说法以吸引读者","认为流畅表达自动准确","删除采访时间"],"answers":["对照原始录音或文字，恢复受访者原意"],"explanation":"自动摘要可能改变确定性或因果关系，需对照原始材料逐项核对。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0023","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"新闻机构使用生成式AI撰写灾害速报，哪种安排更合适？","options":["由编辑审核事实、来源和表述后发布","无需检查即可自动发布","禁止记录生成版本","将未知数据补成估计值而不提示"],"answers":["由编辑审核事实、来源和表述后发布"],"explanation":"高风险新闻应核查事实并明确责任，自动生成不能代替编辑判断。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0024","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"自动生成新闻图像应如何降低误认风险？","options":["清晰标识生成或合成方式，避免伪装成真实现场","省略标识并声称为现场照片","只在内部文件备注","把生成图像当作事实证据"],"answers":["清晰标识生成或合成方式，避免伪装成真实现场"],"explanation":"合成内容的清晰标识有助于受众区分示意与现场记录，但仍须核实内容与授权。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0025","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"某模型在不同口音受访者的语音转写中错误率差距明显，问题可能涉及？","options":["训练数据或评估样本的代表性与公平性","新闻标题字号","纸张印刷方向","无需关注的纯装饰差异"],"answers":["训练数据或评估样本的代表性与公平性"],"explanation":"应按群体和场景评估错误率，追查数据和模型原因并整改复测。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0026","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"AI客服回答医疗问题时无法确认，较合理的行为是？","options":["说明不确定并引导联系专业人员","编造明确药量","保证其回答适用于所有人","隐藏系统身份"],"answers":["说明不确定并引导联系专业人员"],"explanation":"高风险场景应明确能力边界、避免编造，并提供适当人工或专业转接。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0027","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"使用大模型处理采访录音，保护信源时应考虑什么？","options":["是否含敏感信息、数据传输目的及授权","把所有未公开录音公开上传","认为工具免费就没有数据风险","只关注输出速度"],"answers":["是否含敏感信息、数据传输目的及授权"],"explanation":"上传敏感材料前应审查授权、处理方式、访问控制和保留期限。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0028","subject":"网络与新媒体","chapter":"人工智能","type":"单选题","prompt":"一张AI图像逼真地呈现从未发生的新闻现场，其风险在于？","options":["可能被误认作真实证据并传播错误事实","画面逼真就证明事件发生","生成内容不可能影响公众认知","所有图像天然没有来源"],"answers":["可能被误认作真实证据并传播错误事实"],"explanation":"生成图像可以模拟现场，但不能作为真实事件发生的独立证据。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0029","subject":"网络与新媒体","chapter":"深度伪造","type":"单选题","prompt":"有人发布疑似名人合成语音要求转账，最稳妥的做法是？","options":["通过已知独立联系方式核实真实请求","因声音相似立即付款","把音质清晰当作身份认证","只问发布账号的粉丝数"],"answers":["通过已知独立联系方式核实真实请求"],"explanation":"声音和视频可能被合成，独立联系和多因素确认可降低被骗风险。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0030","subject":"网络与新媒体","chapter":"深度伪造","type":"单选题","prompt":"核查疑似合成视频时，哪项表述最谨慎？","options":["综合原始来源、上下文和多种技术证据，说明不确定性","仅凭肉眼一次观察就能百分百判断","任何压缩痕迹都必然证明伪造","有水印就无需核查"],"answers":["综合原始来源、上下文和多种技术证据，说明不确定性"],"explanation":"技术检测存在误差，应结合来源与事件事实，避免过度确定。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0031","subject":"网络与新媒体","chapter":"网络舆情","type":"单选题","prompt":"突发事件后网上出现多种解释，机构回应应如何处理未知内容？","options":["明确仍在调查并给出后续更新安排","把猜测写成结论","删除所有真实疑问","承诺立即知道全部原因"],"answers":["明确仍在调查并给出后续更新安排"],"explanation":"及时回应需要区分事实、调查进展和不确定性，并提供行动信息。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0032","subject":"网络与新媒体","chapter":"网络舆情","type":"单选题","prompt":"分析舆情发展时，只统计热搜排名有什么不足？","options":["不能单独反映讨论内容、群体分布和真实影响","热搜排名就是所有人的意见","排名越高事实越真实","不需要研究传播过程"],"answers":["不能单独反映讨论内容、群体分布和真实影响"],"explanation":"指标应结合样本、平台算法和内容分析，避免以单一热度代替公众全体意见。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0033","subject":"网络与新媒体","chapter":"网络舆情","type":"单选题","prompt":"研究评论情绪时，研究者首先应注意？","options":["定义分类规则并处理讽刺、语境和样本偏差","把所有含感叹号的评论当成愤怒","仅查看赞数最高的一条","忽略机器分类误差"],"answers":["定义分类规则并处理讽刺、语境和样本偏差"],"explanation":"情绪识别依赖语境和方法，自动分类应与人工复核和误差评估结合。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0034","subject":"网络与新媒体","chapter":"网络暴力","type":"单选题","prompt":"一名普通人遭公开电话并受到群体威胁，平台首要措施应包括？","options":["阻断敏感信息扩散、保存证据并提供保护工具","推荐更多攻击性内容","公开其家庭住址以核实身份","要求其逐条联系所有攻击者"],"answers":["阻断敏感信息扩散、保存证据并提供保护工具"],"explanation":"应降低持续伤害，提供举报、屏蔽和证据保存渠道，同时区分合理讨论与攻击。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0035","subject":"网络与新媒体","chapter":"网络暴力","type":"单选题","prompt":"区分批评与网络暴力时，哪种判断更合理？","options":["结合内容、威胁、隐私泄露、持续围攻和具体情境","任何不同意见都是暴力","只要不是名人就没有言论权利","只看评论是否获得点赞"],"answers":["结合内容、威胁、隐私泄露、持续围攻和具体情境"],"explanation":"具体行为及其伤害程度比简单的正负情绪分类更重要。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0036","subject":"网络与新媒体","chapter":"短视频","type":"单选题","prompt":"短视频将受访者一句有条件的话剪成无条件结论，风险是什么？","options":["删去限定条件会改变原意并误导受众","短视频天然不能报道事实","只要节奏快就不需核实","字幕一定比原音准确"],"answers":["删去限定条件会改变原意并误导受众"],"explanation":"剪辑应保留必要语境，避免改变逻辑条件和事实关系。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0037","subject":"网络与新媒体","chapter":"短视频","type":"单选题","prompt":"新闻短视频的字幕与受访者原音不一致，编辑应？","options":["回听并更正字幕，必要时注明听不清","以字幕自动转写为唯一依据","为保证传播效果修改原话","删除所有声音并继续使用错误引语"],"answers":["回听并更正字幕，必要时注明听不清"],"explanation":"自动转写会出错，尤其是方言、姓名和专业术语，需要人工复核。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0038","subject":"网络与新媒体","chapter":"直播传播","type":"单选题","prompt":"直播中出现未核实爆炸声来源，主播应？","options":["说明观察到的现象与未知原因，并继续核实","立即断定事故原因","把观众猜测作为官方消息","制造更夸张的现场描述"],"answers":["说明观察到的现象与未知原因，并继续核实"],"explanation":"直播应区分直接观察、他人说法和已确认事实，保持必要的不确定性。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0039","subject":"网络与新媒体","chapter":"直播传播","type":"单选题","prompt":"直播画面意外显示受伤者身份证件，较合适的处理是？","options":["及时切换或遮挡并在回放中处理隐私信息","持续特写以提高观看量","把证件信息加入标题","认为直播后无法进行任何补救"],"answers":["及时切换或遮挡并在回放中处理隐私信息"],"explanation":"实时报道仍应保护隐私，回放、剪辑和截图扩散也需考虑。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0040","subject":"网络与新媒体","chapter":"社群传播","type":"单选题","prompt":"社群成员愿意传播某公共服务信息，哪项因素可能提升其可信度？","options":["信息来源可信且与社群实际需求相关","只增加无关标签数量","隐瞒发布者身份","要求成员未经核实转发"],"answers":["信息来源可信且与社群实际需求相关"],"explanation":"信任、共同需求与关系网络会影响社群传播，也需避免把熟人信任当作事实核验。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0041","subject":"网络与新媒体","chapter":"虚拟社群","type":"单选题","prompt":"线上群体存在共同规范、持续互动和成员认同，最适合用什么概念分析？","options":["虚拟社群","倒金字塔结构","信源匿名","广告点击率"],"answers":["虚拟社群"],"explanation":"虚拟社群强调持续关系、共同规范与身份认同，而不仅是一次性浏览。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0042","subject":"网络与新媒体","chapter":"平台治理","type":"单选题","prompt":"平台删除求助帖并只显示“内容不佳”，哪项改进最重要？","options":["说明具体规则，区分求助与侵害内容并提供申诉","进一步隐藏处理理由","自动删除所有公共议题讨论","公开求助者的详细住址"],"answers":["说明具体规则，区分求助与侵害内容并提供申诉"],"explanation":"清楚规则、分类处置和申诉可以降低误判对正当表达和求助的伤害。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0043","subject":"网络与新媒体","chapter":"平台治理","type":"单选题","prompt":"平台对违法信息只删除原帖，却让复制版本反复推荐。治理还应考虑？","options":["搜索、推荐与重复上传机制","只修改平台标志","只统计页面颜色","假设复制内容不会再次传播"],"answers":["搜索、推荐与重复上传机制"],"explanation":"内容治理不仅涉及单条删除，还包括扩散路径和重复传播。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0044","subject":"网络与新媒体","chapter":"平台治理","type":"单选题","prompt":"审查平台规则的公平性时，哪项证据最有意义？","options":["同类案例的处置标准、申诉结果和误判情况","只看平台发布的宣传海报","只抽取一次成功案例","假定机器判断不会出错"],"answers":["同类案例的处置标准、申诉结果和误判情况"],"explanation":"透明的同类案例、处置和申诉数据可帮助评估规则是否一致。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"d0045","subject":"网络与新媒体","chapter":"公共服务","type":"单选题","prompt":"医院推广网上挂号时，应如何照顾不同数字能力的人群？","options":["提供简明流程、辅助服务和线下或电话渠道","要求所有人必须拥有高端手机","取消人工服务后只发布技术术语","公开代办人的身份证信息"],"answers":["提供简明流程、辅助服务和线下或电话渠道"],"explanation":"公共服务的可及性应考虑设备、技能、隐私和替代渠道。","source":{"label":"中山大学2027年新闻传播学初试参考范围：智能与计算传播、新媒体影响","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"a0001","subject":"广告公关","chapter":"品牌定位","type":"单选题","prompt":"一家新咖啡店想明确与周边竞争者的区别，首先应研究什么？","options":["目标顾客需要、竞争者定位及自身可信优势","只设计店员制服","只模仿所有竞争者的口号","先宣布自己适合所有人"],"answers":["目标顾客需要、竞争者定位及自身可信优势"],"explanation":"定位需要在目标顾客需求与竞争环境中找到可证明的差异。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0002","subject":"广告公关","chapter":"品牌定位","type":"单选题","prompt":"品牌宣称“最环保”，却没有任何可核实证据。该定位的主要问题是？","options":["承诺缺乏可信依据","语言过于简短","没有使用英文","没有提及所有竞争者"],"answers":["承诺缺乏可信依据"],"explanation":"品牌定位不仅要有差异，还需要产品、供应链或服务证据支持。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0003","subject":"广告公关","chapter":"品牌定位","type":"单选题","prompt":"某品牌目标是方便独居人群，产品却只有家庭大包装。应优先检查什么？","options":["品牌承诺与实际产品体验是否一致","只增加宣传口号次数","取消消费者研究","仅修改广告字体"],"answers":["品牌承诺与实际产品体验是否一致"],"explanation":"定位必须与产品、渠道和服务体验相匹配，否则会损害信任。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0004","subject":"广告公关","chapter":"品牌资产","type":"单选题","prompt":"消费者能记住品牌，并因过去良好体验愿意重复购买，主要涉及？","options":["品牌知名度与忠诚度","媒介议程与公众议程","新闻的时新性","抽样误差"],"answers":["品牌知名度与忠诚度"],"explanation":"知名度、品牌联想和忠诚等有助于解释品牌资产，但不能只凭一次点击衡量。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0005","subject":"广告公关","chapter":"品牌资产","type":"单选题","prompt":"品牌获得大量曝光，但消费者普遍将其与质量问题联系在一起。说明？","options":["曝光不等同于正面的品牌资产","曝光越多质量就越高","品牌联想不会影响选择","投诉与品牌形象完全无关"],"answers":["曝光不等同于正面的品牌资产"],"explanation":"品牌资产不仅是被看见，还涉及消费者形成的联想、体验和信任。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0006","subject":"广告公关","chapter":"消费者洞察","type":"单选题","prompt":"研究发现上班族买即食食品是因为晚归后仍希望吃到热饭。这种发现的价值是？","options":["揭示具体生活情境中的需求和张力","只统计消费者年龄","证明所有人都喜欢同一种产品","直接代替后续产品测试"],"answers":["揭示具体生活情境中的需求和张力"],"explanation":"洞察需要结合行为、动机和情境，并能指导可验证的产品或传播选择。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0007","subject":"广告公关","chapter":"消费者洞察","type":"单选题","prompt":"品牌根据一位朋友的偏好断言所有年轻人都喜欢甜味，主要问题是？","options":["样本不足且存在以偏概全","信息过于具体","采用了任何访谈方法","有目标人群定义"],"answers":["样本不足且存在以偏概全"],"explanation":"单个案例可形成假设，但不应直接替代对目标群体的系统研究。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0008","subject":"广告公关","chapter":"广告诉求","type":"单选题","prompt":"洗衣液广告突出“冷水也能洗净油渍”，主要采用什么诉求？","options":["基于产品功能的理性诉求","仅依赖感人音乐的情感诉求","与产品无关的诉求","完全没有传播目标"],"answers":["基于产品功能的理性诉求"],"explanation":"功能和可验证性能是理性诉求的重要依据；实际效果仍需证据支持。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0009","subject":"广告公关","chapter":"广告诉求","type":"单选题","prompt":"公益广告用家庭团聚故事呼吁佩戴头盔，同时提供购买和使用方法。这体现？","options":["情感表达与具体行动提示结合","只有价格竞争","完全取消受众研究","信息不需要行为目标"],"answers":["情感表达与具体行动提示结合"],"explanation":"情感可以引起关注，但明确可执行行动有助于受众采取下一步措施。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0010","subject":"广告公关","chapter":"整合营销传播","type":"单选题","prompt":"品牌官网、门店和客服对退货期限说法不一致，最需要改善？","options":["不同接触点的信息与服务协同","增加广告数量即可","删除客服联系方式","让顾客自行判断哪个期限有效"],"answers":["不同接触点的信息与服务协同"],"explanation":"整合营销传播要求跨接触点形成一致且可兑现的体验。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0011","subject":"广告公关","chapter":"整合营销传播","type":"单选题","prompt":"同一品牌在短视频讲使用场景，在官网提供详细参数。这样做是否违背整合传播？","options":["不违背；核心承诺一致且形式适配渠道","违背；每个渠道必须逐字相同","违背；官网不能提供参数","不需要检查品牌承诺是否一致"],"answers":["不违背；核心承诺一致且形式适配渠道"],"explanation":"渠道形式可以不同，关键是核心信息和实际体验协调。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0012","subject":"广告公关","chapter":"AIDMA","type":"单选题","prompt":"某广告模型依次关注注意、兴趣、欲望、记忆和行动，通常称为？","options":["AIDMA","AISAS","5W模式","S-O-R模式"],"answers":["AIDMA"],"explanation":"AIDMA是消费者反应路径的一种概括；实际行为未必严格线性。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0013","subject":"广告公关","chapter":"AISAS","type":"单选题","prompt":"AISAS模型相较传统线性路径，突出网络环境中的哪些行为？","options":["搜索与分享","仅有线下记忆","只有价格谈判","完全没有消费者互动"],"answers":["搜索与分享"],"explanation":"AISAS包含注意、兴趣、搜索、行动和分享，强调网络信息搜索及分享。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0014","subject":"广告公关","chapter":"原生广告","type":"单选题","prompt":"某平台推广文章外观与普通报道相似。应如何避免读者误认？","options":["显著标明广告或商业推广","隐藏付费关系","只在内部文件标注","把品牌意见冒充独立调查"],"answers":["显著标明广告或商业推广"],"explanation":"形式融合不应掩盖商业性质，读者需要能够识别推广内容。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4
