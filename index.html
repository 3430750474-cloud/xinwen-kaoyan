b63a042752148989f351f868f9226b4.htm"}},{"id":"a0015","subject":"广告公关","chapter":"信息流广告","type":"单选题","prompt":"信息流广告与传统固定版位广告相比，常见特点是？","options":["嵌入内容流并可能依据用户特征排序","必然没有商业目的","所有用户看到相同广告","无法使用任何用户反馈"],"answers":["嵌入内容流并可能依据用户特征排序"],"explanation":"信息流广告与内容流融合，可使用排序和投放机制，但需要清晰标识。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0016","subject":"广告公关","chapter":"程序化广告","type":"单选题","prompt":"广告投放系统自动根据预设条件购买可用广告展示位置，主要体现？","options":["程序化购买和投放","新闻舆论监督","媒体所有权转让","人工逐条印刷"],"answers":["程序化购买和投放"],"explanation":"程序化广告使用自动化系统和数据进行购买、匹配和优化。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0017","subject":"广告公关","chapter":"精准营销","type":"单选题","prompt":"品牌依据用户数据推送广告时，合理做法是什么？","options":["明确目的、控制必要数据范围并提供选择","无期限收集所有敏感信息","默认用户无法退出","将用户数据出售给任何人"],"answers":["明确目的、控制必要数据范围并提供选择"],"explanation":"提高相关性不能忽视隐私、告知、选择和数据安全。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0018","subject":"广告公关","chapter":"精准营销","type":"单选题","prompt":"一则广告点击率很高，但多数购买者很快退款。分析时应？","options":["同时查看转化质量、退款和长期满意度","仅凭点击率宣布成功","删除退款记录","忽略产品体验"],"answers":["同时查看转化质量、退款和长期满意度"],"explanation":"点击是过程指标，真实转化与后续体验才能更完整地反映效果。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0019","subject":"广告公关","chapter":"体验营销","type":"单选题","prompt":"商场为新品设置试用区，帮助顾客实际感受功能，主要属于？","options":["体验营销","媒介审判","新闻选择","随机实验必然结果"],"answers":["体验营销"],"explanation":"体验营销通过使用场景与互动帮助消费者形成体验和评价。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0020","subject":"广告公关","chapter":"事件营销","type":"单选题","prompt":"品牌借自然灾害热点发布不相关促销，引发反感。问题主要在于？","options":["忽视事件语境与受影响者感受","没有使用足够多的感叹号","没有涉及品牌名称","没有规定传播渠道"],"answers":["忽视事件语境与受影响者感受"],"explanation":"借势需要评估公共情绪、相关性和实际行动，灾难不应简单当作流量机会。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0021","subject":"广告公关","chapter":"公益广告","type":"单选题","prompt":"一则反诈广告只写“提高警惕”，如何增强可操作性？","options":["补充核实官方渠道、不转账及求助步骤","使用更抽象的口号","删去联系方式","让受众公开银行卡密码"],"answers":["补充核实官方渠道、不转账及求助步骤"],"explanation":"公益传播应给出具体行为、障碍应对与可信服务入口。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0022","subject":"广告公关","chapter":"公益广告","type":"单选题","prompt":"心理健康公益广告将求助者描述为“意志薄弱”，主要风险是？","options":["强化污名并阻碍求助","提高医学诊断准确率","自动提供专业支持","完全不存在受众差异"],"answers":["强化污名并阻碍求助"],"explanation":"污名化表达可能让需要支持的人不愿求助，应使用审慎语言与专业资源。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0023","subject":"广告公关","chapter":"公共关系","type":"单选题","prompt":"工厂噪音扰民时，公关工作的首要基础是什么？","options":["测量并整改噪音，与居民协商回应","只购买正面报道","封堵全部投诉","把广告点击量当作噪音测量"],"answers":["测量并整改噪音，与居民协商回应"],"explanation":"公关应结合实际组织行动与公众沟通，不能让形象传播替代问题解决。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0024","subject":"广告公关","chapter":"公共关系","type":"单选题","prompt":"组织开展公众调查后发现服务流程不便，双向沟通的下一步应是？","options":["将反馈带入流程改进并回应公众","隐藏调查结果且不作调整","只重复原有宣传","要求公众停止表达意见"],"answers":["将反馈带入流程改进并回应公众"],"explanation":"双向沟通不仅接收意见，还要使反馈进入决策与行动。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0025","subject":"广告公关","chapter":"公共关系","type":"单选题","prompt":"对公共关系效果进行评估，哪组指标更全面？","options":["问题解决、公众信任、互动质量及关系变化","只有新闻稿字数","只有发布次数","只有内部会议次数"],"answers":["问题解决、公众信任、互动质量及关系变化"],"explanation":"曝光指标有用，但还应衡量组织行动与关系改善的实际效果。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0026","subject":"广告公关","chapter":"危机传播","type":"单选题","prompt":"食品企业发现某批次产品可能受污染，初步回应应包括什么？","options":["批次、已知风险、停止食用及退货就医渠道","先断言所有产品绝对安全","隐藏批次信息","只说正在重视"],"answers":["批次、已知风险、停止食用及退货就医渠道"],"explanation":"危机初期应先保护受影响者，明确已知和未知、处理措施与更新时间。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0027","subject":"广告公关","chapter":"危机传播","type":"单选题","prompt":"事故原因尚未查清，发言人说法中哪项最合适？","options":["已确认的事实是……，原因仍在调查，将于指定时间更新","为了稳定情绪先编造原因","把未经验证的猜测写成调查结论","承诺永远不会再发生任何问题"],"answers":["已确认的事实是……，原因仍在调查，将于指定时间更新"],"explanation":"透明表达不确定性并提供更新时间，有助于公众理解调查进度。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0028","subject":"广告公关","chapter":"危机传播","type":"单选题","prompt":"企业声明中只写“深表关注”，没有说明受害者如何获得帮助。主要缺陷是？","options":["缺少可执行的保护与补救信息","没有使用足够专业术语","没有把所有责任归给公众","声明太容易理解"],"answers":["缺少可执行的保护与补救信息"],"explanation":"同理表达需要与行动信息、联系方式、补救和持续更新结合。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0029","subject":"广告公关","chapter":"危机传播","type":"单选题","prompt":"产品召回后，哪组数据最有助于公众监督进展？","options":["召回范围、已回收数量、剩余风险和后续安排","广告展示量","公司会议时长","发言人服装颜色"],"answers":["召回范围、已回收数量、剩余风险和后续安排"],"explanation":"公开可核查的召回进度和风险说明，能让公众评估是否完成保护措施。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0030","subject":"广告公关","chapter":"危机传播","type":"单选题","prompt":"企业证实自身管理疏漏后，最能支持信任修复的行动是？","options":["承认责任、补救损害、公开整改并接受复核","攻击曝光问题的人","只更换广告代言人","删除所有反馈"],"answers":["承认责任、补救损害、公开整改并接受复核"],"explanation":"信任修复依赖真实责任承担和可验证整改，话语不能代替行动。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0031","subject":"广告公关","chapter":"形象修复","type":"单选题","prompt":"酒店员工泄露客户信息且证据明确，哪种回应更恰当？","options":["承认管理责任、通知受影响者并整改","否认一切且不调查","公开更多客户资料","只发优惠券代替安全处理"],"answers":["承认管理责任、通知受影响者并整改"],"explanation":"应停止泄露、保护客户、调查责任并提供具体纠正与补偿措施。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0032","subject":"广告公关","chapter":"形象修复","type":"单选题","prompt":"组织道歉后持续发生同样问题，公众认为道歉缺乏诚意。最缺少什么？","options":["可验证的纠正行动","更多形容词","新的口号","更复杂的企业标志"],"answers":["可验证的纠正行动"],"explanation":"道歉需要与防止重发的制度、进度和结果相结合。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0033","subject":"广告公关","chapter":"媒介选择","type":"单选题","prompt":"面向行动不便的老年人传播线下服务信息，哪种渠道组合更合适？","options":["社区公告、电话咨询和简明线上信息","只使用复杂英文App","只发布在年轻人封闭社群","仅依赖高门槛注册"],"answers":["社区公告、电话咨询和简明线上信息"],"explanation":"渠道选择应考虑受众接入能力、信任、服务场景和替代渠道。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0034","subject":"广告公关","chapter":"媒介选择","type":"单选题","prompt":"品牌使用多个渠道时，评价渠道效果应注意什么？","options":["区分触达、理解、转化和后续体验","只统计发布条数","认为所有曝光都是独立用户","忽略受众差异"],"answers":["区分触达、理解、转化和后续体验"],"explanation":"传播路径不同阶段需要不同指标，也应避免重复计算。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0035","subject":"广告公关","chapter":"消费者权益","type":"单选题","prompt":"广告展示“免费试用”，实际默认订阅并反复扣费，主要问题是？","options":["未清楚披露费用和续订条件","免费两个字不够醒目","用户没有主动阅读广告","产品属于数字服务"],"answers":["未清楚披露费用和续订条件"],"explanation":"应在行动前明确价格、期限、续订和取消方式，避免误导。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0036","subject":"广告公关","chapter":"消费者权益","type":"单选题","prompt":"一条广告引用用户体验评价，最稳妥的做法是？","options":["确保评价真实、有代表性且披露必要商业关系","编造用户身份","把极端个案保证为所有人的效果","删除不符合宣传的真实评价"],"answers":["确保评价真实、有代表性且披露必要商业关系"],"explanation":"广告证言应有真实性依据，个体结果不宜夸大为普遍承诺。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0037","subject":"广告公关","chapter":"传播评估","type":"单选题","prompt":"公益活动访问量提高，但真正需要帮助的人没有找到服务。下一步应？","options":["研究目标群体的转化障碍并改善服务入口","只报告总访问量","取消全部服务内容","假定所有访问者已获得帮助"],"answers":["研究目标群体的转化障碍并改善服务入口"],"explanation":"传播效果要追踪目标群体是否理解并完成行动，而非只看流量。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0038","subject":"广告公关","chapter":"传播评估","type":"单选题","prompt":"对两个广告版本进行对照测试时，应尽量保持什么？","options":["除测试变量外的投放条件与受众比较具有可比性","不断改变所有条件","只选择表现较好的样本","隐藏测试时间和范围"],"answers":["除测试变量外的投放条件与受众比较具有可比性"],"explanation":"清楚控制差异并记录样本和时间，才能较可靠地解释版本效果。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0039","subject":"广告公关","chapter":"品牌危机","type":"单选题","prompt":"品牌被质疑虚假环保后，仅更换绿色包装。此举不足的原因是？","options":["包装变化不能证明生产和供应链环境表现改善","绿色一定不能用于包装","品牌不需要回应证据","消费者无法理解任何环保信息"],"answers":["包装变化不能证明生产和供应链环境表现改善"],"explanation":"环保主张需要可核实的数据、边界和实际行动，不能仅靠视觉暗示。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"a0040","subject":"广告公关","chapter":"组织沟通","type":"单选题","prompt":"企业在不同渠道公布互相矛盾的召回批次，最应建立什么？","options":["统一事实来源、更新机制和责任人","让每个部门自行猜测","只保留旧信息","禁止任何部门核实信息"],"answers":["统一事实来源、更新机制和责任人"],"explanation":"危机沟通需要统一事实与可追溯更新，以减少矛盾和误导。","source":{"label":"山西大学2027年440参考书目：广告学概论","url":"https://xwxy.sxu.edu.cn/zsjy/zsxx/4b63a042752148989f351f868f9226b4.htm"}},{"id":"v0001","subject":"研究方法","chapter":"总体与样本","type":"单选题","prompt":"研究某市大学生新闻使用情况，将该市全部在校大学生作为推论对象，这些人构成？","options":["研究总体","实验处理","编码规则","因变量"],"answers":["研究总体"],"explanation":"总体是研究希望描述或推论的全部对象，实际调查可从中抽取样本。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0002","subject":"研究方法","chapter":"总体与样本","type":"单选题","prompt":"研究团队从某市大学生中抽取1000人调查，这1000人是？","options":["样本","总体的全部","研究假设","测量误差"],"answers":["样本"],"explanation":"样本是实际选取的调查对象；能否代表总体取决于抽样和回应情况。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0003","subject":"研究方法","chapter":"抽样偏差","type":"单选题","prompt":"一份研究市民数字能力的问卷只在智能手机应用内发放，最可能遗漏谁？","options":["没有使用该应用或智能手机的人","所有能打开应用的人","调查组织者","已经提交问卷的人"],"answers":["没有使用该应用或智能手机的人"],"explanation":"抽样渠道决定可覆盖人群，在线样本不能自动代表所有市民。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0004","subject":"研究方法","chapter":"抽样偏差","type":"单选题","prompt":"将在线自愿问卷从1万份增加到10万份，是否必然消除自选偏差？","options":["不必然，参与机会和动机仍可能系统性不同","必然消除，因为数字更大","必然消除所有测量误差","一定使每个人受访概率相同"],"answers":["不必然，参与机会和动机仍可能系统性不同"],"explanation":"扩大样本量不能自动纠正覆盖不足或自愿参与造成的系统偏差。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0005","subject":"研究方法","chapter":"抽样偏差","type":"单选题","prompt":"调查时白天仅在写字楼门口拦访，想推论所有居民态度。主要限制是什么？","options":["地点和时间造成覆盖不足","问卷使用中文","研究主题是公共议题","受访者人数为偶数"],"answers":["地点和时间造成覆盖不足"],"explanation":"固定地点和时间可能遗漏其他居民，推论前需说明抽样框及限制。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0006","subject":"研究方法","chapter":"抽样偏差","type":"单选题","prompt":"对随机抽中的人进行调查，其中部分人拒访。研究者应注意？","options":["拒访者可能与回应者不同，产生无应答偏差","只要抽样随机，拒访永远不影响结果","将拒访者自动记作支持","删除抽样记录"],"answers":["拒访者可能与回应者不同，产生无应答偏差"],"explanation":"是否存在无应答偏差取决于未回应者与回应者在关键特征上的差异。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0007","subject":"研究方法","chapter":"抽样设计","type":"单选题","prompt":"为什么分层抽样先把总体划分为若干层？","options":["便于按设计覆盖重要子群体","保证所有研究结果绝对准确","避免确定总体范围","让抽样不再需要记录"],"answers":["便于按设计覆盖重要子群体"],"explanation":"分层应根据研究目标选择变量，并在各层内按设计抽样和合理加权。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0008","subject":"研究方法","chapter":"抽样设计","type":"单选题","prompt":"研究团队想比较不同年级的新闻使用，应在设计样本时优先考虑？","options":["确保各年级有足够样本并记录抽样方式","只调查一个班级却声称覆盖全校","只记录问卷颜色","将所有未填写者设为同一答案"],"answers":["确保各年级有足够样本并记录抽样方式"],"explanation":"比较子群体需考虑各组样本量、抽样和可比性。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0009","subject":"研究方法","chapter":"操作化","type":"单选题","prompt":"研究“媒介信任”，哪项是操作化的例子？","options":["设计关于准确性、公正性和可信程度的测量题项","只重复“信任很重要”","把任何点赞都视为信任且不说明理由","不定义研究对象"],"answers":["设计关于准确性、公正性和可信程度的测量题项"],"explanation":"操作化把抽象概念转成可观察指标，但指标是否充分仍需检验效度。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0010","subject":"研究方法","chapter":"操作化","type":"单选题","prompt":"仅以阅读次数衡量新闻信任，潜在问题是？","options":["阅读频率不一定等同于信任","阅读次数无法统计","信任永远不能研究","所有读者使用时间完全一致"],"answers":["阅读频率不一定等同于信任"],"explanation":"使用行为可能由习惯或需要驱动，需考虑其他指标并验证测量。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0011","subject":"研究方法","chapter":"信度","type":"单选题","prompt":"同一编码员在相似条件下重复编码同一材料，结果差异很大，说明？","options":["测量一致性可能不足","测量效度一定很高","样本必然代表总体","因果关系已经得到证明"],"answers":["测量一致性可能不足"],"explanation":"结果不稳定提示信度问题，应检查类别定义、培训和记录方式。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0012","subject":"研究方法","chapter":"效度","type":"单选题","prompt":"研究称测量新闻理解，但问题只询问是否喜欢版面颜色。主要问题是？","options":["题项与概念不匹配，效度存疑","问卷包含题目","采用了文字表达","受访者能回答问题"],"answers":["题项与概念不匹配，效度存疑"],"explanation":"喜欢版面颜色不能直接代表对新闻内容的理解。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0013","subject":"研究方法","chapter":"信度与效度","type":"单选题","prompt":"某体重秤每次都比真实重量多5公斤，但读数十分稳定。最能说明？","options":["稳定性较好不代表测量准确","信度和效度完全相同","稳定读数证明没有系统误差","重复测量没有任何意义"],"answers":["稳定性较好不代表测量准确"],"explanation":"稳定的系统偏差是信度和有效性不同的直观例子。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0014","subject":"研究方法","chapter":"问卷设计","type":"单选题","prompt":"问卷问题“你是否认为广告不真实并且令人反感？”主要缺陷是？","options":["同时询问两个不同判断","使用了问号","采用封闭式问题","包含主语"],"answers":["同时询问两个不同判断"],"explanation":"受访者可能认为不真实但不反感，应把两个判断拆成独立题项。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0015","subject":"研究方法","chapter":"问卷设计","type":"单选题","prompt":"“你是否同意所有负责任的人都应该使用本平台？”属于什么问题？","options":["带有价值暗示的诱导性提问","完全中立的事实问题","随机抽样","内容编码"],"answers":["带有价值暗示的诱导性提问"],"explanation":"题目把某选择与“负责任”绑定，可能影响受访者作答。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0016","subject":"研究方法","chapter":"问卷设计","type":"单选题","prompt":"关于“上个月用了几次新闻App”，怎样降低回答困难？","options":["提供明确时间范围和合理的频率选项","使用“经常”却不解释含义","把所有频率合成一个选项","不给受访者不确定的选择"],"answers":["提供明确时间范围和合理的频率选项"],"explanation":"清楚的回忆范围与互斥、合适的选项有助于提高答案可解释性。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0017","subject":"研究方法","chapter":"问卷设计","type":"单选题","prompt":"问卷在正式发放前进行小范围预测试，主要目的是什么？","options":["发现理解歧义、选项问题和流程障碍","用少量结果直接代表全部总体","保证所有问题永远无误","代替研究伦理审查"],"answers":["发现理解歧义、选项问题和流程障碍"],"explanation":"预测试能发现问题，但不能消除正式调查中的所有误差。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0018","subject":"研究方法","chapter":"研究伦理","type":"单选题","prompt":"研究者录制受访者声音之前，最应做什么？","options":["说明用途、风险和保存方式并取得同意","隐瞒录音并承诺公开全部资料","让受访者先交出密码","默认所有访谈都无需告知"],"answers":["说明用途、风险和保存方式并取得同意"],"explanation":"参与者应知道研究内容和数据处理方式，并有自愿选择。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0019","subject":"研究方法","chapter":"研究伦理","type":"单选题","prompt":"公开访谈材料时，即使删除姓名，仍保留唯一职位与小村庄名称。需要考虑？","options":["组合信息仍可能识别受访者","删除姓名必定完全匿名","地点与身份永远无关","公开资料无需任何风险评估"],"answers":["组合信息仍可能识别受访者"],"explanation":"间接标识符组合可能重新识别个人，应结合场景控制细节。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0020","subject":"研究方法","chapter":"研究伦理","type":"单选题","prompt":"参与者中途表示不愿继续访谈，最合理的回应是？","options":["尊重其退出意愿并按事先约定处理资料","强迫完成访谈","公开其个人资料作为惩罚","隐藏其退出请求"],"answers":["尊重其退出意愿并按事先约定处理资料"],"explanation":"自愿参与包括退出的实际可能，资料处理应遵循事先说明和适用规定。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0021","subject":"研究方法","chapter":"深度访谈","type":"单选题","prompt":"研究少数群体如何理解一则报道，希望获得具体经验和意义解释，适合优先考虑？","options":["深度访谈","只统计报道字数","只比较字体大小","不与任何受众接触"],"answers":["深度访谈"],"explanation":"深度访谈可帮助理解经验、解释与过程，但结果的外推范围应谨慎说明。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0022","subject":"研究方法","chapter":"深度访谈","type":"单选题","prompt":"受访者说“我不信任平台”，研究者如何追问更好？","options":["能否举例说明发生了什么，为什么影响信任？","你肯定认为平台全是骗子，对吗？","你必须立刻选择我的结论","这个回答不重要"],"answers":["能否举例说明发生了什么，为什么影响信任？"],"explanation":"开放、具体的追问有助于获取经历和依据，避免替受访者预设结论。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0023","subject":"研究方法","chapter":"参与观察","type":"单选题","prompt":"研究者进入线上社群观察，应首先考虑哪项伦理问题？","options":["成员是否知情以及资料使用的隐私风险","只记录群名称","默认所有群聊都可无限公开","隐瞒研究目的并要求成员提供密码"],"answers":["成员是否知情以及资料使用的隐私风险"],"explanation":"场域的公开程度、成员预期与资料敏感性会影响研究伦理安排。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0024","subject":"研究方法","chapter":"内容分析","type":"单选题","prompt":"一项研究按文章统计报道数量，却把同一文章中的每段都算作一篇。主要问题是？","options":["没有一致遵守分析单位","样本没有标题","使用了文章作为材料","研究对象涉及新闻"],"answers":["没有一致遵守分析单位"],"explanation":"分析单位必须清晰且一致，否则不同记录不可比较。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0025","subject":"研究方法","chapter":"内容分析","type":"单选题","prompt":"两位编码员经常对“负面报道”分类不一致。应优先？","options":["澄清类别边界、培训并重新测试一致性","忽略分歧","只保留支持假设的分类","改变研究结论以匹配第一人"],"answers":["澄清类别边界、培训并重新测试一致性"],"explanation":"编码手册和培训有助于提升一致性，也应说明处理分歧的方法。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0026","subject":"研究方法","chapter":"内容分析","type":"单选题","prompt":"研究报道是否引用女性专家，仅按文章数量统计。还应明确什么？","options":["每篇报道如何识别专家身份及计数规则","文章网页颜色","受访者手机型号","当天的天气"],"answers":["每篇报道如何识别专家身份及计数规则"],"e 信息之一，但同期事件、季节性和数据记录变化等也可能影响结果。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0033","subject":"研究方法","chapter":"数据解释","type":"单选题","prompt":"两地投诉总数不同，若人口规模差异很大，应补充比较？","options":["可比口径下的人均或单位人口投诉率","只比较城市名称","删除人口资料","将总数差异直接写成风险倍数"],"answers":["可比口径下的人均或单位人口投诉率"],"explanation":"解释绝对数量时可结合适当分母与统计方式，但比率也要标明口径。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0034","subject":"研究方法","chapter":"数据解释","type":"单选题","prompt":"调查显示某选项支持率从49%变为51%，但样本较小。应如何写结论？","options":["报告样本、误差和不确定性，不夸大微小变化","宣称态度发生确定性逆转","忽略调查时间和抽样","把两个数字相加"],"answers":["报告样本、误差和不确定性，不夸大微小变化"],"explanation":"小幅差异可能受到抽样误差等影响，需结合方法与不确定性。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0035","subject":"研究方法","chapter":"数据解释","type":"单选题","prompt":"某平均收入显著上升，但少数高收入者增长很快。应补充什么统计？","options":["中位数及收入分布","仅重复平均值","删除高收入者但不说明","用总人口替代收入数据"],"answers":["中位数及收入分布"],"explanation":"平均数可能受极端值影响，分布与中位数有助于理解不同群体的情况。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0036","subject":"研究方法","chapter":"数据解释","type":"单选题","prompt":"图表纵轴截断造成变化看起来巨大，合适的编辑做法是？","options":["清楚标注坐标范围并选择适合的展示方式","隐藏纵轴标签","只增加动画效果","用不同比例混合图表"],"answers":["清楚标注坐标范围并选择适合的展示方式"],"explanation":"坐标设置会影响视觉判断，选择需与图表类型和比较目的相匹配。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0037","subject":"研究方法","chapter":"研究透明","type":"单选题","prompt":"研究报告应提供哪些信息以便读者判断结论？","options":["样本来源、方法、关键指标与局限","只提供最终口号","不说明调查时间","隐藏问卷和分析规则"],"answers":["样本来源、方法、关键指标与局限"],"explanation":"透明的方法和局限有助于检验研究结论的可信度与适用范围。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0038","subject":"研究方法","chapter":"研究透明","type":"单选题","prompt":"研究发现与预设假设不一致时，应如何处理？","options":["如实报告结果并讨论可能解释","删除结果只保留支持部分","改变原始数据","假装研究从未提出假设"],"answers":["如实报告结果并讨论可能解释"],"explanation":"如实报告有助于避免选择性呈现，并支持后续检验。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0039","subject":"研究方法","chapter":"研究方法","type":"单选题","prompt":"研究者结合访谈、问卷和文件，主要希望做到什么？","options":["从不同资料和方法交叉理解问题","保证所有方法必然得到相同结果","让任何资料都不再需要核验","取消抽样与伦理要求"],"answers":["从不同资料和方法交叉理解问题"],"explanation":"多方法可以提供互补证据，但每种方法仍有局限和质量要求。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"v0040","subject":"研究方法","chapter":"研究方法","type":"单选题","prompt":"调查数据中缺失值很多，研究者应？","options":["说明缺失情况并采用有依据的处理方式","默认为零但不记录","删除所有研究问题","假设缺失一定完全随机"],"answers":["说明缺失情况并采用有依据的处理方式"],"explanation":"缺失机制和处理方式会影响结果，应透明说明并评估影响。","source":{"label":"中山大学2027年334初试参考范围：质性和量化研究方法","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"h0001","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"《申报》于1872年在哪座城市创刊？","options":["上海","北京","香港","广州"],"answers":["上海"],"explanation":"《申报》1872年在上海创刊，是中国近代重要中文报纸。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0002","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"《申报》的创刊年份是？","options":["1872年","1815年","1915年","1927年"],"answers":["1872年"],"explanation":"《申报》创刊于1872年，1949年停刊。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0003","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"《申报》经历了哪段历史时期？","options":["晚清和民国时期","仅古代唐朝","仅21世纪初","只有1949年后"],"answers":["晚清和民国时期"],"explanation":"《申报》从1872年出版至1949年，跨越晚清和民国。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0004","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"史量才与《申报》的关系是什么？","options":["曾收购并经营《申报》","1915年创办《青年杂志》","创办美国《纽约太阳报》","撰写香农—韦弗传播模式"],"answers":["曾收购并经营《申报》"],"explanation":"史量才于1912年至1934年间经营《申报》，是研究其经营与言论的重要人物。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0005","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"研究《申报》中的某一历史事件，最直接的原始材料是？","options":["相应日期的《申报》原版或可靠数字影像","没有来源的社交媒体总结","未经核实的二手回忆截图","现代广告活动海报"],"answers":["相应日期的《申报》原版或可靠数字影像"],"explanation":"报刊原件可以提供当时的报道，但仍需与其他史料互证其事实和立场。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0006","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"《申报》原文能否自动等同于历史事件的全部事实？","options":["不能，应结合其他资料和时代背景交叉研究","可以，任何当时报纸都绝对无误","可以，不需要考虑报道立场","不能，因为历史报刊没有任何史料价值"],"answers":["不能，应结合其他资料和时代背景交叉研究"],"explanation":"报刊是重要史料，但可能受到消息来源、时局和编辑立场的影响。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0007","subject":"新闻史","chapter":"《申报》","type":"单选题","prompt":"《申报》通过派遣访员到重大事件现场采访，体现了什么？","options":["报刊主动获取现场新闻的实践","只依靠读者转述","完全停止新闻采访","网络社交媒体的发展"],"answers":["报刊主动获取现场新闻的实践"],"explanation":"历史资料显示《申报》曾派访员前往重大事件现场，这有助于拓展新闻来源。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0008","subject":"新闻史","chapter":"《循环日报》","type":"单选题","prompt":"《循环日报》与哪位近代报人的政论活动联系密切？","options":["王韬","陈独秀","史量才","麦克卢汉"],"answers":["王韬"],"explanation":"王韬参与《循环日报》办报，并以大量政论文章影响舆论。","source":{"label":"武汉大学媒体发展研究中心：王韬和《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"h0009","subject":"新闻史","chapter":"《循环日报》","type":"单选题","prompt":"《循环日报》创办于哪一年？","options":["1874年","1815年","1915年","1949年"],"answers":["1874年"],"explanation":"《循环日报》1874年创办于香港。","source":{"label":"武汉大学媒体发展研究中心：王韬和《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"h0010","subject":"新闻史","chapter":"《循环日报》","type":"单选题","prompt":"研究王韬的报刊思想，最合适的材料组合是？","options":["《循环日报》原文及相关历史研究","只看现代商业广告","只看未经核实的网络短句","排除同时期报刊资料"],"answers":["《循环日报》原文及相关历史研究"],"explanation":"原文与相关研究可相互参照，并应结合晚清历史情境。","source":{"label":"武汉大学媒体发展研究中心：王韬和《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"h0011","subject":"新闻史","chapter":"《循环日报》","type":"单选题","prompt":"王韬的办报活动中，哪类文章尤其具有代表性？","options":["政论文章","现代算法推荐报告","广播电视节目单","移动应用隐私协议"],"answers":["政论文章"],"explanation":"王韬在《循环日报》发表大量政论，讨论时代问题。","source":{"label":"武汉大学媒体发展研究中心：王韬和《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"h0012","subject":"新闻史","chapter":"《新青年》","type":"单选题","prompt":"陈独秀1915年创办的《青年杂志》后来更名为？","options":["《新青年》","《循环日报》","《申报》","《纽约太阳报》"],"answers":["《新青年》"],"explanation":"《青年杂志》在1916年改名《新青年》。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"h0013","subject":"新闻史","chapter":"《新青年》","type":"单选题","prompt":"《青年杂志》与《新青年》的刊名变更说明研究报刊史时需要关注？","options":["刊名沿革与具体出版时间","所有刊物名称永久不变","只看今天的名称即可","同名刊物必然是同一机构"],"answers":["刊名沿革与具体出版时间"],"explanation":"确认刊名、期次与时间有助于避免把前身与后续刊物误判为无关刊物。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"h0014","subject":"新闻史","chapter":"《新青年》","type":"单选题","prompt":"《新青年》初期宣传的两大主张通常概括为？","options":["民主与科学","利润与股价","娱乐与广告","算法与流量"],"answers":["民主与科学"],"explanation":"《新青年》在新文化运动初期倡导民主与科学。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"h0015","subject":"新闻史","chapter":"《新青年》","type":"单选题","prompt":"研究《新青年》的历史作用，哪项做法更合适？","options":["区分不同时期的思想内容和历史环境","认为其所有时期立场完全不变","只依据刊名推断全部内容","不阅读任何具体文章"],"answers":["区分不同时期的思想内容和历史环境"],"explanation":"刊物思想及其所处环境可能随历史阶段变化，分析应结合具体时期和文本。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"h0016","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"1918年前后北京大学的新闻教育活动与哪位学者关系密切？","options":["徐宝璜","史量才","帕里泽","香农"],"answers":["徐宝璜"],"explanation":"徐宝璜在北京大学新闻学研究会及新闻学教学中发挥重要作用。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0017","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"北京大学新闻学研究会的活动对于新闻史研究有什么意义？","options":["体现早期新闻学教育和学科知识的形成","证明新闻学只是一种印刷机器","说明当时没有新闻研究","直接形成社交媒体平台"],"answers":["体现早期新闻学教育和学科知识的形成"],"explanation":"早期研究会及课程反映新闻实践向学术研究和教育转化的过程。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0018","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"《中国报学史》的作者是？","options":["戈公振","麦克卢汉","拉斯韦尔","史量才"],"answers":["戈公振"],"explanation":"戈公振撰成《中国报学史》，1927年出版，是中国新闻史研究的重要著作。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0019","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"《中国报学史》出版于？","options":["1927年","1815年","1872年","1915年"],"answers":["1927年"],"explanation":"戈公振1926年撰成该书，1927年出版；应区分撰成和出版年份。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0020","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"讨论中国新闻学由实践走向学科建设，应考虑哪些证据？","options":["新闻机构、研究会、课程与新闻学著作","只看手机应用下载量","只看一名受访者的当代看法","排除教育机构和文本"],"answers":["新闻机构、研究会、课程与新闻学著作"],"explanation":"学科建设涉及制度、教学、著作与实践经验的共同演进。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0021","subject":"新闻史","chapter":"史料方法","type":"单选题","prompt":"同一历史事件在两家当时报纸上的描述不同，应怎样研究？","options":["比较各自来源、出版时间和立场，并寻找其他史料","直接假设发行量较大的报纸必然真实","选择更符合个人偏好的版本","把不同说法拼成未经核实的新事实"],"answers":["比较各自来源、出版时间和立场，并寻找其他史料"],"explanation":"历史研究需要识别出处和背景，交叉检验而非简单择一。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0022","subject":"新闻史","chapter":"史料方法","type":"单选题","prompt":"报纸广告可为历史研究提供什么材料？","options":["商品、市场与受众文化的线索，但仍需核对真实性","证明广告中每个承诺都真实","只能说明纸张尺寸","不能反映任何社会背景"],"answers":["商品、市场与受众文化的线索，但仍需核对真实性"],"explanation":"广告作为历史文本可反映商业表达和社会文化，但不能直接视作实际效果的证明。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0023","subject":"新闻史","chapter":"史料方法","type":"单选题","prompt":"一篇回忆文章与当年档案在日期上冲突，研究者应？","options":["核查来源形成时间、记录方式及其他证据","永远优先相信回忆","直接删除档案","把两种日期相加"],"answers":["核查来源形成时间、记录方式及其他证据"],"explanation":"不同史料都有局限，需结合形成过程与交叉证据判断。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}},{"id":"h0024","subject":"新闻史","chapter":"史料方法","type":"单选题","prompt":"数字化报纸出现文字识别错误时，最可靠的处理方式是？","options":["对照原版图像并保留校正记录","只相信自动识别结果","修改原文使其更流畅","根据现代术语重写后称为原文"],"answers":["对照原版图像并保留校正记录"],"explanation":"OCR可能误识别文字，研究引用应核对原版并记录必要的校正。","source":{"label":"中国人民大学清史研究所：《申报》历史","url":"https://iqh.ruc.edu.cn/old/qszx/qsjt/c55268cfdc7c4a4faaee3a36c1d12f93.htm"}},{"id":"h0025","subject":"新闻史","chapter":"史料方法","type":"单选题","prompt":"将历史报刊研究结果用于解释今天的平台治理，最恰当的方式是？","options":["比较媒介条件和制度背景，并说明历史类比的边界","认为两个时代完全相同","忽略技术和社会差异","用历史案例替代对当代情况的调查"],"answers":["比较媒介条件和制度背景，并说明历史类比的边界"],"explanation":"历史比较有启发性，但不应忽视技术、制度和社会环境的变化。","source":{"label":"南京社科联：新闻传播学学科体系的观察与思考","url":"https://ass.nanjing.gov.cn/skkw/njshkx/201701/t20170123_1946369.html"}}]</script><script>/* 浏览器和测试共同使用同一套判分规则。 */
(() => {
  function normalizeAnswer(value) {
    return String(value ?? '').normalize('NFKC')
      .replace(/[\s\u3000，。；：、！？,.!?;:《》“”‘’]/g, '')
      .toLowerCase();
  }
  function gradeAnswer(answers, value) {
    const normalized = normalizeAnswer(value);
    if (!normalized) return false;
    return Array.isArray(answers) && answers.some(answer => {
      const candidate = normalizeAnswer(answer);
      return candidate !== '' && candidate === normalized;
    });
  }
  globalThis.objectiveGrading = { normalizeAnswer, gradeAnswer };
})();
</script><script>/* 客观题练习与原有主观题记录分开保存，避免覆盖已有作答。 */
(() => {
  const data = window.OBJECTIVE_QUESTIONS;
  if (!Array.isArray(data) || !data.length) return;
  const storageKey = 'xcyx-objective-v1';
  let state;
  try { state = JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch { state = {}; }
  const el = document.createElement('section');
  el.className = 'hidden wrap';
  el.id = 'objective';
  el.innerHTML = '<div class="topline"><div><small class="eyebrow">KNOWLEDGE CHECK</small><h1 class="serif">知识自测</h1><p id="obj-progress" class="muted"></p></div><span id="obj-counter"></span></div><div class="toolbar"><select id="obj-subject" aria-label="科目"><option value="">全部科目</option></select><select id="obj-type" aria-label="题型"><option value="">全部题型</option><option>单选题</option><option>填空题</option></select><select id="obj-mode" aria-label="练习范围"><option value="all">全部题目</option><option value="wrong">错题复练</option><option value="favorite">收藏练习</option></select><button class="ghost" id="obj-random">随机一题</button></div><div class="practice"><article class="card question"><div class="tags" id="obj-tags"></div><h2 class="serif" id="obj-prompt"></h2><div id="obj-input"></div><div class="row"><button class="ghost" id="obj-prev">← 上一题</button><button class="primary" id="obj-submit">提交答案</button><button class="ghost" id="obj-next">下一题 →</button></div></article><aside><div class="card"><button class="ghost heart" id="obj-favorite">♡ 收藏</button><p id="obj-result" aria-live="polite"></p><div id="obj-explanation"></div></div></aside></div>';
  document.body.insertBefore(el, document.body.querySelector('script'));
  const $ = s => el.querySelector(s);
  for (const subject of [...new Set(data.map(q => q.subject))]) {
    const option = document.createElement('option'); option.textContent = subject; option.value = subject; $('#obj-subject').append(option);
  }
  let filtered = data, index = 0;
  function persist() { localStorage.setItem(storageKey, JSON.stringify(state)); }
  function filter() {
    filtered = data.filter(q => (!$('#obj-subject').value || q.subject === $('#obj-subject').value) && (!$('#obj-type').value || q.type === $('#obj-type').value) && ($('#obj-mode').value === 'all' || ($('#obj-mode').value === 'wrong' ? state[q.id]?.wrong : state[q.id]?.favorite)));
    index = 0; render();
  }
  function render() {
    const completed = data.filter(q => state[q.id]?.done).length;
    const incorrect = data.filter(q => state[q.id]?.wrong).length;
    $('#obj-progress').textContent = `已完成 ${completed} / ${data.length} 题 · 待复练 ${incorrect} 题 · 进度保存在本机`;
    const q = filtered[index];
    $('#obj-counter').textContent = q ? `${index + 1} / ${filtered.length}` : '0 / 0';
    $('#obj-prompt').textContent = q?.prompt || '当前条件下没有题目。';
    $('#obj-tags').textContent = q ? `${q.subject} · ${q.chapter} · ${q.type}` : '';
    $('#obj-input').replaceChildren(); $('#obj-explanation').replaceChildren();
    $('#obj-submit').disabled = !q; $('#obj-favorite').disabled = !q; $('#obj-prev').disabled = !q; $('#obj-next').disabled = !q; $('#obj-random').disabled = !q;
    if (!q) { $('#obj-result').textContent = ''; return; }
    const saved = state[q.id] || {};
    $('#obj-favorite').textContent = saved.favorite ? '♥ 已收藏' : '♡ 收藏';
    if (q.type === '单选题') {
      const shift = Number(q.id.replace(/\D/g, '')) % q.options.length;
      const options = [...q.options.slice(shift), ...q.options.slice(0, shift)];
      options.forEach((option, i) => {
        const label = document.createElement('label'); label.style.cssText = 'display:block;padding:12px;margin:8px 0;border:1px solid #cbc4b6;border-radius:10px;cursor:pointer';
        const input = document.createElement('input'); input.type = 'radio'; input.name = 'objective-answer'; input.value = option; input.checked = saved.answer === option; input.disabled = !!saved.done;
        input.addEventListener('change', () => { state[q.id] = {...state[q.id], answer:option}; persist(); });
        label.append(input, document.createTextNode(` ${String.fromCharCode(65+i)}. ${option}`)); $('#obj-input').append(label);
      });
    } else {
      const input = document.createElement('input'); input.className = 'search'; input.id = 'obj-answer'; input.placeholder = '输入你的答案'; input.value = saved.answer || ''; input.disabled = !!saved.done;
      input.addEventListener('input', () => { state[q.id] = {...state[q.id], answer:input.value}; persist(); });
      $('#obj-input').append(input);
    }
    $('#obj-result').textContent = saved.done ? (saved.wrong ? '回答有误，再看看解析。' : '回答正确。') : '作答后查看答案与解析';
    $('#obj-submit').textContent = saved.done ? '重新作答' : '提交答案';
    if (saved.done) {
      const answer = document.createElement('p'); answer.textContent = `参考答案：${q.answers.join(' / ')}`;
      const explanation = document.createElement('p'); explanation.textContent = q.explanation;
      const link = document.createElement('a'); link.href = q.source.url; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = q.source.label;
      const note = document.createElement('small'); note.append('原创练习 · 范围依据：', link);
      $('#obj-explanation').append(answer, explanation, note);
    }
  }
  $('#obj-submit').onclick = () => {
    const q = filtered[index]; if (!q) return;
    if (state[q.id]?.done) { state[q.id] = { ...state[q.id], done:false, answer:'' }; persist(); render(); return; }
    const value = q.type === '单选题' ? el.querySelector('input[name="objective-answer"]:checked')?.value : $('#obj-answer')?.value;
    if (!value?.trim()) { $('#obj-result').textContent = '请先作答。'; return; }
    const correct = window.objectiveGrading.gradeAnswer(q.answers, value);
    state[q.id] = { ...state[q.id], answer:value, done:true, wrong:!correct }; persist(); render();
  };
  $('#obj-favorite').onclick = () => { const q=filtered[index]; if (!q) return; state[q.id]={...state[q.id],favorite:!state[q.id]?.favorite}; persist(); render(); };
  $('#obj-prev').onclick = () => { if (filtered.length) { index=(index-1+filtered.length)%filtered.length; render(); } };
  $('#obj-next').onclick = () => { if (filtered.length) { index=(index+1)%filtered.length; render(); } };
  $('#obj-random').onclick = () => { if (filtered.length) { index=Math.floor(Math.random()*filtered.length); render(); } };
  ['obj-subject','obj-type','obj-mode'].forEach(id => $('#'+id).onchange=filter);
  const button = document.createElement('button'); button.textContent='知识自测';
  document.querySelector('.tabs').append(button);
  button.onclick = () => { ['home','practice','knowledge'].forEach(id=>document.getElementById(id).classList.add('hidden')); document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on')); button.classList.add('on'); el.classList.remove('hidden'); render(); window.scrollTo(0,0); };
  document.querySelectorAll('[data-tab],[data-go]').forEach(b=>b.addEventListener('click',()=>{ el.classList.add('hidden'); button.classList.remove('on'); }));
})();
</script></body></html>
