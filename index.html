:root{--g:#174a38;--p:#f5f2eb;--card:#fbfaf6;--ink:#17231d;--red:#b64b36;--line:#d9d4c9}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.serif{font-family:"Songti SC",Georgia,serif}.wrap{max-width:1180px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:8;background:#f5f2ebee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}header .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand b{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:10px;border-radius:11px;background:var(--g);color:white}.tabs{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:99px}.tabs button{border:0;border-radius:99px;background:transparent;padding:8px 15px}.tabs .on{background:var(--g);color:#fff}.hero{background:var(--g);color:#fff;padding:76px 0 94px}.hero small,.eyebrow{font:700 11px ui-monospace;letter-spacing:.13em;color:#dcb65a}.hero h1{font-size:clamp(44px,7vw,76px);line-height:1.08;margin:18px 0}.hero h1 span{color:#e2bd62}.hero p{max-width:620px;color:#d4dfd9;font-size:18px}.hero button,.primary{border:0;border-radius:11px;background:#dcb65a;padding:13px 20px;font-weight:800}.summary{margin-top:-36px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #17231d0b}.card strong.big{display:block;font-size:38px}.feature{margin:24px auto 60px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.feature button{text-align:left;min-height:230px}.feature h2{font-size:32px;margin:45px 0 6px}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.toolbar select,.search{height:46px;border:1px solid #cbc4b6;border-radius:10px;background:var(--card);padding:0 12px}.practice{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;padding-bottom:60px}.question h2{font-size:28px;line-height:1.5}.tags span{display:inline-block;background:#e4ebe6;color:#315342;border-radius:99px;padding:4px 9px;margin:0 5px 5px 0;font-size:12px;font-weight:800}.question textarea{width:100%;min-height:300px;border:1px solid #cbc4b6;border-radius:12px;background:white;padding:18px;line-height:1.9}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.ghost,.primary{border:1px solid #cbc4b6;border-radius:10px;background:var(--card);padding:10px 14px}.primary{background:var(--g);color:#fff;border-color:var(--g)}.answer{max-height:75vh;overflow:auto}.answer label{display:block;background:#efece4;border-radius:9px;padding:9px;margin:7px 0}.answer input{accent-color:var(--g)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:60px}.k h2{font-size:25px;margin:8px 0}.k details{margin-top:12px}.k summary{font-weight:800;color:var(--g);cursor:pointer}.muted{color:#68736b}.search{width:100%}.topline{display:flex;align-items:end;justify-content:space-between;margin-top:30px}.notice{font-size:12px;color:#68736b}.heart{color:var(--red)}@media(max-width:760px){.brand span{display:none}.summary,.feature,.practice,.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.hero{padding:50px 0 74px}.answer{max-height:none}.card{padding:18px}}

<main id="home"><section class="hero"><div class="wrap"><small>334 · 440 NEWS & COMMUNICATION</small><h1 class="serif">把知识，练成<br><span>考场上的答案</span></h1><p>按章节拆解理论，用采分点复盘主观题。500 道主观题、502 道知识自测题，覆盖通用 334 + 440。</p><button data-go="practice">开始刷题 →</button></div></section><div class="wrap"><div class="summary"><div class="card"><small class="eyebrow">学习进度</small><h2 class="serif">继续今天的训练</h2><p id="progress">主观题已完成 0 / 500 题</p></div><div class="card"><strong class="big serif" id="wrongCount">0</strong><span class="muted">待复刷错题</span></div><div class="card"><strong class="big serif" id="favCount">0</strong><span class="muted">已收藏题目</span></div></div><div class="feature"><button class="card" data-go="practice"><small class="eyebrow">01</small><h2 class="serif">章节刷题</h2><p class="muted">筛选、作答、采分点自评、错题与收藏。</p></button><button class="card" data-go="knowledge"><small class="eyebrow">02</small><h2 class="serif">知识点</h2><p class="muted">定义、答题框架、易错辨析与关联练习。</p></button></div></div></main>
<main id="practice" class="hidden wrap"><div class="topline"><div><small class="eyebrow">CHAPTER PRACTICE</small><h1 class="serif">章节刷题</h1></div><span id="counter"></span></div><div class="toolbar"><select id="exam"><option>全部</option><option>334</option><option>440</option><option>通用</option></select><select id="subject"></select><select id="type"><option>全部</option><option>名词解释</option><option>简答题</option><option>论述题</option><option>材料分析题</option><option>实务题</option></select><button class="ghost" id="random">随机一题</button></div><div class="practice"><article class="card question"><div class="tags" id="tags"></div><p class="muted" id="chapter"></p><h2 class="serif" id="prompt"></h2><textarea id="answer" placeholder="先列框架，再补充理论、案例与评价……"></textarea><div class="row"><button class="ghost" id="prev">← 上一题</button><button class="primary" id="submit">提交并对照答案</button><button class="primary hidden" id="next">下一题 →</button></div></article><aside><div class="card"><div class="row"><b>本题状态</b><button class="ghost heart" id="favorite">♡ 收藏</button></div><p id="score">自评分 0%</p></div><div class="card answer hidden" id="answerPanel"><small class="eyebrow">参考答案</small><p id="reference" style="white-space:pre-line"></p><h3>采分点自评</h3><div id="points"></div><p id="pitfall"></p><small id="source" class="muted"></small></div></aside></div></main>
<main id="knowledge" class="hidden wrap"><div class="topline"><div><small class="eyebrow">KNOWLEDGE ATLAS</small><h1 class="serif">知识点</h1></div><span id="kcount"></span></div><div class="toolbar"><input class="search" id="search" placeholder="搜索概念、理论或关键词"><select id="ksubject"></select></div><div class="grid" id="kgrid"></div></main>
<script>window.DATA={knowledge:[],questions:[]}</script><script src="knowledge-1.js"></script><script src="knowledge-2.js"></script><script src="knowledge-3.js"></script><script src="knowledge-4.js"></script><script src="knowledge-5.js"></script><script src="questions-1.js"></script><script src="questions-2.js"></script><script src="questions-3.js"></script><script src="questions-4.js"></script><script src="questions-5.js"></script><script src="questions-6.js"></script><script src="questions-7.js"></script><script src="questions-8.js"></script><script src="questions-9.js"></script><script src="questions-10.js"></script><script>const DATA=window.DATA;const $=s=>document.querySelector(s),state=JSON.parse(localStorage.getItem('xcyx-static')||'{}');let view='home',idx=0,filtered=DATA.questions;const subjects=['全部',...new Set(DATA.knowledge.map(x=>x.subject))];function save(){localStorage.setItem('xcyx-static',JSON.stringify(state));stats()}function stats(){const a=Object.values(state),d=a.filter(x=>x.done).length,w=a.filter(x=>x.wrong).length,f=a.filter(x=>x.favorite).length;$('#progress').textContent='主观题已完成 '+d+' / 500 题';$('#wrongCount').textContent=w;$('#favCount').textContent=f}function show(v){view=v;['home','practice','knowledge'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==v));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===v));if(v==='practice')renderQ();if(v==='knowledge')renderK();scrollTo(0,0)}document.querySelectorAll('[data-go],[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.go||b.dataset.tab));['subject','ksubject'].forEach(id=>$('#'+id).innerHTML=subjects.map(x=>'<option>'+x+'</option>').join(''));function filter(){filtered=DATA.questions.filter(q=>($('#exam').value==='全部'||q.exam===$('#exam').value)&&($('#subject').value==='全部'||q.subject===$('#subject').value)&&($('#type').value==='全部'||q.type===$('#type').value));idx=0;renderQ()}['exam','subject','type'].forEach(id=>$('#'+id).onchange=filter);function renderQ(){const q=filtered[idx]||DATA.questions[0],s=state[q.id]||{};$('#counter').textContent=(idx+1)+' / '+filtered.length;$('#tags').innerHTML=[q.exam,q.subject,q.type,q.difficulty].map(x=>'<span>'+x+'</span>').join('');$('#chapter').textContent=q.chapter;$('#prompt').textContent=q.prompt;$('#answer').value=s.answer||'';$('#answer').disabled=!!s.done;$('#favorite').textContent=s.favorite?'♥ 已收藏':'♡ 收藏';$('#score').textContent='自评分 '+(s.score||0)+'%';$('#answerPanel').classList.toggle('hidden',!s.done);$('#submit').classList.toggle('hidden',!!s.done);$('#next').classList.toggle('hidden',!s.done);if(s.done){$('#reference').textContent=q.answer;$('#pitfall').innerHTML='<b>易错提醒：</b>'+q.pitfall;$('#source').textContent='依据：'+q.source;$('#points').innerHTML=q.keyPoints.map((p,i)=>'<label><input type="checkbox" data-i="'+i+'" '+((s.checks||[])[i]?'checked':'')+'> '+p+'</label>').join('');document.querySelectorAll('#points input').forEach(c=>c.onchange=()=>{const checks=[...document.querySelectorAll('#points input')].map(x=>x.checked),score=Math.round(checks.filter(Boolean).length/checks.length*100);state[q.id]={...state[q.id],checks,score,wrong:score<60};save();renderQ()})}}$('#submit').onclick=()=>{const q=filtered[idx];state[q.id]={...state[q.id],answer:$('#answer').value,done:true,wrong:true,score:0,checks:[]};save();renderQ()};$('#favorite').onclick=()=>{const q=filtered[idx];state[q.id]={...state[q.id],answer:$('#answer').value,favorite:!state[q.id]?.favorite};save();renderQ()};$('#prev').onclick=()=>{idx=(idx-1+filtered.length)%filtered.length;renderQ()};$('#next').onclick=()=>{idx=(idx+1)%filtered.length;renderQ()};$('#random').onclick=()=>{idx=Math.floor(Math.random()*filtered.length);renderQ()};function renderK(){const term=$('#search').value.trim(),sub=$('#ksubject').value;const list=DATA.knowledge.filter(k=>(sub==='全部'||k.subject===sub)&&(!term||k.title.includes(term)||k.definition.includes(term)));$('#kcount').textContent=list.length+' 个知识点';$('#kgrid').innerHTML=list.map(k=>'<article class="card k"><small class="eyebrow">'+k.subject+'</small><h2 class="serif">'+k.title+'</h2><p class="muted">'+k.definition+'</p><details><summary>展开答题框架</summary><ol>'+k.framework.map(x=>'<li>'+x+'</li>').join('')+'</ol><p>'+k.expression+'</p></details><button class="ghost" data-k="'+k.id+'">练相关题 →</button></article>').join('');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{filtered=DATA.questions.filter(q=>q.knowledgeId===b.dataset.k);idx=0;show('practice')})}$('#search').oninput=renderK;$('#ksubject').onchange=renderK;stats();</script><script>window.OBJECTIVE_QUESTIONS=[{"id":"o0001","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"媒体持续突出某一公共议题后，公众认为该议题更加重要。最直接解释这一现象的是哪一理论？","options":["议程设置理论","使用与满足理论","创新扩散理论","沉默的螺旋理论"],"answers":["议程设置理论"],"explanation":"议程设置研究媒介议题显著性与公众议题显著性的关联。使用与满足关注受众需求；创新扩散关注创新的传播与采纳；沉默的螺旋关注意见气候对表达意愿的影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0002","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"在沉默的螺旋理论中，个人对周围意见分布的感知会影响其公开表达意愿，这种感知的意见环境称为________。","answers":["意见气候","舆论气候"],"explanation":"意见气候是个体感知到的社会意见分布。认为自己处于少数且担心孤立的人，可能更不愿公开表达。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0003","subject":"传播理论","chapter":"传播过程","type":"单选题","prompt":"拉斯韦尔的传播模式中，‘通过什么渠道’对应下列哪一分析环节？","options":["媒介分析","控制分析","受众分析","效果分析"],"answers":["媒介分析"],"explanation":"五个环节依次是传播者、内容、媒介、受众和效果；渠道属于媒介分析。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0004","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"香农—韦弗传播模式强调信号传输过程中可能受到________干扰。","answers":["噪声","噪音"],"explanation":"该模式把噪声作为影响信号传输的重要因素；其技术传输取向也使它不能单独解释意义协商和社会语境。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0005","subject":"新闻理论","chapter":"新闻价值","type":"单选题","prompt":"一条消息涉及本地居民饮水安全，影响范围广、后果直接。这主要体现新闻价值的哪一要素？","options":["重要性","趣味性","接近性","显著性"],"answers":["重要性"],"explanation":"饮水安全影响人群广、后果重大，关键是重要性；‘本地’也可能涉及接近性，但题干明确强调影响范围和后果，因此选重要性。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0006","subject":"新闻实务","chapter":"新闻写作","type":"填空题","prompt":"消息写作中，按照事实重要程度递减安排内容的常见结构称为________结构。","answers":["倒金字塔"],"explanation":"倒金字塔结构通常先呈现最重要的事实，后续依重要程度递减补充信息；它强调信息排序，而非事件发生的时间顺序。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0007","subject":"新闻实务","chapter":"采访与核实","type":"单选题","prompt":"记者收到一张声称发生于今天的灾情图片。核实图片是否来自旧事件，最直接的第一步是？","options":["反向搜索图片并比对最早公开版本","仅核对转发量是否足够大","以图片画质判断拍摄日期","直接引用发布者的描述"],"answers":["反向搜索图片并比对最早公开版本"],"explanation":"反向图片搜索可以发现旧图或不同语境的版本，但还应结合原始来源、地点、拍摄时间和现场信息核验；转发量和画质都不能证明时间。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0008","subject":"网络与新媒体","chapter":"数字社会","type":"单选题","prompt":"老年人与年轻人都拥有智能手机，但前者更难识别诈骗信息、完成线上服务。该差距最直接体现什么？","options":["数字能力与使用层面的鸿沟","仅有设备接入层面的鸿沟","新闻价值的显著性","单纯的传播渠道冗余"],"answers":["数字能力与使用层面的鸿沟"],"explanation":"双方均已接入设备，差异主要在技能和实际使用效果。数字鸿沟不仅指有没有设备，还包括能力、使用及收益差异。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0009","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"研究者发现，受众倾向选择与原有立场一致的新闻来源。这一行为最适合用什么概念解释？","options":["选择性接触","议程设置","培养效果","创新扩散"],"answers":["选择性接触"],"explanation":"选择性接触指人们更可能接触与自身态度相容的信息，并非所有人都会完全回避异见；议程设置关注议题重要性，培养理论关注长期接触的累积影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0010","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"卡茨和拉扎斯菲尔德提出的大众传播‘两级传播’中，大众媒介信息常经由________再影响其他人。","answers":["意见领袖"],"explanation":"意见领袖既接触媒介信息，也通过人际网络解释和传递信息。两级传播是早期概括，现实传播可能存在多级、交叉与直接影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0011","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"关于‘第三人效果’，哪一项描述最准确？","options":["人们倾向认为媒介信息对他人的影响大于对自己的影响","传播者先影响三个意见领袖再触达公众","受众只能记住报道中的第三项事实","所有人对同一媒体内容反应完全一致"],"answers":["人们倾向认为媒介信息对他人的影响大于对自己的影响"],"explanation":"第三人效果首先是一种影响感知差距，尤其常见于被视为不受欢迎的信息；不能直接把这种主观判断当成实际效果差异。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0012","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"知识沟假说关注不同社会经济地位群体获取信息的速度差异，由此可能扩大的知识________。","answers":["差距","鸿沟"],"explanation":"知识沟研究社会经济地位不同的群体在获取和运用公共信息上的差距，知识增长并不意味着群体间差距自动缩小。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0013","subject":"传播理论","chapter":"受众研究","type":"单选题","prompt":"研究一名学生为何选择播客而非短视频获取知识，重点分析其信息、陪伴和情绪需求。这一研究最接近哪种路径？","options":["使用与满足","魔弹论","技术决定论","守门人研究"],"answers":["使用与满足"],"explanation":"使用与满足从受众需求与媒介选择出发，关注使用动机和获得的满足；并不意味着受众选择完全不受平台和社会结构制约。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0014","subject":"传播理论","chapter":"受众研究","type":"填空题","prompt":"霍尔的编码／解码研究中，受众既接受文本的一部分主导意义，又结合自身处境加以调整，称为________式解读。","answers":["协商","协商性"],"explanation":"协商式解读部分接受主导意义，同时结合具体生活条件进行调整；它不同于完全接受的主导式和系统性反对的对抗式解读。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0015","subject":"传播理论","chapter":"媒介理论","type":"单选题","prompt":"‘媒介即讯息’的分析重点是什么？","options":["媒介形式及其使用方式会改变人的感知与社会组织","所有传播内容都毫无意义","任何媒介都只有一种使用方式","受众永远被动接受信息"],"answers":["媒介形式及其使用方式会改变人的感知与社会组织"],"explanation":"麦克卢汉强调媒介形式本身对感官比例和社会关系的影响，而非声称具体内容完全没有意义。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0016","subject":"新闻理论","chapter":"新闻真实性","type":"单选题","prompt":"记者根据匿名帖子写成‘官方已确认停水’，但并未联系供水部门核实。最直接违反哪项基本要求？","options":["对事实与信息来源进行核实","在标题中使用短句","对报道安排倒金字塔结构","采用人物通讯体裁"],"answers":["对事实与信息来源进行核实"],"explanation":"匿名网帖不能证明官方确认，记者应核实原始通知、联系主管部门并标明已知与未知。写作结构无法弥补事实核实缺失。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0017","subject":"新闻理论","chapter":"新闻伦理","type":"填空题","prompt":"新闻报道不得因未经审判的舆论压力，把被指控者直接宣布有罪；应尊重________原则。","answers":["无罪推定"],"explanation":"无罪推定要求在有罪依法确定之前，不把被追诉者直接视为罪犯。报道可监督司法，但应审慎使用称谓和证据。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0018","subject":"新闻实务","chapter":"新闻采访","type":"单选题","prompt":"记者问受访者：‘事情发生后，您采取了哪些行动？’这主要是哪类问题？","options":["开放式问题","封闭式问题","诱导式结论","事实陈述"],"answers":["开放式问题"],"explanation":"开放式问题允许受访者以自己的语言展开细节；封闭式问题通常限定答案范围，如‘您是否报警’。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0019","subject":"新闻实务","chapter":"新闻采访","type":"单选题","prompt":"受访者说‘部门一直没有回应’。为核实这一说法，记者下一步最合适的做法是？","options":["追问联系时间和方式，并向部门核实","直接认定部门失职","要求受访者放弃采访","删除受访者的全部陈述"],"answers":["追问联系时间和方式，并向部门核实"],"explanation":"追问应形成可核验的时间线和证据，并给被指涉方回应机会；单方陈述可以成为线索，但不能自动等于事实结论。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0020","subject":"新闻实务","chapter":"新闻写作","type":"单选题","prompt":"一则消息的导语最主要的功能是什么？","options":["以简洁方式呈现最重要或最有吸引力的事实","完整罗列采访中所有细节","只表明记者个人观点","替代正文中的全部信源"],"answers":["以简洁方式呈现最重要或最有吸引力的事实"],"explanation":"导语帮助读者迅速把握新闻要点；需要解释的背景、证据与信源仍应在后文适当交代。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0021","subject":"新闻实务","chapter":"新闻评论","type":"填空题","prompt":"新闻评论通常围绕新闻事实提出明确判断，并以事实和逻辑展开________，不能只罗列观点。","answers":["论证"],"explanation":"评论由论点、论据和论证组织而成。判断需要有事实支撑，推理应回应可能的反例与利益冲突。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0022","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"下列哪份报刊通常被视为维新派的重要舆论阵地？","options":["《时务报》","《察世俗每月统记传》","《纽约太阳报》","《泰晤士报》"],"answers":["《时务报》"],"explanation":"《时务报》创办于1896年，梁启超等人的政论推动了维新思想传播；其余选项不属于该维新派报刊。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0023","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"1915年陈独秀在上海创办《青年杂志》，次年更名为《________》。","answers":["新青年","《新青年》"],"explanation":"《青年杂志》后更名《新青年》，是新文化运动的重要刊物。答题时应区分创办时间和更名时间。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0024","subject":"新闻史","chapter":"外国新闻史","type":"单选题","prompt":"19世纪美国‘便士报’的重要变化是什么？","options":["以低价扩大读者，并更重视大众新闻和广告","只面向议会以高价发行","完全取消商业广告","只使用口头方式传播"],"answers":["以低价扩大读者，并更重视大众新闻和广告"],"explanation":"便士报以较低售价争取更广泛的读者，依赖广告等商业收入，并扩大地方、社会等大众新闻；它的发展与城市化和印刷技术进步有关。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0025","subject":"网络与新媒体","chapter":"平台传播","type":"填空题","prompt":"平台根据用户行为与内容特征选择并排序信息的机制，通常称为________推荐。","answers":["算法"],"explanation":"算法推荐会影响可见性和信息分配。其结果取决于目标函数、训练数据及用户行为，并非必然导致每个人形成封闭的信息茧房。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0026","subject":"网络与新媒体","chapter":"平台传播","type":"单选题","prompt":"平台对合成新闻画面加注醒目标识，并保留内容出处，其最直接的作用是什么？","options":["帮助受众识别合成内容并追溯来源","保证所有合成内容都绝对真实","使内容不再受任何版权规则约束","代替对新闻事实的核实"],"answers":["帮助受众识别合成内容并追溯来源"],"explanation":"标识和溯源可以提示内容生成方式、帮助核查，但无法独立保证事实真实或解决授权问题；仍需核验和人工把关。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0027","subject":"广告公关","chapter":"公共关系","type":"单选题","prompt":"工厂噪音扰民后，企业仅发布‘我们重视环保’广告。若要改善公共关系，最优先的行动是什么？","options":["测量噪音、整改并与居民建立沟通机制","购买更多形象广告掩盖投诉","要求居民停止投诉","只统计广告点击量"],"answers":["测量噪音、整改并与居民建立沟通机制"],"explanation":"公共关系包含组织行动和双向沟通。噪音是实际利益问题，可信沟通依赖测量、整改和可检验的回应。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0028","subject":"广告公关","chapter":"危机传播","type":"填空题","prompt":"企业应对食品安全危机时，应区分已知与未知事实，并明确下一次信息________的时间。","answers":["更新","公布","发布"],"explanation":"初步回应需要说明风险和保护行动、哪些事实仍在调查以及何时更新；不能把尚未查明的原因当作结论。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0029","subject":"传播理论","chapter":"传播过程","type":"单选题","prompt":"施拉姆的传播模式把传播视为互动过程。其相较单向传输模式更强调哪一因素？","options":["传播双方的反馈与共同经验","信号传输中的唯一噪声源","报纸发行价格","新闻事件的重要性"],"answers":["传播双方的反馈与共同经验"],"explanation":"施拉姆强调编码、译码、反馈和传播双方经验范围的重叠；这使传播不仅是单向传送，还包括相互理解。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0030","subject":"传播理论","chapter":"传播过程","type":"填空题","prompt":"传播学中，信息被转化为符号的过程称为________，受众对符号进行理解的过程称为解码。","answers":["编码"],"explanation":"编码是将意义组织为可传播符号的过程；解码受受众经验与文化语境影响，二者不一定完全对称。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0031","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"某研究发现重度电视观众更倾向于高估社会暴力发生率。该研究问题与哪种理论最相关？","options":["培养理论","议程设置理论","创新扩散理论","把关理论"],"answers":["培养理论"],"explanation":"培养理论关注长期接触媒介内容与人们社会现实认知之间的累积关系；研究关联时还需控制现实经历等因素。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0032","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"一篇报道把交通拥堵主要解释为公共交通不足，另一篇则解释为司机素质问题。两篇报道最明显的差别是？","options":["问题归因和呈现框架不同","传输技术一定不同","新闻事件发生的地点不同","两篇报道都必然是虚假新闻"],"answers":["问题归因和呈现框架不同"],"explanation":"框架涉及对事实的选择、强调、问题定义和因果解释。框架不同不自动证明其中一篇虚假，但需要检查是否遗漏关键证据。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0033","subject":"传播理论","chapter":"传播效果","type":"填空题","prompt":"创新扩散理论研究新观念或技术如何通过传播渠道，在一定时间内被社会系统成员________。","answers":["采纳","接受"],"explanation":"创新扩散关注知晓、态度、决策、实施等过程及采纳者差异；采纳受到社会网络、可试用性和制度环境等多因素影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0034","subject":"传播理论","chapter":"传播效果","type":"单选题","prompt":"一项新技术虽然优势明显，但安装费用高，普通家庭难以承担。创新扩散研究应重点补充什么？","options":["采纳成本和资源条件","仅统计发布会新闻稿数量","取消对潜在使用者的调查","把所有未采纳者视为缺乏理性"],"answers":["采纳成本和资源条件"],"explanation":"创新能否被采纳与经济成本、可及性及组织环境有关，不能只看技术优势或把未采纳归咎个人态度。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0035","subject":"传播理论","chapter":"媒介与社会","type":"单选题","prompt":"传播政治经济学研究社交平台时，最关注下列哪组关系？","options":["平台所有权、广告收入、数据和劳动","只分析语音的音高","只统计标点符号","只讨论个人阅读习惯而不涉及制度"],"answers":["平台所有权、广告收入、数据和劳动"],"explanation":"传播政治经济学考察传播资源的所有权、生产、分配和权力结构，平台数据与劳动关系都属于相关问题。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0036","subject":"传播理论","chapter":"媒介与社会","type":"填空题","prompt":"哈贝马斯讨论的公共领域强调公民能够围绕共同事务展开公开、理性的________。","answers":["讨论","辩论"],"explanation":"公共领域指介于私人领域和国家权力之间的公共讨论空间；分析时也应考察准入障碍、权力不平等与商业化影响。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0037","subject":"传播理论","chapter":"媒介与社会","type":"单选题","prompt":"平台用户不断发布内容、提供行为数据，平台据此获得广告收入。用‘数字劳动’分析时，核心问题是什么？","options":["用户活动如何创造价值及其收益如何分配","用户是否都签署了同一份雇佣合同","每个用户的劳动时间都完全相同","广告一定完全无效"],"answers":["用户活动如何创造价值及其收益如何分配"],"explanation":"数字劳动视角关注用户活动、内容和数据如何参与价值创造，以及平台、劳动者和用户之间的权力与收益关系；不要求所有用户都是雇员。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0038","subject":"新闻理论","chapter":"新闻选择","type":"单选题","prompt":"两条消息同样真实，编辑选择优先报道与公众健康密切相关的一条。该过程最直接体现？","options":["新闻选择与新闻价值判断","信号传输中的噪声","单纯的语法纠错","新闻源自动等于新闻事实"],"answers":["新闻选择与新闻价值判断"],"explanation":"真实是新闻报道的基础；在真实事实中，编辑还需要根据重要性、时效性、公共利益等因素作出选择。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0039","subject":"新闻理论","chapter":"新闻真实性","type":"单选题","prompt":"报道中每个引述都真实，但记者删去关键时间条件，造成读者对事件性质的错误理解。这说明真实性还要求什么？","options":["事实关系和整体语境准确","只要字面引述准确即可","只需确认受访者身份","避免提供背景材料"],"answers":["事实关系和整体语境准确"],"explanation":"局部事实的准确不能替代整体真实。剪辑、排列和背景遗漏可能改变事实之间的关系，报道应核实语境。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0040","subject":"新闻理论","chapter":"新闻伦理","type":"填空题","prompt":"采访未成年人时，记者应尤其注意保护其身份、个人信息和合法________。","answers":["权益","权利"],"explanation":"未成年人报道应评估公开身份可能产生的伤害，妥善征求同意，并注意匿名化不能仅靠遮挡姓名。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0041","subject":"新闻理论","chapter":"新闻伦理","type":"单选题","prompt":"报道灾难现场时，记者拟拍摄遇难者家属的极度痛苦特写。优先应当评估什么？","options":["公共利益、知情同意与可能造成的二次伤害","画面能否增加点击量即可","家属是否具有社交媒体账号","照片文件大小"],"answers":["公共利益、知情同意与可能造成的二次伤害"],"explanation":"灾难报道既要保障公众知情，也应考虑受害者尊严、隐私和二次伤害；现场同意及传播范围都需要审慎评估。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0042","subject":"新闻理论","chapter":"新闻伦理","type":"单选题","prompt":"记者接受报道对象提供的昂贵旅游并按对方要求删除负面事实，最直接的职业风险是什么？","options":["利益冲突影响独立判断与报道真实性","新闻格式自动变成长消息","采访地点不够正式","读者必然不知道报道来源"],"answers":["利益冲突影响独立判断与报道真实性"],"explanation":"接受利益并允许报道对象控制事实呈现，会损害新闻独立性和完整性；机构应建立利益冲突申报与回避规则。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0043","subject":"新闻理论","chapter":"事实核查","type":"填空题","prompt":"核查一则数字消息时，除核对数值，还应核对统计口径、时间范围和数据________。","answers":["来源","出处"],"explanation":"即使数字计算正确，统计口径或时间范围不一致也可能造成误导。应尽可能查找原始报告并说明局限。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0044","subject":"新闻理论","chapter":"新闻来源","type":"单选题","prompt":"关于匿名消息来源，下列做法最合适的是？","options":["评估匿名必要性，尽可能独立核实并向编辑说明身份","只要消息刺激就无需核实","向所有读者公开承诺保密的真实姓名","把匿名来源描述成多个互相独立的来源"],"answers":["评估匿名必要性，尽可能独立核实并向编辑说明身份"],"explanation":"匿名可降低特定情境下信源风险，但也增加核验难度。记者应向编辑交代信源情况，并尽量使用独立证据交叉验证。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0045","subject":"新闻理论","chapter":"新闻与舆论","type":"单选题","prompt":"新闻报道与舆论评论的关系，下列说法较准确的是？","options":["报道侧重提供经过核实的事实，评论在事实基础上提出判断","新闻和评论都无需事实证据","评论必须冒充客观事实","报道完全不能包含必要背景"],"answers":["报道侧重提供经过核实的事实，评论在事实基础上提出判断"],"explanation":"报道与评论功能有所区别，评论可以表达立场，但应以可靠事实与可检验的论证为基础，避免把意见伪装成事实。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0046","subject":"新闻实务","chapter":"采访准备","type":"单选题","prompt":"采访公共工程延期时，最有助于准备有效追问的资料组合是什么？","options":["原合同工期、历次公告与施工进度记录","只看同类工程的宣传口号","仅查看受访者社交头像","无需事先了解事件"],"answers":["原合同工期、历次公告与施工进度记录"],"explanation":"合同、公告和进度记录有助于建立时间线、识别矛盾并提出可核查问题；还应了解受影响者和主管部门的说法。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0047","subject":"新闻实务","chapter":"采访准备","type":"填空题","prompt":"重大事件采访前，整理事件发生、政策发布和相关行动的先后顺序，可以建立事实________。","answers":["时间线","时间轴"],"explanation":"时间线有助于发现前后矛盾和信息空缺；每个节点仍需标明来源并核实，不能只凭单方回忆。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0048","subject":"新闻实务","chapter":"消息写作","type":"单选题","prompt":"以下哪项最适合作为消息的新闻背景？","options":["解释本次政策出台前相关制度及其变化","用无关轶事替代报道主体","未经核实地推断决策者动机","重复标题而不提供新增信息"],"answers":["解释本次政策出台前相关制度及其变化"],"explanation":"背景帮助读者理解新闻的原因、历史或意义，但应与主题相关、事实准确，并避免让背景淹没当下事件。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0049","subject":"新闻实务","chapter":"消息写作","type":"填空题","prompt":"新闻标题应准确概括报道内容，避免用缺乏事实依据的夸张词制造________。","answers":["误导","误解"],"explanation":"标题需要吸引读者，也必须与正文证据一致；断章取义、无依据的确定性判断和夸大数字都可能误导。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0050","subject":"新闻实务","chapter":"新闻编辑","type":"单选题","prompt":"编辑发现两份资料对同一事故伤亡人数不同，截稿前最合理的处理是什么？","options":["追查发布时点和统计口径，向权威及现场信源核实","选择数字较大的版本增加冲击力","把两份数字相加","随意选择一个数字但不说明来源"],"answers":["追查发布时点和统计口径，向权威及现场信源核实"],"explanation":"不同数字可能因统计范围和发布时间不同而并存。无法确认时，应说明来源、时点和不确定性，不应自行拼合。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0051","subject":"新闻实务","chapter":"调查报道","type":"单选题","prompt":"调查报道中的‘多方交叉核实’最接近哪一做法？","options":["将文件、数据与不同利益相关者陈述相互比对","将同一篇网帖的多次转载视为独立信源","只采访与记者观点一致的人","用匿名截图代替全部原始材料"],"answers":["将文件、数据与不同利益相关者陈述相互比对"],"explanation":"多个渠道并不必然构成独立来源。应追溯共同源头，比较文件、当事人和可观察证据，并处理不一致之处。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0052","subject":"新闻实务","chapter":"数据新闻","type":"单选题","prompt":"报道某地事故数量上升时，哪项补充最有助于判断风险是否增加？","options":["比较相同统计口径下的发生率和人口规模变化","只使用未经核对的年度总数","删除所有历史数据","只比较两个不同定义的数据"],"answers":["比较相同统计口径下的发生率和人口规模变化"],"explanation":"数量变化可能受到人口规模、统计口径和报告机制影响。应在可比条件下同时呈现总量与适当的比率。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0053","subject":"新闻实务","chapter":"数据新闻","type":"填空题","prompt":"展示某一指标的年度变化趋势，通常可使用横轴为时间的________图。","answers":["折线","折线图"],"explanation":"折线图适合呈现连续时间序列趋势；应注明单位、起止时间及数据来源，避免不合理坐标轴造成误解。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0054","subject":"网络与新媒体","chapter":"平台传播","type":"单选题","prompt":"判断‘信息茧房’时，哪种结论更谨慎？","options":["应结合推荐机制、个人选择和实际接触数据研究","所有人都只接触同温层","只要使用互联网就一定不能接触异见","算法与用户选择绝无关系"],"answers":["应结合推荐机制、个人选择和实际接触数据研究"],"explanation":"信息封闭的程度因平台设计、用户行为和社会网络而异，不能不经验证便把算法推荐等同于完全隔绝异见。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0055","subject":"网络与新媒体","chapter":"平台传播","type":"填空题","prompt":"深度伪造技术可以生成逼真的合成图像、声音或视频，因此核查时应确认素材的原始________。","answers":["来源","出处"],"explanation":"逼真程度不能证明真实性；应追溯原始发布者、上下文及可验证元数据，并结合其他证据核查。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0056","subject":"网络与新媒体","chapter":"隐私与数据","type":"单选题","prompt":"阅读新闻不需要精确定位，但App默认要求持续获取精确位置。主要涉及哪项数据保护原则？","options":["数据收集应与目的相关并保持最小必要","信息收集越多越合规","只要界面漂亮就无需告知","所有新闻内容都必须实名发布"],"answers":["数据收集应与目的相关并保持最小必要"],"explanation":"数据最小化要求收集的数据与明确目的相适应。普通阅读通常不需要持续精确位置，应提供必要说明和选择。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0057","subject":"广告公关","chapter":"品牌传播","type":"单选题","prompt":"一家咖啡品牌在广告、门店服务和社交媒体上使用一致的核心承诺，同时根据渠道调整表达。最接近哪一概念？","options":["整合营销传播","媒介审判","培养理论","倒金字塔结构"],"answers":["整合营销传播"],"explanation":"整合营销传播协调各接触点的品牌信息和体验；一致性不意味着不同渠道必须机械复制同一条内容。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0058","subject":"广告公关","chapter":"广告伦理","type":"填空题","prompt":"信息流中的商业推广应有清晰的________标识，帮助受众区分广告与普通内容。","answers":["广告","商业广告"],"explanation":"原生或信息流广告的形式可能接近普通内容，清晰标识有助于受众识别商业性质；形式融合不意味着可以隐藏广告身份。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0059","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"1874年创办于香港、王韬参与创办并以政论闻名的报纸是《________》。","answers":["循环日报"],"explanation":"《循环日报》1874年在香港创办，王韬发表大量政论文章，是研究中国近代报刊政论的重要对象。","source":{"label":"武汉大学媒体发展研究中心：王韬与《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"o0060","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"研究王韬的办报思想与近代政论写作，最直接相关的报纸是哪一份？","options":["《循环日报》","《青年杂志》","《纽约太阳报》","《每周评论》"],"answers":["《循环日报》"],"explanation":"王韬与1874年创办的《循环日报》联系密切，其政论对中国近代报刊言论的发展具有重要意义。","source":{"label":"武汉大学媒体发展研究中心：王韬与《循环日报》","url":"https://media.whu.edu.cn/b/20241125fx1b"}},{"id":"o0061","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"有关《青年杂志》和《新青年》的关系，下列哪项正确？","options":["《青年杂志》创刊后更名为《新青年》","《新青年》创刊后更名为《青年杂志》","二者均是19世纪英国日报","二者从未存在名称沿革"],"answers":["《青年杂志》创刊后更名为《新青年》"],"explanation":"陈独秀1915年主编的《青年杂志》于1916年第二卷第一号改名《新青年》，是新文化运动的重要刊物。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"o0062","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"《新青年》与哪一历史运动关系最密切？","options":["新文化运动","洋务运动早期","英国光荣革命","美国独立战争"],"answers":["新文化运动"],"explanation":"《青年杂志》与后来的《新青年》以民主、科学等主张推动新文化运动；分析时应注意刊物思想随历史阶段而变化。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"o0063","subject":"新闻史","chapter":"中国近代报刊","type":"填空题","prompt":"《青年杂志》后更名《新青年》，它在新文化运动初期倡导民主与________。","answers":["科学"],"explanation":"《新青年》在新文化运动兴起过程中提出民主和科学，后来的思想传播又经历变化，不能把其不同时期简单等同。","source":{"label":"广州纪检监察网：《青年杂志》与《新青年》","url":"https://www.gzjjjc.gov.cn/ljgzw/ztzl/bwcxmmh/zxgzhs/content/post_28277.html"}},{"id":"o0064","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"研究《申报》的新闻史意义时，哪种方法最有依据？","options":["结合原始报刊、经营资料和历史背景分析","仅凭一个当代网帖概括全部历史","将所有近代报纸视为同一家机构","假定报纸百年间从未发生变化"],"answers":["结合原始报刊、经营资料和历史背景分析"],"explanation":"近代报刊的所有权、编辑与经营会随时期变化，应结合原件、历史资料和多种研究交叉判断。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"o0065","subject":"新闻史","chapter":"中国近代报刊","type":"单选题","prompt":"《时务报》的维新政论与近代社会变革有什么关系？","options":["它为维新思想传播和公共讨论提供了重要平台","它是古代官府邸报的另一名称","它直接创办了美国便士报","它完全不涉及政治议题"],"answers":["它为维新思想传播和公共讨论提供了重要平台"],"explanation":"《时务报》1896年在上海创刊，其政论与维新思想的传播有密切关系，应结合时代环境理解其作用。","source":{"label":"中国人民大学清史研究所：《时务报》与近代思想传播","url":"https://iqh.ruc.edu.cn/old/jssxwhsyj/xsqyyllyj/sx_llff/fa663f641e0a43b0856df5720cbbe0fe.htm"}},{"id":"o0066","subject":"新闻史","chapter":"新闻教育","type":"单选题","prompt":"研究中国早期新闻教育与新闻学知识形成，应当关注哪组材料？","options":["早期新闻学著作、课程设置和新闻教育机构","只看今天的短视频热榜","只研究广告点击率","排除报刊与教育史资料"],"answers":["早期新闻学著作、课程设置和新闻教育机构"],"explanation":"新闻教育史需要结合学科制度、教材、课程与办学实践，不能只用当代平台指标替代历史证据。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"o0067","subject":"新闻史","chapter":"外国新闻史","type":"单选题","prompt":"19世纪便士报扩大读者群的主要手段之一是？","options":["降低售价并扩大面向大众的新闻内容","仅面向少数政治精英出售","取消社会新闻和广告","停止印刷发行"],"answers":["降低售价并扩大面向大众的新闻内容"],"explanation":"便士报以低价发行和广告经营为特点，新闻内容更关注大众生活。它是商业化大众报业发展的重要阶段。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"o0068","subject":"新闻史","chapter":"外国新闻史","type":"填空题","prompt":"19世纪美国一些低价大众报因售价低廉，被称为‘________报’。","answers":["便士"],"explanation":"便士报依靠低价扩大受众，同时发展广告经营；不能简单认为低价就意味着新闻完全不受商业利益影响。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"o0069","subject":"新闻史","chapter":"外国新闻史","type":"单选题","prompt":"评价黄色新闻时，哪种表述最恰当？","options":["以耸动呈现、竞争发行等特点著称，可能损害事实准确性","所有通俗新闻都必然虚假","它是一种严格的新闻核验标准","它只存在于广播时代"],"answers":["以耸动呈现、竞争发行等特点著称，可能损害事实准确性"],"explanation":"黄色新闻通常与19世纪末美国报业竞争、耸动标题和煽情报道相联系；通俗化与失实并不必然等同。","source":{"label":"首都经济贸易大学新闻传播史论考试大纲","url":"https://yjs.cueb.edu.cn/docs/2018-07/20180723101935593500.pdf"}},{"id":"o0070","subject":"新闻史","chapter":"外国新闻史","type":"单选题","prompt":"通讯社对新闻业的重要作用之一是什么？","options":["通过采集和分发新闻为多家媒体提供信息","只能为一家读者私人写信","完全取消国际新闻流动","只经营线下图书馆"],"answers":["通过采集和分发新闻为多家媒体提供信息"],"explanation":"通讯社通常集中采集、整理和分发新闻内容，服务多个机构；分析国际新闻流动时也需考察其资源分布与权力关系。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0071","subject":"新闻史","chapter":"外国新闻史","type":"填空题","prompt":"公共广播强调面向全体公众的服务，其正当性不能仅以商业________最大化来衡量。","answers":["利润","收益"],"explanation":"公共广播通常强调普遍服务、公共利益与多样化内容；其独立性和治理方式仍需结合具体国家制度分析。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0072","subject":"新闻史","chapter":"国际传播","type":"单选题","prompt":"‘世界新闻新秩序’讨论的重要背景之一是什么？","options":["国际新闻资源和信息流动存在不平衡","所有国家拥有相同的媒体资源","世界上不存在跨国信息传播","信息流动仅涉及报纸装订"],"answers":["国际新闻资源和信息流动存在不平衡"],"explanation":"世界新闻与传播秩序讨论涉及消息来源、技术资源、基础设施与国家间表达能力的不平衡。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0073","subject":"网络与新媒体","chapter":"数字社会","type":"单选题","prompt":"‘数字鸿沟’研究中，哪项属于使用能力差异？","options":["两人都能上网，但只有一人能辨别诈骗链接","两人均没有互联网接入","报纸采用不同字号","广播节目的时长不同"],"answers":["两人都能上网，但只有一人能辨别诈骗链接"],"explanation":"能力鸿沟关注使用技能、判断能力等差异；设备和网络是否可获得更多体现接入层面的差距。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0074","subject":"网络与新媒体","chapter":"数字社会","type":"填空题","prompt":"媒介素养不仅包括使用媒介工具，还包括对信息的辨识、评估和________能力。","answers":["批判性理解","批判性思考","批判","判断"],"explanation":"媒介素养包含接入、理解、评估、创作和参与等能力；具体框架不同，但不能把它仅理解为会操作设备。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0075","subject":"网络与新媒体","chapter":"网络舆情","type":"单选题","prompt":"突发事件信息尚不完整时，机构发布消息最合适的方式是？","options":["说明已核实事实、未知事项、采取的行动和下次更新时间","把未经核实的猜测当作最终结论","长期完全不回应","隐藏公众需要的安全信息"],"answers":["说明已核实事实、未知事项、采取的行动和下次更新时间"],"explanation":"在信息不完整时，应透明区分已知与未知，优先提供可执行的安全信息，并持续更新，避免不确定性被谣言填充。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0076","subject":"网络与新媒体","chapter":"网络舆情","type":"单选题","prompt":"网上出现针对当事人的住址泄露和持续威胁时，平台首先应采取哪种组合措施？","options":["保护隐私信息、控制扩散并提供举报和证据保存渠道","只统计事件带来的浏览量","默认公布更多个人资料","删除一切公共政策讨论"],"answers":["保护隐私信息、控制扩散并提供举报和证据保存渠道"],"explanation":"网络暴力治理需要降低人身和隐私风险，保留救济渠道，并区分违法攻击与正常公共讨论。","source":{"label":"国家网信办：网络暴力信息治理规定","url":"https://www.cac.gov.cn/2024-06/14/c_1720043894161555.htm"}},{"id":"o0077","subject":"网络与新媒体","chapter":"网络舆情","type":"填空题","prompt":"网络暴力治理中，未经许可公开他人住址、电话等敏感个人信息的行为常被称为‘________搜索’。","answers":["人肉"],"explanation":"人肉搜索可能造成个人信息泄露和线下安全风险，平台应及时处置敏感信息并保护受影响者。","source":{"label":"国家网信办：网络暴力信息治理规定","url":"https://www.cac.gov.cn/2024-06/14/c_1720043894161555.htm"}},{"id":"o0078","subject":"网络与新媒体","chapter":"数字身份","type":"单选题","prompt":"平台将用户多次浏览记录拼接，用来推断其兴趣并定向展示内容。这体现了什么？","options":["行为数据可参与画像与推荐","所有数字身份都由本人直接填写","浏览记录不会产生任何推断","用户画像永远准确无误"],"answers":["行为数据可参与画像与推荐"],"explanation":"画像可依据行为数据推断兴趣，但推断可能不准确，也会引发知情、选择和隐私风险。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0079","subject":"网络与新媒体","chapter":"数字身份","type":"单选题","prompt":"某用户发现平台错误推断其兴趣，最有助于提升自主性的设计是？","options":["允许查看、修改或关闭个性化推荐","隐藏所有推荐设置","要求用户公开全部浏览记录","让推荐结果永久不可更正"],"answers":["允许查看、修改或关闭个性化推荐"],"explanation":"可理解、可调整或可关闭的设置有助于用户控制推荐体验，实际效果还需看入口是否清晰可用。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0080","subject":"网络与新媒体","chapter":"用户生成内容","type":"单选题","prompt":"用户生成内容（UGC）的核心特征是什么？","options":["普通用户参与内容创作与发布","内容只能由官方新闻机构生产","所有内容都必然经过专业事实核查","用户只能接收不能参与"],"answers":["普通用户参与内容创作与发布"],"explanation":"UGC突出用户参与生产和传播，但用户身份、内容质量与平台审核情况存在差异，不能假定其天然真实。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0081","subject":"网络与新媒体","chapter":"用户生成内容","type":"填空题","prompt":"UGC通常指由________生成的内容，例如用户发布的文字、照片和视频。","answers":["用户","使用者"],"explanation":"UGC强调用户参与内容生产；平台的规则、推荐机制和商业激励同样影响这些内容的传播。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0082","subject":"网络与新媒体","chapter":"直播传播","type":"单选题","prompt":"新闻直播中出现未经核实的现场说法，主播最适合怎样处理？","options":["明确标注为未核实说法，及时联系多方核实","立刻作为已确认事实反复播报","删除所有现场画面后停止任何解释","让观众自行猜测信息来源"],"answers":["明确标注为未核实说法，及时联系多方核实"],"explanation":"直播具有实时性，但及时不等于省略核实；应区分观察、转述和确认，发现错误及时更正。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0083","subject":"网络与新媒体","chapter":"短视频传播","type":"单选题","prompt":"把一段较长采访剪成短视频时，哪项做法最可能造成误导？","options":["删除影响结论的前提条件后拼接回答","保留必要上下文和受访者原意","核实采访日期和身份","在字幕中标注节选"],"answers":["删除影响结论的前提条件后拼接回答"],"explanation":"剪辑可以压缩时长，但不能改变受访者原意或事实关系。必要的前提和背景应通过画面、字幕或说明保留。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0084","subject":"网络与新媒体","chapter":"人机传播","type":"单选题","prompt":"用户把自动聊天工具的回答误认为人工客服。改善透明度的最直接方式是什么？","options":["明确告知用户正在与自动化系统交互","让系统假冒具体工作人员","禁止用户转接人工","隐藏系统能力限制"],"answers":["明确告知用户正在与自动化系统交互"],"explanation":"清楚披露交互对象和能力边界，可减少身份误认；高风险情形还应提供人工介入和错误反馈渠道。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0085","subject":"网络与新媒体","chapter":"人机传播","type":"填空题","prompt":"生成式人工智能可能编造看似合理但无事实依据的内容，这一现象常称为模型________。","answers":["幻觉"],"explanation":"模型幻觉指生成内容与事实或可靠来源不符的情形；应用于新闻时应核验事实、来源和引述，不能仅凭流畅表达采信。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0086","subject":"网络与新媒体","chapter":"平台传播","type":"单选题","prompt":"平台为延长停留时间持续推送极端情绪内容。分析该问题时，最需要审视什么？","options":["推荐目标、反馈指标与内容放大的关系","用户手机颜色","平台网页字体大小","只有内容标题的标点"],"answers":["推荐目标、反馈指标与内容放大的关系"],"explanation":"目标函数和反馈指标可能激励系统放大高互动内容；还需分析样本、用户行为及平台治理，不能仅凭个别例子断定全部结果。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0087","subject":"网络与新媒体","chapter":"平台传播","type":"填空题","prompt":"平台处理争议内容后，向用户解释处置理由并允许复核，这体现了规则透明与________机制。","answers":["申诉","复议"],"explanation":"透明规则和申诉机制有助于纠正误判；应说明具体理由、复核途径与处理结果，而不仅提供自动回复。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"o0088","subject":"网络与新媒体","chapter":"数字社会","type":"单选题","prompt":"医院推行线上挂号时，哪种安排更有利于老年人数字融入？","options":["保留人工或电话渠道，同时改善线上无障碍设计","立即取消一切线下帮助","要求家属公开老人账号密码","仅用英文说明操作流程"],"answers":["保留人工或电话渠道，同时改善线上无障碍设计"],"explanation":"数字融入既包括数字产品的可用性和培训，也包括保留替代渠道，使不同能力的人都能获得服务。","source":{"label":"中山大学2027年新闻传播学初试参考范围","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk001","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：人类为适应社会生活、满足生存与交往需要，对新近事实进行获知、传递和共享的社会实践？","options":["新闻活动","数据新闻","新闻框架","虚假新闻"],"answers":["新闻活动"],"explanation":"新闻活动是人类为适应社会生活、满足生存与交往需要，对新近事实进行获知、传递和共享的社会实践。它早于专业新闻业出现，主体不限于记者，渠道包括亲身传播、群体传播和大众传播。其基本规律是：社会对信息的需要决定活动规模，生产力与传播技术决定活动方式。 不要把新闻活动限定为职业记者采写，也不要把新闻事业产生的时间当作新闻活动的起点。","knowledgeId":"k001","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk002","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻产生和存在的客观基础，即客观世界中发生、存续或变化的事实、活动与现象？","options":["新闻本源","新闻游戏","媒介化","事实核查"],"answers":["新闻本源"],"explanation":"新闻本源是新闻产生和存在的客观基础，即客观世界中发生、存续或变化的事实、活动与现象。事实是第一性的，新闻报道是对事实的选择、核实与符号化呈现；记者的认识和表达只能以事实为依据，不能反过来制造事实。 不要把新闻本源写成新闻来源。前者回答新闻从哪里产生，后者回答报道材料由谁提供或从何处获得。","knowledgeId":"k002","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk004","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻报道与其所反映客观事实相符合的程度和规范要求？","options":["新闻真实性","自动化新闻","新闻与信息","新闻线索"],"answers":["新闻真实性"],"explanation":"新闻真实性是新闻报道与其所反映客观事实相符合的程度和规范要求。它既要求单个事实在时间、地点、人物、数据和引语上准确，也要求通过连续、完整和有联系的报道接近整体真实。新闻真实具有事实性、过程性、有限性、即时性和公开性。 不要把‘客观记录某一片段’直接等同于整体真实，也不要用‘真相永远不可知’为错误报道开脱。","knowledgeId":"k004","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk006","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻工作者依据新闻价值、宣传价值、法律伦理、媒体定位和传播条件，从大量事实中决定报道什么、如何报道及突出什么的过程？","options":["新闻选择","人民性原则","新闻伦理","融合新闻"],"answers":["新闻选择"],"explanation":"新闻选择是新闻工作者依据新闻价值、宣传价值、法律伦理、媒体定位和传播条件，从大量事实中决定报道什么、如何报道及突出什么的过程。它贯穿线索发现、采访、写作、编辑、版面和算法分发，不是一次性的取舍。 不要把新闻选择等同于删稿；采访对象、数据指标、标题措辞和推荐权重同样属于选择。","knowledgeId":"k006","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk008","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：社会各主体通过法律、政策、组织管理、经济资源、技术平台和职业规范等方式，对新闻生产与传播施加影响和约束的过程？","options":["新闻控制","新闻框架","虚假新闻","新闻活动"],"answers":["新闻控制"],"explanation":"新闻控制是社会各主体通过法律、政策、组织管理、经济资源、技术平台和职业规范等方式，对新闻生产与传播施加影响和约束的过程。控制主体包括国家、政党、资本、媒体组织、广告主、平台及社会公众，既可能维护秩序与权利，也可能造成信息压制或结构性偏向。 不要忽视资本、组织惯例和算法的隐性控制；也不要把所有规范都视为对自由的消极限制。","knowledgeId":"k008","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk009","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：通过新闻媒体表达、汇聚并影响社会意见的舆论形态？","options":["新闻舆论","媒介化","事实核查","新闻本源"],"answers":["新闻舆论"],"explanation":"新闻舆论是通过新闻媒体表达、汇聚并影响社会意见的舆论形态。它以事实报道为基础，通过议题选择、评论解释和持续传播形成公共判断，具有公开性、现实性、导向性和社会影响力；新闻本身不等于舆论，但能提供舆论形成所需的事实和讨论框架。 不要把一条报道直接称为社会舆论，也不要把网络声量最大的意见当成全体公众意见。","knowledgeId":"k009","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk010","subject":"新闻理论","chapter":"新闻理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻从业者以公共服务为职业使命，依据真实性、独立性、公正性、核实原则和责任伦理开展新闻生产，并通过专业自治维护社会信任的规范体系？","options":["新闻专业主义","客观性原则","解决方案新闻","算法把关"],"answers":["新闻专业主义"],"explanation":"新闻专业主义是新闻从业者以公共服务为职业使命，依据真实性、独立性、公正性、核实原则和责任伦理开展新闻生产，并通过专业自治维护社会信任的规范体系。它既是一组职业价值，也落实为信源核验、利益冲突披露、更正和问责等制度。 专业主义不等于记者没有立场，而是要求结论受证据约束，并对公共利益和传播后果负责。","knowledgeId":"k010","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk012","subject":"新闻理论","chapter":"新闻理论 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：在反思自由主义报刊理论弊端的基础上形成的媒介规范理论，主张媒体享有新闻自由的同时必须承担真实、全面、促进公共讨论、代表多元群体和维护社会基本价值的责任；当媒体失责时，行业自律、公众监督和必要的法律制度可以介入？","options":["社会责任论","新闻与舆论","新闻敏感","新闻价值"],"answers":["社会责任论"],"explanation":"社会责任论是在反思自由主义报刊理论弊端的基础上形成的媒介规范理论，主张媒体享有新闻自由的同时必须承担真实、全面、促进公共讨论、代表多元群体和维护社会基本价值的责任；当媒体失责时，行业自律、公众监督和必要的法律制度可以介入。 不要把社会责任论写成政府全面控制媒体；它首先强调媒体自身的公共义务与专业自治。","knowledgeId":"k012","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk016","subject":"新闻理论","chapter":"新闻理论 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：20世纪末美国新闻业反思选举报道娱乐化和公众疏离后形成的实践理念，主张媒体不只告知事实，还应发现社区公共议题、组织平等讨论、提供行动信息，帮助公民参与公共生活？","options":["公共新闻","建设性新闻","隐性采访","新闻游戏"],"answers":["公共新闻"],"explanation":"公共新闻是20世纪末美国新闻业反思选举报道娱乐化和公众疏离后形成的实践理念，主张媒体不只告知事实，还应发现社区公共议题、组织平等讨论、提供行动信息，帮助公民参与公共生活。记者仍须保持核实和独立，不能替特定方案动员。 不要把公共新闻等同于公益宣传或媒体替政府办事；其关键是培育公民参与和公共讨论。","knowledgeId":"k016","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk018","subject":"新闻理论","chapter":"新闻理论 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕社会问题的应对措施进行严格报道的方法，重点回答某方案如何运作、有什么证据、存在哪些局限以及能否迁移？","options":["解决方案新闻","反转新闻","平台治理","自动化新闻"],"answers":["解决方案新闻"],"explanation":"解决方案新闻是围绕社会问题的应对措施进行严格报道的方法，重点回答某方案如何运作、有什么证据、存在哪些局限以及能否迁移。其四个要素通常是回应、洞见、证据和局限；标准与调查报道相同，而非为项目背书。 不要把项目负责人自述当作成效证据，也不要只报道受益个案而忽略基线、样本和持续性。","knowledgeId":"k018","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk019","subject":"新闻理论","chapter":"新闻理论 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：事件在连续传播中因早期信息不完整、信源失实或框架偏差，后续事实导致主流叙事发生显著逆转的新闻现象？","options":["反转新闻","后真相","新闻叙事","建设性舆论监督"],"answers":["反转新闻"],"explanation":"反转新闻是事件在连续传播中因早期信息不完整、信源失实或框架偏差，后续事实导致主流叙事发生显著逆转的新闻现象。其成因包括速度竞争、单一信源、情绪先行、平台奖励和证据缺位；‘反转’往往反映核实程序失败，而非事实本身突然改变。 不要把所有后续补充都叫反转；调查进展中的合理修正与抢跑造成的错误定性不同。","knowledgeId":"k019","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk021","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻传播主体在法律最低要求之外，为实现真实、公正、独立和减少伤害而遵循的职业价值与行为规范？","options":["新闻伦理","新闻失实","新闻事业","新闻自由"],"answers":["新闻伦理"],"explanation":"新闻伦理是新闻传播主体在法律最低要求之外，为实现真实、公正、独立和减少伤害而遵循的职业价值与行为规范。它处理公共知情与隐私、报道速度与核实、监督权力与保护弱者等冲突，并要求在具体情境中说明公共利益、必要性和比例。 合法不等于合乎伦理；能够公开获取的信息，也可能不适合无差别放大。","knowledgeId":"k021","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk023","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：案件经司法机关依法作出生效裁判前，媒体或网络舆论以定罪式叙事、道德标签和舆论压力预先判定当事人责任，从而可能影响无罪推定、独立审判和当事人权利的现象？","options":["媒介审判","事实核查","新闻本源","新闻舆论"],"answers":["媒介审判"],"explanation":"媒介审判是案件经司法机关依法作出生效裁判前，媒体或网络舆论以定罪式叙事、道德标签和舆论压力预先判定当事人责任，从而可能影响无罪推定、独立审判和当事人权利的现象。正常舆论监督与媒介审判的分界在于是否以证据为限、尊重程序并避免代替法院裁判。 不要用‘疑似’包装整篇定罪叙事；标题、配图和评论引导同样可能造成预断。","knowledgeId":"k023","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk024","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者不公开身份或采访意图，借助暗访、隐蔽观察或秘密记录获取信息的采访方式？","options":["隐性采访","新闻来源","新闻定义","新闻专业主义"],"answers":["隐性采访"],"explanation":"隐性采访是记者不公开身份或采访意图，借助暗访、隐蔽观察或秘密记录获取信息的采访方式。它能揭露封闭环境中的重大违法失范，但会侵入隐私和削弱知情同意，原则上只能在公共利益重大、常规方法无效且伤害可控时作为最后手段。 不要因为画面有冲击力就正当化偷拍；公共好奇不等于公共利益。","knowledgeId":"k024","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk025","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：平台或媒体利用数据模型对海量信息进行筛选、排序、推荐和过滤，从而影响哪些内容可见以及以何种顺序可见的过程？","options":["算法把关","新闻线索","新闻真实性","客观性原则"],"answers":["算法把关"],"explanation":"算法把关是平台或媒体利用数据模型对海量信息进行筛选、排序、推荐和过滤，从而影响哪些内容可见以及以何种顺序可见的过程。它把传统编辑判断与用户行为、商业指标和自动化规则结合，具有规模化、个性化、不透明和反馈循环等特征。 不要把算法说成中立工具，也不要认为人工编辑已经完全退出；实际把关常是人机协同。","knowledgeId":"k025","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk027","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻工作者将事实材料按特定视角、时间、因果和角色关系组织成可理解文本的过程？","options":["新闻叙事","受众观","新闻选择","党性原则"],"answers":["新闻叙事"],"explanation":"新闻叙事是新闻工作者将事实材料按特定视角、时间、因果和角色关系组织成可理解文本的过程。叙事不能创造事实，却会通过选择谁发声、从何处开始、如何命名和连接因果影响受众理解，因此必须受真实性、完整性和公平性约束。 不要把叙事性当作虚构许可；场景、对话和心理描写都必须有采访或记录依据。","knowledgeId":"k027","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk029","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：利用虚拟现实、增强现实、360度影像、空间音频或交互场景，使受众获得临场感和空间参与感的新闻表达？","options":["沉浸式新闻","新闻活动","新闻控制","马克思主义新闻观"],"answers":["沉浸式新闻"],"explanation":"沉浸式新闻是利用虚拟现实、增强现实、360度影像、空间音频或交互场景，使受众获得临场感和空间参与感的新闻表达。它可以增强理解与共情，但重构场景、替代视角和感官刺激也可能模糊事实与模拟的界线。 不要把‘像在现场’等同于‘掌握全部真相’，强烈临场感反而可能掩盖视角有限。","knowledgeId":"k029","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk030","subject":"新闻理论","chapter":"新闻理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：以结构化数据作为重要采访材料，通过获取、清洗、分析、核验和可视化发现并讲述公共事实的新闻实践？","options":["数据新闻","媒介审判","新闻游戏","媒介化"],"answers":["数据新闻"],"explanation":"数据新闻是以结构化数据作为重要采访材料，通过获取、清洗、分析、核验和可视化发现并讲述公共事实的新闻实践。数据不是装饰性图表，而是证据链的一部分；其可信度取决于口径、来源、缺失值、分析方法和叙事边界。 不要把相关关系写成因果；绝对数、比例、人均值和累计值混用会制造错误结论。","knowledgeId":"k030","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk031","subject":"新闻理论","chapter":"新闻理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：把真实公共议题、新闻资料和游戏规则结合，让用户通过选择、资源配置或角色体验理解事件机制的互动新闻形式？","options":["新闻游戏","隐性采访","人工智能新闻","新闻与宣传"],"answers":["新闻游戏"],"explanation":"新闻游戏是把真实公共议题、新闻资料和游戏规则结合，让用户通过选择、资源配置或角色体验理解事件机制的互动新闻形式。其说服力来自规则模拟而非文字论证，因此模型假设、可选行动和结果反馈都必须有事实依据并保持透明。 不要用积分和胜负逻辑轻率处理死亡、战争和受害者经历；模拟结果不是现实预测。","knowledgeId":"k031","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk033","subject":"新闻理论","chapter":"新闻理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：将结构化数据输入预设模板或生成模型，自动完成部分或全部新闻文本生产与发布的实践，常用于财报、体育比分、天气和地震速报？","options":["自动化新闻","平台治理","建设性舆论监督","新闻与舆论"],"answers":["自动化新闻"],"explanation":"自动化新闻是将结构化数据输入预设模板或生成模型，自动完成部分或全部新闻文本生产与发布的实践，常用于财报、体育比分、天气和地震速报。其优势是速度、规模和一致性，适用前提是数据可靠、规则稳定、异常可识别且有人类监督。 不要因模板固定就假定不会出错；错误数据会被更快、更大规模地扩散。","knowledgeId":"k033","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk037","subject":"新闻理论","chapter":"新闻理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：媒体通过选择、突出、排除和组织事实，对事件的问题定义、原因解释、道德评价和解决方案作出的结构化呈现？","options":["新闻框架","数据新闻","媒介化","事实核查"],"answers":["新闻框架"],"explanation":"新闻框架是媒体通过选择、突出、排除和组织事实，对事件的问题定义、原因解释、道德评价和解决方案作出的结构化呈现。框架不必虚构事实，却会决定哪些事实显得重要以及受众沿何种路径理解事件。 框架不等于必然操纵；任何报道都需要组织事实，关键是框架是否有证据、是否遮蔽重要替代解释。","knowledgeId":"k037","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk038","subject":"新闻理论","chapter":"新闻理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：社会制度与日常实践长期适应媒介逻辑并被其重组的过程？","options":["媒介化","新闻游戏","新闻与宣传","新闻来源"],"answers":["媒介化"],"explanation":"媒介化是社会制度与日常实践长期适应媒介逻辑并被其重组的过程。政治、教育、商业和私人生活不仅借助媒介传播，还会按可见性、即时性、数据化和平台规则改变组织方式、行动节奏与权力关系。 不要把所有社会变化归因于技术；组织利益、政策和文化会共同塑造媒介化结果。","knowledgeId":"k038","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk043","subject":"新闻理论","chapter":"新闻理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：报道内容、语境或整体呈现与客观事实不相符合的现象，包括事实错误、夸大缩小、移花接木、因果误判、选择性遗漏和整体性误导？","options":["新闻失实","新闻控制","马克思主义新闻观","新闻法规"],"answers":["新闻失实"],"explanation":"新闻失实是报道内容、语境或整体呈现与客观事实不相符合的现象，包括事实错误、夸大缩小、移花接木、因果误判、选择性遗漏和整体性误导。它既可能来自故意造假，也可能由核实不足、认知局限、流程缺陷和商业压力造成。 删稿不能替代更正；如果错误已跨平台传播，更正也必须覆盖原有渠道。","knowledgeId":"k043","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk045","subject":"新闻理论","chapter":"新闻理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：对公开主张、传播内容或新闻材料进行证据化验证，并透明呈现结论与依据的专业过程？","options":["事实核查","新闻专业主义","建设性新闻","隐性采访"],"answers":["事实核查"],"explanation":"事实核查是对公开主张、传播内容或新闻材料进行证据化验证，并透明呈现结论与依据的专业过程。其步骤包括界定可核查命题、追溯原始来源、交叉验证证据、联系主张者、评估证据等级、说明结论限制和公开更正。 不要用另一个二手报道证明原报道；多个转载账号可能追溯到同一错误源头。","knowledgeId":"k045","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk047","subject":"新闻理论","chapter":"新闻理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：提示可能存在新闻事实的初步信息，来源包括观察、报料、文件、数据异常、社交平台和日常交往？","options":["新闻线索","社会责任论","反转新闻","平台治理"],"answers":["新闻线索"],"explanation":"新闻线索是提示可能存在新闻事实的初步信息，来源包括观察、报料、文件、数据异常、社交平台和日常交往。线索只提供采访起点，通常不完整、未经证实，必须经过核实、扩展和价值判断才能转化为新闻。 不要直接转发报料截图；线索提供者可能误解、夸大或有利益动机。","knowledgeId":"k047","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk048","subject":"新闻理论","chapter":"新闻理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者从日常变化、矛盾和异常中迅速判断其新闻价值与公共联系，并形成可核实采访假设的能力？","options":["新闻敏感","新闻失实","新闻活动","新闻舆论"],"answers":["新闻敏感"],"explanation":"新闻敏感是记者从日常变化、矛盾和异常中迅速判断其新闻价值与公共联系，并形成可核实采访假设的能力。它由知识积累、社会观察和职业训练构成，不是猎奇直觉。 异常个案只产生线索，不能自动证明系统趋势。","knowledgeId":"k048","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk050","subject":"新闻理论","chapter":"新闻理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：以采集、制作和传播新闻信息为主要活动，由新闻机构、从业者、制度规范、技术设施和受众关系构成的社会系统？","options":["新闻事业","全球新闻流动","新闻失实","新闻活动"],"answers":["新闻事业"],"explanation":"新闻事业是以采集、制作和传播新闻信息为主要活动，由新闻机构、从业者、制度规范、技术设施和受众关系构成的社会系统。它具有政治、经济、文化和公共服务属性，运行既受社会制度和技术条件制约，也反作用于社会认知与治理。 不要只罗列正面功能；新闻事业也可能产生议程偏差、商业化和信息不平等等负效应。","knowledgeId":"k050","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk051","subject":"传播理论","chapter":"传播理论 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：信息在一定社会关系中由传播者经过符号编码、媒介传递、受众解码并产生反馈的动态活动？","options":["传播过程","过滤气泡","场景传播","香农—韦弗模式"],"answers":["传播过程"],"explanation":"传播过程是信息在一定社会关系中由传播者经过符号编码、媒介传递、受众解码并产生反馈的动态活动。它不是信息从A点搬到B点的直线运动，而是受语境、噪音、权力关系和双方经验影响的意义协商。 传播成功不能只以送达判断；受众是否理解、如何解释和能否反馈同样重要。","knowledgeId":"k051","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk067","subject":"传播理论","chapter":"传播理论 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：在特定议题和群体中因知识、活跃度、社会联系或可信度而对他人态度与行为产生较强影响的人？","options":["意见领袖","媒介系统依赖","交往行动","算法推荐"],"answers":["意见领袖"],"explanation":"意见领袖是在特定议题和群体中因知识、活跃度、社会联系或可信度而对他人态度与行为产生较强影响的人。其影响依赖具体领域和关系情境，可通过信息筛选、解释、示范与社会认同发挥作用，不等同于官方权威或高粉账号。 粉丝量只能表示可见性，不能证明信任和行为影响。","knowledgeId":"k067","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk074","subject":"传播理论","chapter":"传播理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：伊尼斯提出的概念，指不同传播媒介因物质特性而更有利于跨时间保存或跨空间扩张？","options":["媒介偏向","奥斯古德模式","创新扩散","选择性接触"],"answers":["媒介偏向"],"explanation":"媒介偏向是伊尼斯提出的概念，指不同传播媒介因物质特性而更有利于跨时间保存或跨空间扩张。耐久、沉重的媒介偏时间，便携、轻质的媒介偏空间；社会若过度依赖一种偏向，知识与权力结构可能失衡。 偏向是倾向而非绝对分类，同一媒介在制度环境中可能呈现混合功能。","knowledgeId":"k074","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk077","subject":"传播理论","chapter":"传播理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：法兰克福学派对资本主义大众文化生产的批判概念，指文化产品像工业商品一样被标准化、批量复制，并以伪个性化制造选择感，使娱乐服从利润和社会整合，削弱批判思考？","options":["文化工业","框架理论","第三人效果","符号互动"],"answers":["文化工业"],"explanation":"文化工业是法兰克福学派对资本主义大众文化生产的批判概念，指文化产品像工业商品一样被标准化、批量复制，并以伪个性化制造选择感，使娱乐服从利润和社会整合，削弱批判思考。 理论具有强批判色彩，但受众并非毫无能动性，具体研究要观察协商和抵抗。","knowledgeId":"k077","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk079","subject":"传播理论","chapter":"传播理论 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：詹金斯借用德塞托提出的受众研究概念，指粉丝从大众文化文本中主动选择、挪用和重写素材，以同人、剪辑、讨论等方式生产符合自身身份和欲望的新意义？","options":["文本盗猎","沉默的螺旋","两级传播","媒介即讯息"],"answers":["文本盗猎"],"explanation":"文本盗猎是詹金斯借用德塞托提出的受众研究概念，指粉丝从大众文化文本中主动选择、挪用和重写素材，以同人、剪辑、讨论等方式生产符合自身身份和欲望的新意义。它强调参与能动性，也受到版权、平台和商业收编限制。 粉丝创造并非天然抵抗，亦可能复制原文本偏见或被平台商业化。","knowledgeId":"k079","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk082","subject":"传播理论","chapter":"传播理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：哈贝马斯描述的、介于国家与私人生活之间，公民围绕公共事务进行开放讨论并形成公共意见的交往空间？","options":["公共领域","景观社会","可供性","数字劳动"],"answers":["公共领域"],"explanation":"公共领域是哈贝马斯描述的、介于国家与私人生活之间，公民围绕公共事务进行开放讨论并形成公共意见的交往空间。其规范理想包括平等进入、理由交换、免受强制和面向公共利益；现实中会受资本、身份不平等和平台规则扭曲。 网络评论区不因公开可见就自动成为公共领域，辱骂、操纵与不平等会破坏讨论。","knowledgeId":"k082","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk084","subject":"传播理论","chapter":"传播理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：德波对现代资本主义的批判，指社会关系越来越通过被生产和消费的形象来中介，人们从直接生活退居为观看者；景观不是图片集合，而是由形象组织的社会关系，商品逻辑和可见性取代真实参与？","options":["景观社会","网络社会","情感公众","注意力经济"],"answers":["景观社会"],"explanation":"景观社会是德波对现代资本主义的批判，指社会关系越来越通过被生产和消费的形象来中介，人们从直接生活退居为观看者；景观不是图片集合，而是由形象组织的社会关系，商品逻辑和可见性取代真实参与。 景观批判不是反对图像本身，而是批判形象对现实关系的统治。","knowledgeId":"k084","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk086","subject":"传播理论","chapter":"传播理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：卡斯特提出的社会形态，指信息技术使经济、权力和文化活动以可重组网络为基本结构，关键资源沿‘流动空间’在节点间运行？","options":["网络社会","过滤气泡","场景传播","拉斯韦尔模式"],"answers":["网络社会"],"explanation":"网络社会是卡斯特提出的社会形态，指信息技术使经济、权力和文化活动以可重组网络为基本结构，关键资源沿‘流动空间’在节点间运行。节点地位取决于连接价值，接入和断连成为新的权力与不平等来源。 连接越多不必然权力越大，能制定规则和连接关键网络的节点更重要。","knowledgeId":"k086","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk088","subject":"传播理论","chapter":"传播理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：帕里泽提出的概念，指平台依据用户数据进行不可见的个性化筛选，使每个人接触到不同信息世界，却未必知道哪些内容被排除，也难以主动调整？","options":["过滤气泡","算法推荐","计算宣传","奥斯古德模式"],"answers":["过滤气泡"],"explanation":"过滤气泡是帕里泽提出的概念，指平台依据用户数据进行不可见的个性化筛选，使每个人接触到不同信息世界，却未必知道哪些内容被排除，也难以主动调整。其关键是算法代理、筛选不透明和选择权不足。 个性化不一定有害；问题在于重要信息排除、不可解释和缺乏用户控制。","knowledgeId":"k088","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk090","subject":"传播理论","chapter":"传播理论 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：系统根据内容特征、用户画像、上下文和行为反馈预测相关性，并自动排序分发信息的机制？","options":["算法推荐","媒介依赖","社会学习","文化工业"],"answers":["算法推荐"],"explanation":"算法推荐是系统根据内容特征、用户画像、上下文和行为反馈预测相关性，并自动排序分发信息的机制。目标函数决定‘好内容’的操作定义，训练数据和反馈循环会把既有偏好、商业目标与社会偏见写入可见性分配。 高互动不等于高质量，相关性预测也不是用户真实需要的完整表达。","knowledgeId":"k090","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk096","subject":"传播理论","chapter":"传播理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：运用数字痕迹、大规模数据、计算建模和实验方法研究传播过程与效果的领域，也包括以计算系统参与内容生成和分发？","options":["计算传播","奥斯古德模式","创新扩散","选择性接触"],"answers":["计算传播"],"explanation":"计算传播是运用数字痕迹、大规模数据、计算建模和实验方法研究传播过程与效果的领域，也包括以计算系统参与内容生成和分发。它能观察复杂网络和动态过程，但面临数据代表性、平台黑箱、可复现性和伦理风险。 点赞数不是态度的天然测量，模型准确率也不能替代理论解释。","knowledgeId":"k096","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk097","subject":"传播理论","chapter":"传播理论 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：政治或利益主体利用自动化账号、数据分析、算法投放和协同网络操纵公共舆论的传播活动？","options":["计算宣传","社会学习","文化工业","景观社会"],"answers":["计算宣传"],"explanation":"计算宣传是政治或利益主体利用自动化账号、数据分析、算法投放和协同网络操纵公共舆论的传播活动。它把传统宣传与可规模化、微定向和伪装性技术结合，常表现为机器人放大、虚假草根支持、骚扰与信息污染。 单个账号高频发帖不足以证明机器人，应结合时间、内容和网络协同。","knowledgeId":"k097","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk115","subject":"新闻史","chapter":"新闻史 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：抗日战争胜利前后国民党统治区新闻出版界反对战时新闻检查制度、争取出版自由的斗争？","options":["拒检运动","《向导》","邹韬奋","列宁党报思想"],"answers":["拒检运动"],"explanation":"拒检运动是抗日战争胜利前后国民党统治区新闻出版界反对战时新闻检查制度、争取出版自由的斗争。1945年重庆等地杂志社和文化界人士公开声明不再送检并联合出版，推动国民党政府宣布废止战时新闻检查办法。 制度宣布废止不代表此后新闻自由完全实现，仍需结合政治现实评价。","knowledgeId":"k115","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk118","subject":"新闻史","chapter":"新闻史 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：近代著名报人，1926年参与接办新记《大公报》并长期主持社评？","options":["张季鸾","广播时代","调查性报道史","《新青年》"],"answers":["张季鸾"],"explanation":"张季鸾是近代著名报人，1926年参与接办新记《大公报》并长期主持社评。他以‘四不’方针追求民营报纸的编辑独立，形成论据清楚、态度鲜明的社评风格，强调报纸对国家和公共事务的责任。 不要把‘不党’误写成没有立场；张季鸾社评常有明确国家关怀。","knowledgeId":"k118","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk119","subject":"新闻史","chapter":"新闻史 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：中国早期新闻学教育家和学者，曾留学美国，回国后在北京大学讲授新闻学并参与新闻学研究会？","options":["徐宝璜","延安新闻学","梁启超办报思想","电视时代"],"answers":["徐宝璜"],"explanation":"徐宝璜是中国早期新闻学教育家和学者，曾留学美国，回国后在北京大学讲授新闻学并参与新闻学研究会。其《新闻学》于1919年出版，是中国较早系统论述新闻理论和业务的著作，对新闻学科建制和职业教育具有奠基作用。 不要只称其为‘新闻学界最初的开山祖’，还要说明具体教学和著述贡献。","knowledgeId":"k119","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk130","subject":"新闻史","chapter":"新闻史 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：20世纪70年代发展中国家在不结盟运动和联合国教科文组织框架下提出的改革诉求，批评国际新闻流动由西方通讯社和跨国媒介主导、呈单向和失衡状态，主张传播主权、文化多样、能力建设与更公平的信息交流？","options":["世界新闻新秩序","新闻专业化","《时务报》","《解放日报》改版"],"answers":["世界新闻新秩序"],"explanation":"世界新闻新秩序是20世纪70年代发展中国家在不结盟运动和联合国教科文组织框架下提出的改革诉求，批评国际新闻流动由西方通讯社和跨国媒介主导、呈单向和失衡状态，主张传播主权、文化多样、能力建设与更公平的信息交流。 不能把新秩序只写成反对西方媒体，也要说明技术、人才和制度能力建设。","knowledgeId":"k130","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk132","subject":"新闻史","chapter":"新闻史 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：以公共服务而非利润或政府宣传为首要目标，通过许可费、公共资金或多元机制支持，并以法定独立、普遍服务、多样性和问责为原则的广播电视制度？","options":["公共广播","中国新闻教育","《每周评论》","反客里空运动"],"answers":["公共广播"],"explanation":"公共广播是以公共服务而非利润或政府宣传为首要目标，通过许可费、公共资金或多元机制支持，并以法定独立、普遍服务、多样性和问责为原则的广播电视制度。英国BBC是典型代表，但不同国家治理结构差异明显。 公共资金本身不能保证独立，任命、预算和申诉制度同样关键。","knowledgeId":"k132","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk133","subject":"新闻史","chapter":"新闻史 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：新闻工作从兼职、政党附属和经验操作，逐步形成专门职业、知识技能、伦理规范、教育组织和职业自治的历史过程？","options":["新闻专业化","《察世俗每月统记传》","《湘江评论》","拒检运动"],"answers":["新闻专业化"],"explanation":"新闻专业化是新闻工作从兼职、政党附属和经验操作，逐步形成专门职业、知识技能、伦理规范、教育组织和职业自治的历史过程。它伴随商业报业、记者分工、新闻院校与行业准则发展，也始终受市场和政治权力制约。 专业自治可能形成精英封闭，需与公众问责和多样性结合。","knowledgeId":"k133","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk140","subject":"新闻实务","chapter":"新闻实务 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者根据受访者回答中的模糊、矛盾、重要新线索或情绪变化即时提出后续问题，以获得细节、证据和解释？","options":["追问","新闻背景","调查性报道","融合报道策划"],"answers":["追问"],"explanation":"追问是记者根据受访者回答中的模糊、矛盾、重要新线索或情绪变化即时提出后续问题，以获得细节、证据和解释。有效追问依赖倾听，不是简单重复预设问题。 追问不是情绪对抗；问题应短、单一并给受访者公平回应。","knowledgeId":"k140","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk141","subject":"新闻实务","chapter":"新闻实务 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者运用视觉、听觉等感官并结合空间、时间和行为记录直接获取事实的方法？","options":["现场观察","新闻主体","解释性报道","采访提纲"],"answers":["现场观察"],"explanation":"现场观察是记者运用视觉、听觉等感官并结合空间、时间和行为记录直接获取事实的方法。观察能提供环境和非语言细节，但记者所见受位置和时段限制，必须区分亲见、推断和他人陈述。 记者未亲见的心理和因果不能写成观察事实。","knowledgeId":"k141","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk146","subject":"新闻实务","chapter":"新闻实务 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：对报道核心事实和新闻价值的高度概括，承担提示内容、组织理解和吸引阅读的功能？","options":["新闻标题","深度报道","专访","图片新闻"],"answers":["新闻标题"],"explanation":"新闻标题是对报道核心事实和新闻价值的高度概括，承担提示内容、组织理解和吸引阅读的功能。标题必须与正文证据一致，准确处理主体、数字、因果和不确定性，不能以疑问号或情绪词逃避责任。 ‘震惊！可能致癌？’即使加问号，也可能构成误导性暗示。","knowledgeId":"k146","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk147","subject":"新闻实务","chapter":"新闻实务 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：帮助理解当前事实的历史、制度、数据、因果和人物关系材料？","options":["新闻背景","调查性报道","融合报道策划","短视频新闻"],"answers":["新闻背景"],"explanation":"新闻背景是帮助理解当前事实的历史、制度、数据、因果和人物关系材料。背景必须与新闻点直接相关，用来解释‘为什么重要、为何发生、与过去有何不同’，而不是资料堆积。 旧资料未标时间会被误读为当前事实；背景也不能替代当事方回应。","knowledgeId":"k147","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk149","subject":"新闻实务","chapter":"新闻实务 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：以新闻事实和公共问题为对象，通过明确判断、充分论据和严密论证表达立场、解释意义并推动讨论的新闻体裁？","options":["新闻评论","特稿","新闻敏感","数据可视化"],"answers":["新闻评论"],"explanation":"新闻评论是以新闻事实和公共问题为对象，通过明确判断、充分论据和严密论证表达立场、解释意义并推动讨论的新闻体裁。它区别于消息的事实告知，也不同于无证据情绪表达。 事实尚未核实时抢先道德定性，会让评论建立在流沙上。","knowledgeId":"k149","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk150","subject":"新闻实务","chapter":"新闻实务 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：作者从新闻事实中提炼的中心问题与核心判断，决定论证方向和材料取舍？","options":["评论立意","新闻摄影","追问","新闻背景"],"answers":["评论立意"],"explanation":"评论立意是作者从新闻事实中提炼的中心问题与核心判断，决定论证方向和材料取舍。好立意应真实、公共、集中、新颖且可论证，既避免脱离事实拔高，也不满足于复述事件。 ‘有关部门应重视’通常不是有分析力的立意。","knowledgeId":"k150","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk152","subject":"新闻实务","chapter":"新闻实务 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：融事实报道与分析评论于一体的体裁，以较完整事实为基础，通过夹叙夹议揭示原因、趋势和意义？","options":["新闻述评","公益传播策划","消息写作","新闻评论"],"answers":["新闻述评"],"explanation":"新闻述评是融事实报道与分析评论于一体的体裁，以较完整事实为基础，通过夹叙夹议揭示原因、趋势和意义。‘述’提供可核实材料，‘评’必须紧扣材料并有明确边界，二者不可割裂。 评论比例高不等于深度，事实链不足会变成空论。","knowledgeId":"k152","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk160","subject":"新闻实务","chapter":"新闻实务 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕特定人物、事件或专业问题进行有明确主题、较充分准备和连续追问的深度访问报道？","options":["专访","新闻背景","调查性报道","采访提纲"],"answers":["专访"],"explanation":"专访是围绕特定人物、事件或专业问题进行有明确主题、较充分准备和连续追问的深度访问报道。专访既可呈现人物思想，也应通过证据和追问检验其说法，不是宣传性问答。 将公关提供的问题和答案原样发布不构成独立专访。","knowledgeId":"k160","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk161","subject":"新闻实务","chapter":"新闻实务 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕同一公共议题统筹采访资源、内容形态、平台节奏、用户服务和效果评估的生产方案？","options":["融合报道策划","版面语言","灾难报道","公益传播策划"],"answers":["融合报道策划"],"explanation":"融合报道策划是围绕同一公共议题统筹采访资源、内容形态、平台节奏、用户服务和效果评估的生产方案。它强调一次采集、统一核验、多元加工与持续更新，而不是把同一稿件机械复制到多个端口。 平台数量多不等于融合；内容重复会增加噪音而非信息。","knowledgeId":"k161","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk162","subject":"新闻实务","chapter":"新闻实务 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者将报道目标转化为背景事实、对象分工、核心问题、追问路径和证据需求的行动清单？","options":["采访提纲","新闻评论","特稿","新闻发现"],"answers":["采访提纲"],"explanation":"采访提纲是记者将报道目标转化为背景事实、对象分工、核心问题、追问路径和证据需求的行动清单。它帮助覆盖关键问题，但应随现场新信息动态调整，不是逐题照读的问卷。 向所有对象问相同问题会浪费其独特信息价值。","knowledgeId":"k162","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk164","subject":"新闻实务","chapter":"新闻实务 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：记者从社会生活、公开文件、数据变化、群众报料和专业领域中识别值得报道事实的过程？","options":["新闻发现","直播报道","科技报道","开放式提问"],"answers":["新闻发现"],"explanation":"新闻发现是记者从社会生活、公开文件、数据变化、群众报料和专业领域中识别值得报道事实的过程。它比新闻敏感更强调持续的信息渠道、案头监测和把线索转化为事实的工作机制。 热搜是线索来源之一，不应替代自主议题发现。","knowledgeId":"k164","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk165","subject":"新闻实务","chapter":"新闻实务 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：编辑围绕公共需求与媒体定位，对选题、资源、产品、时间、风险和评估进行统筹的过程？","options":["编辑策划","数据可视化","国际新闻写作","封闭式提问"],"answers":["编辑策划"],"explanation":"编辑策划是编辑围绕公共需求与媒体定位，对选题、资源、产品、时间、风险和评估进行统筹的过程。它连接价值判断与生产执行，既决定报道做什么，也决定如何协作、何时发布和如何纠错。 选题会不是泛泛头脑风暴；策划必须落实责任与资源。","knowledgeId":"k165","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk166","subject":"新闻实务","chapter":"新闻实务 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：报纸或数字页面通过位置、面积、标题字号、图片、色彩、留白和组合关系表达信息层级与编辑评价的方式？","options":["版面语言","事实核查流程","新闻摄影","追问"],"answers":["版面语言"],"explanation":"版面语言是报纸或数字页面通过位置、面积、标题字号、图片、色彩、留白和组合关系表达信息层级与编辑评价的方式。形式会影响读者先看什么、如何理解内容，因此必须与新闻价值和事实比例一致。 重大灾难使用娱乐化色彩和夸张图片会造成伦理错位。","knowledgeId":"k166","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk170","subject":"新闻实务","chapter":"新闻实务 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：根据分析任务把数据映射为位置、长度、颜色、面积或连接关系，帮助读者比较、观察趋势和理解结构？","options":["数据可视化","论证结构","事件通讯","编辑策划"],"answers":["数据可视化"],"explanation":"数据可视化是根据分析任务把数据映射为位置、长度、颜色、面积或连接关系，帮助读者比较、观察趋势和理解结构。图表选择必须匹配数据类型，保持比例、基线、单位和不确定性透明。 面积和三维图形容易夸大差异；双轴图可能制造虚假相关。","knowledgeId":"k170","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk171","subject":"新闻实务","chapter":"新闻实务 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：将可验证主张转化为透明证据结论的标准步骤：选题与拆解、追溯原始来源、验证时间地点与数据、联系主张者和专家、形成分级结论、公开证据与更新？","options":["事实核查流程","新闻述评","工作通讯","版面语言"],"answers":["事实核查流程"],"explanation":"事实核查流程是将可验证主张转化为透明证据结论的标准步骤：选题与拆解、追溯原始来源、验证时间地点与数据、联系主张者和专家、形成分级结论、公开证据与更新。 权威人士一句否认也不是最终证据，仍需展示可核查依据。","knowledgeId":"k171","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk172","subject":"新闻实务","chapter":"新闻实务 · 第4章","type":"单选题","prompt":"下列哪一概念符合这一描述：确认信息提供者身份、知情路径、专业能力、利益关系和材料真实性，并用独立来源交叉验证的过程？","options":["信源核验","深度报道","专访","图片新闻"],"answers":["信源核验"],"explanation":"信源核验是确认信息提供者身份、知情路径、专业能力、利益关系和材料真实性，并用独立来源交叉验证的过程。可信的人也可能只知局部，匿名信源更需编辑掌握真实身份和使用理由。 ‘内部人士’过于笼统，应说明其可知范围且保护身份。","knowledgeId":"k172","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk179","subject":"新闻实务","chapter":"新闻实务 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕适合声音表达的主题，设计受众、主持、叙事、采访、声音素材、单集结构、发布节奏和评估机制？","options":["播客策划","专访","图片新闻","突发事件报道"],"answers":["播客策划"],"explanation":"播客策划是围绕适合声音表达的主题，设计受众、主持、叙事、采访、声音素材、单集结构、发布节奏和评估机制。声音优势在于陪伴、亲密和长叙事，风险包括口述事实难核验、音乐版权和隐私暴露。 声音匿名不等于无法识别，口音、工作细节和环境声都可能暴露身份。","knowledgeId":"k179","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk180","subject":"新闻实务","chapter":"新闻实务 · 第5章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕公共利益问题，通过受众研究、行为目标、证据内容、渠道组合和效果评估促进认知、态度、行动或制度改变的方案？","options":["公益传播策划","开放式提问","新闻导语","新闻述评"],"answers":["公益传播策划"],"explanation":"公益传播策划是围绕公共利益问题，通过受众研究、行为目标、证据内容、渠道组合和效果评估促进认知、态度、行动或制度改变的方案。它不同于口号宣传，应尊重受众尊严并避免污名和情绪绑架。 恐惧广告可能吸引注意，却造成污名、逃避和对高风险群体的伤害。","knowledgeId":"k180","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk181","subject":"网络与新媒体","chapter":"网络与新媒体 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：相对于早期静态网页提出的互联网发展理念，强调用户参与、内容生成、社交连接、开放接口和持续迭代？","options":["Web 2.0","生成式人工智能","直播传播","网络舆情"],"answers":["Web 2.0"],"explanation":"Web 2.0是相对于早期静态网页提出的互联网发展理念，强调用户参与、内容生成、社交连接、开放接口和持续迭代。网站由信息展示页转向可互动的平台，用户既消费也生产数据和内容，但平台因此获得更强的数据与规则权力。 用户参与增加不等于权力平等，平台仍控制数据、接口和可见性。","knowledgeId":"k181","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk182","subject":"网络与新媒体","chapter":"网络与新媒体 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：以用户身份、关系网络和内容互动为基础，使个人与组织生产、分享、评论和再传播信息的平台？","options":["社交媒体","人机传播","自媒体","舆情生命周期"],"answers":["社交媒体"],"explanation":"社交媒体是以用户身份、关系网络和内容互动为基础，使个人与组织生产、分享、评论和再传播信息的平台。其信息流同时受社交关系、算法推荐和商业目标塑造，融合人际、大众和群体传播。 转发不等于认同，可能是批评、收藏或提醒。","knowledgeId":"k182","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk188","subject":"网络与新媒体","chapter":"网络与新媒体 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：在具有持续关系、共同兴趣或身份规范的群体中进行的信息交换？","options":["社群传播","短视频传播","网络舆情","数据权利"],"answers":["社群传播"],"explanation":"社群传播是在具有持续关系、共同兴趣或身份规范的群体中进行的信息交换。它依靠成员信任、内部语言、管理规则和重复互动，传播转化率高，但也可能形成排外、谣言闭环和群体压力。 群内转发多不能代表社会共识，往往只是高度同质成员。","knowledgeId":"k188","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk189","subject":"网络与新媒体","chapter":"网络与新媒体 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：围绕偶像、作品或品牌形成的情感认同、社群互动和参与生产实践，成员通过打榜、应援、同人和消费表达身份？","options":["粉丝文化","直播传播","舆情生命周期","被遗忘权"],"answers":["粉丝文化"],"explanation":"粉丝文化是围绕偶像、作品或品牌形成的情感认同、社群互动和参与生产实践，成员通过打榜、应援、同人和消费表达身份。它具有创造、互助和公共行动潜力，也受偶像工业、平台数据和商业规则组织。 高榜单数据可能由组织化劳动制造，不等于普通公众偏好。","knowledgeId":"k189","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk190","subject":"网络与新媒体","chapter":"网络与新媒体 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：特定网络群体围绕共同兴趣、身份或处境形成的符号、话语、审美和实践，与主流文化既区隔又互动？","options":["网络亚文化","人机传播","直播传播","舆情生命周期"],"answers":["网络亚文化"],"explanation":"网络亚文化是特定网络群体围绕共同兴趣、身份或处境形成的符号、话语、审美和实践，与主流文化既区隔又互动。它可提供身份表达和情绪出口，也可能被商业收编、污名化或演变为排他与伤害。 不要因陌生语言就将整个群体病理化或犯罪化。","knowledgeId":"k190","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk191","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：公众围绕社会事件在网络空间表达和聚合的认知、态度、情绪及行为倾向，以及其传播态势？","options":["网络舆情","智能传播","自媒体","数字鸿沟"],"answers":["网络舆情"],"explanation":"网络舆情是公众围绕社会事件在网络空间表达和聚合的认知、态度、情绪及行为倾向，以及其传播态势。舆情数据反映可见表达，不等于社会总体民意；分析需关注主体、议题、平台、情感、网络结构和演化。 删帖量下降可能只是可见性变化，不代表问题解决。","knowledgeId":"k191","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk193","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：不同群体在数字技术接入、使用能力、使用方式和实际收益上的系统差异？","options":["数字鸿沟","数字公共领域","用户生成内容","数字媒介素养"],"answers":["数字鸿沟"],"explanation":"数字鸿沟是不同群体在数字技术接入、使用能力、使用方式和实际收益上的系统差异。它包括设备网络的一阶鸿沟、技能与使用的二阶鸿沟，以及教育、就业、健康等收益的三阶鸿沟，并与年龄、收入、地区和残障交织。 把不会使用归因个人落后会忽视界面和制度排斥。","knowledgeId":"k193","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk194","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：个体接触、分析、评价、创造并负责任参与媒介传播的能力，包含理解媒介机构与商业逻辑、识别表征与偏见、核验信息、表达创作和伦理参与？","options":["媒介素养","社交媒体","粉丝文化","被遗忘权"],"answers":["媒介素养"],"explanation":"媒介素养是个体接触、分析、评价、创造并负责任参与媒介传播的能力，包含理解媒介机构与商业逻辑、识别表征与偏见、核验信息、表达创作和伦理参与。它不是单纯防骗技巧，也涉及公共权利。 只教育用户不要受骗，会忽视平台和机构的治理责任。","knowledgeId":"k194","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk195","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：在媒介素养基础上，理解数字平台、数据、算法、网络协作和安全风险，并能有效、批判和创造性参与数字社会的能力？","options":["数字媒介素养","平台社会","公民新闻","数字鸿沟"],"answers":["数字媒介素养"],"explanation":"数字媒介素养是在媒介素养基础上，理解数字平台、数据、算法、网络协作和安全风险，并能有效、批判和创造性参与数字社会的能力。它强调平台化环境中的隐私、推荐、数据足迹和在线权利。 熟练使用应用不等于数字媒介素养高，用户可能不理解数据代价。","knowledgeId":"k195","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk196","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：人们理解并批判性使用人工智能、算法推荐和自动决策媒介的能力，包括识别模型生成内容、评估训练数据与偏差、验证输出、保护隐私，并知道何时要求人工复核和申诉？","options":["智能媒介素养","数字公共领域","用户生成内容","数字媒介素养"],"answers":["智能媒介素养"],"explanation":"智能媒介素养是人们理解并批判性使用人工智能、算法推荐和自动决策媒介的能力，包括识别模型生成内容、评估训练数据与偏差、验证输出、保护隐私，并知道何时要求人工复核和申诉。 AI提示‘仅供参考’不能免除部署机构在医疗、就业等高风险场景的责任。","knowledgeId":"k196","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk198","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：个人和群体在数据收集、处理、流通和自动决策中享有的知情、同意、访问、更正、删除、限制处理、可携带和反对等权利集合，旨在约束数据权力并保障人格与公平？","options":["数据权利","自媒体","舆情生命周期","数字身份"],"answers":["数据权利"],"explanation":"数据权利是个人和群体在数据收集、处理、流通和自动决策中享有的知情、同意、访问、更正、删除、限制处理、可携带和反对等权利集合，旨在约束数据权力并保障人格与公平。具体内容依法律制度而异。 匿名化不是万能，位置和行为数据仍可能重新识别。","knowledgeId":"k198","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk200","subject":"网络与新媒体","chapter":"网络与新媒体 · 第2章","type":"单选题","prompt":"下列哪一概念符合这一描述：个人或组织在网络中由账号、自我呈现、行为数据、关系网络和系统评分共同构成的可识别形象？","options":["数字身份","舆情生命周期","被遗忘权","人机传播"],"answers":["数字身份"],"explanation":"数字身份是个人或组织在网络中由账号、自我呈现、行为数据、关系网络和系统评分共同构成的可识别形象。它既由主体主动管理，也由平台和他人数据化建构，可能跨场景拼接并影响机会。 一个账号的行为不能代表完整人格，跨场景画像容易语境坍塌。","knowledgeId":"k200","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk201","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：成员主要通过网络互动形成持续关系、共同规范、身份认同和资源交换的群体？","options":["虚拟社群","数字鸿沟","数字身份","智能传播"],"answers":["虚拟社群"],"explanation":"虚拟社群是成员主要通过网络互动形成持续关系、共同规范、身份认同和资源交换的群体。它不以地理共处为必要条件，但需要互动历史、成员边界和治理规则，不是偶然聚集的话题流量。 线上关系并非虚假，但其信任也可能被诈骗和商业化利用。","knowledgeId":"k201","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk203","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：由计算机图形、动作捕捉、语音合成和人工智能驱动的数字化角色，可由真人操控或自动生成，用于媒体、服务和娱乐？","options":["虚拟数字人","数字媒介素养","元宇宙传播","数字公共领域"],"answers":["虚拟数字人"],"explanation":"虚拟数字人是由计算机图形、动作捕捉、语音合成和人工智能驱动的数字化角色，可由真人操控或自动生成，用于媒体、服务和娱乐。其关键问题包括身份披露、拟人信任、劳动替代、版权和错误责任。 形象永不疲倦是技术表象，背后仍可能有大量真人标注和运营劳动。","knowledgeId":"k203","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk205","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：利用深度学习等技术合成或操纵人脸、声音和动作，使人物看似说过或做过实际未发生内容？","options":["深度伪造","隐私悖论","AIGC","社交媒体"],"answers":["深度伪造"],"explanation":"深度伪造是利用深度学习等技术合成或操纵人脸、声音和动作，使人物看似说过或做过实际未发生内容。它可用于影视无障碍和创作，也可用于诈骗、色情侵害、政治操纵和证据污染。 检测概率不是司法定论，应结合原文件、传播链和其他证据。","knowledgeId":"k205","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk206","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：学习数据分布后，根据指令生成新文本、图像、音频、视频或其他内容的模型系统？","options":["生成式人工智能","数据权利","深度伪造","短视频传播"],"answers":["生成式人工智能"],"explanation":"生成式人工智能是学习数据分布后，根据指令生成新文本、图像、音频、视频或其他内容的模型系统。大模型可通过预训练、微调和检索增强完成多任务，但没有人的理解与责任主体地位，输出受数据、模型和提示共同影响。 ‘像理解’不等于具有人类意图、经验和法律责任。","knowledgeId":"k206","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk208","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：人工智能、大数据、物联网和算法系统广泛参与信息采集、生产、分发、交互与治理的传播形态？","options":["智能传播","数字身份","人机传播","自媒体"],"answers":["智能传播"],"explanation":"智能传播是人工智能、大数据、物联网和算法系统广泛参与信息采集、生产、分发、交互与治理的传播形态。它通过感知、预测和自动化提高效率，同时使传播权力转向数据、模型与基础设施控制者。 自动化效率不能成为取消人工责任和公共价值判断的理由。","knowledgeId":"k208","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk210","subject":"网络与新媒体","chapter":"网络与新媒体 · 第3章","type":"单选题","prompt":"下列哪一概念符合这一描述：公民借助网络平台围绕公共事务获取信息、表达意见、协商和行动的空间？","options":["数字公共领域","媒介素养","虚拟社群","智能传播"],"answers":["数字公共领域"],"explanation":"数字公共领域是公民借助网络平台围绕公共事务获取信息、表达意见、协商和行动的空间。它扩大接入和多元表达，也受算法可见性、商业模式、网络暴力、操纵和数字鸿沟影响，呈现多中心且碎片化结构。 热搜和评论数量不能代表公共讨论质量。","knowledgeId":"k210","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk212","subject":"广告公关","chapter":"广告公关 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：品牌在目标消费者心智中相对于竞争者建立独特、相关且可信位置的战略选择？","options":["品牌定位","危机传播","品牌形象论","精准营销"],"answers":["品牌定位"],"explanation":"品牌定位是品牌在目标消费者心智中相对于竞争者建立独特、相关且可信位置的战略选择。它回答为谁、在哪个参照品类、提供何种核心利益以及凭什么相信，并指导产品、价格、渠道和传播。 传播口号不能替代产品兑现，定位过宽会失去选择。","knowledgeId":"k212","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1476"}},{"id":"rk213","subject":"广告公关","chapter":"广告公关 · 第1章","type":"单选题","prompt":"下列哪一概念符合这一描述：品牌名称和符号为产品或组织带来的增量价值，常由品牌知名度、感知质量、品牌联想、忠诚度及专有资产构成？","options":["品牌资产","形象修复理论","ROI理论","体验营销"],"answers":["品牌资产"],"explanation":"品牌资产是品牌名称和符号为产品或组织带来的增量价值，常由品牌知名度、感知质量、品牌联想、忠诚度及专有资产构成。它既表现为消费者偏好和溢价，也依赖长期一致体验与信任。 高知名度可能来自负面事件，不必然带来正资产。","knowledgeId":"k213","source":{"label":"知识卡改写；院校考试范围参考（并非院校真题）","url":"https://sjc.sysu.edu.cn/article/1
